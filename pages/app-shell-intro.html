<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Collabrium — App Shell</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="../collabrium-dls/tokens.css" />
<link rel="stylesheet" href="../collabrium-dls/components.css" />
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{font-family:var(--font-primary); color:var(--color-neutral-9);}

  /* .c-shell in components.css is pinned to a 480px demo height for
     the component gallery — this page is a real full-viewport shell,
     so the height is overridden here, not in components.css.
     position:relative makes it the containing block for the main nav's
     new absolute positioning below, so the nav's insets resolve against
     the shell, not the viewport at large. */
  .c-shell{height:100dvh; position:relative;}

  /* Top-center canvas date — "[Day], [Date]", e.g. "Wednesday, August
     5". position:fixed and centered on the full viewport (the DS's
     Page canvas — the whole warm background, not just the Content
     region to the right of the sidebar), not tied to the wipe/nav
     choreography, so it's already there under the wipe panel from
     first paint, same as the canvas itself. z-index sits above the
     plain canvas but below the wipe panel (100)/account menu (20)/
     hover label, so the wipe still sweeps over it correctly. Text/
     styling reuses Page header's own subtitle recipe (body2,
     Neutral-5) since there's no other "small label text on canvas"
     precedent to draw from. */
  .c-canvas-date{position:fixed; top:var(--spacing-24); left:50%; transform:translateX(-50%); z-index:5; margin:0; font-family:var(--font-primary); font-size:var(--text-body2-size); font-weight:var(--text-body2-weight); color:var(--color-neutral-5); pointer-events:none;}

  /* Content region — personalized greeting. Centered, unlike Page
     header (left-aligned title/subtitle, App Shell's documented
     top-of-screen pattern) — this is a different shape (a dashboard
     "hero" greeting, not the shell's structural header), so it's a new
     page-local block rather than a reuse of .c-shell-page-header.
     Still built from the same h1/body1 type tokens .c-shell-page-header
     itself uses, not new sizes — the only new thing here is the
     centered layout. Name is read from the sidebar account row's own
     .c-userpicker-name (see script below) rather than a second hardcoded
     "Bryan" — one source for the name, not two copies that can drift. */
  .c-canvas-greeting{text-align:center; padding:var(--spacing-60) var(--page-gutter) 0;}
  .c-canvas-greeting h1{margin:0 0 var(--spacing-8); font-family:var(--font-primary); font-size:var(--text-h1-size); font-weight:var(--text-h1-weight); color:var(--color-neutral-9);}
  .c-canvas-greeting p{margin:0; font-family:var(--font-primary); font-size:var(--text-body1-size); font-weight:var(--text-body1-weight); color:var(--color-neutral-5);}

  /* Blank placeholder cards — now a slider, not the Content region's
     fixed 4-column box grid (.c-shell-grid), since 8 cards at a
     "larger" width don't fit a static grid without either shrinking
     back down or wrapping to multiple rows — neither of which is what
     "slider content, drag or arrow keys to move" asks for. No slider/
     carousel component exists anywhere in this DS yet, so this is a
     new, page-local composition — built from Card's own .c-card fill/
     border/radius exactly, unmodified, laid out in a horizontally
     scrolling flex track instead of a grid. Drag-to-scroll and
     ArrowLeft/ArrowRight paging are handled in the script below;
     native scroll-snap does the actual per-card settling so the JS
     doesn't have to compute exact stop positions itself. */
  .c-card-slider{overflow-x:auto; scroll-snap-type:x proximity; cursor:grab; outline:none; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .c-card-slider::-webkit-scrollbar{display:none;}
  .c-card-slider:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:2px;}
  .c-card-slider.is-dragging{cursor:grabbing; scroll-snap-type:none; user-select:none;}
  .c-card-slider-track{display:flex; gap:var(--spacing-16); width:max-content; padding:4px 4px var(--spacing-8);}
  .c-card-slide{flex:0 0 340px; width:340px; min-height:280px; scroll-snap-align:start;}

  /* Main nav — position:absolute, floating overlay with a top z-index,
     not a flex sibling reserving row space anymore. Canvas content
     (.c-shell-main) is now the *only* in-flow flex child of .c-shell,
     so it fills the full row width/height on its own — its position
     and alignment (the centered greeting, the centered canvas date)
     no longer shift based on whether the nav is expanded, collapsed,
     or mid-slide-in. The nav paints on top of the canvas instead
     (z-index above plain content, below the wipe panel/account menu/
     hover label so those still layer correctly over it).
     top:0/left:0/bottom:0 + components.css's own untouched
     margin:16px 0 16px 16px (still applies to a position:absolute box
     exactly like it did in flow) is what reproduces the original 16px
     inset — no need to restate that spacing value here. Still starts
     off-screen and slides in via transform, same as before; transform
     composes fine with absolute positioning. */
  .c-sidebar-shell{position:absolute; top:0; left:0; bottom:0; z-index:50; transition:transform 450ms cubic-bezier(.16,1,.3,1); transform:translateX(-120%);}
  .c-sidebar-shell.is-in{transform:translateX(0);}

  /* Wipe intro: a single solid, slanted panel — off-screen left on load
     (so the warm canvas is what's actually visible first) — sweeps in,
     holds fully covering the viewport for a beat, then sweeps out to
     the right. skewX turns it into a parallelogram instead of a plain
     rectangle; left/right overscan (beyond -12deg's worst-case shift of
     ~50vh*tan(12deg)≈10.6vh at the top/bottom edges, from the default
     center transform-origin) keeps the slanted edges from ever exposing
     a gap at the viewport's top or bottom while it's in the "cover"
     resting position. transform order matters here: translateX is
     listed first (outermost), so it always shifts the *already-skewed*
     shape by a plain screen-space amount, independent of the skew. */
  .wipe-panel{position:fixed; top:0; bottom:0; left:-14vh; right:-14vh; z-index:100; background:var(--color-amber); transform:translateX(-160vw) skewX(-12deg); transition:transform 380ms cubic-bezier(.65,0,.35,1);}

  /* Sidebar footer — pin to the bottom. DESIGN-SYSTEM.md documents the
     Footer row as "pinned to the bottom (margin-top: auto)", but
     components.css actually ships a fixed margin-top:spacing-16 instead
     — a real gap between the spec and the component, not something App
     Shell invented. Overridden here at the page level (not in
     components.css) for the same reason .c-shell's height is: this
     page needs the documented behavior, but fixing the shared file
     isn't this page's call to make. .c-sidebar is already a stretched-
     height flex column (via the align-items:stretch chain from
     .c-shell down), so margin-top:auto has a real height to push
     against. The existing border-top (from components.css, untouched)
     is what reads as "a divider on top of the row" once this sits
     pinned at the bottom, directly above the account row below. */
  .c-sidebar-footer{margin-top:auto;}

  /* Sidebar footer — account row, now a menu trigger. Not a documented
     SidebarNav sub-part yet (DESIGN-SYSTEM.md's Footer row says
     "sign-out, account, or help slot" but specs no row anatomy of its
     own) — composed from UserPicker's existing avatar/name/role classes
     (.c-userpicker-*) rather than inventing new ones, same "compose,
     don't invent" rule App Shell follows elsewhere. It's a <button> now
     (was a plain div) since it opens the account menu below. Collapse
     behavior mirrors nav items: text hides, avatar stays and
     re-centers. */
  .c-sidebar-account{display:flex; align-items:center; gap:var(--spacing-12); width:100%; padding:var(--spacing-8) var(--spacing-12); margin-bottom:var(--spacing-4); border:none; background:transparent; border-radius:var(--radius-sm); font-family:inherit; text-align:left; cursor:pointer; transition:background-color var(--duration-fast) var(--ease-standard);}
  .c-sidebar-account:hover{background:var(--color-neutral-2);}
  .c-sidebar.is-collapsed .c-sidebar-account{justify-content:center; padding:var(--spacing-8) 0;}
  .c-sidebar.is-collapsed .c-sidebar-account .c-userpicker-text{display:none;}

  /* Account menu — opens above the trigger (it's pinned to the bottom,
     so there's no room below), Settings + Log out. No existing
     component covers "simple icon+label popover menu" exactly, so this
     follows the documented popover convention instead (shadow-3,
     radius-md, 1px Neutral-3 border, Neutral-1 fill — see
     DESIGN-SYSTEM.md's Elevation table: "shadow-3 | Popovers,
     dropdowns") with row hover reusing the same Neutral-2 token every
     other row/item hover in this system already uses. Click-outside +
     Escape to close matches UserPicker's/MultiSelect's own dropdown
     pattern.

     position:fixed, living outside .c-sidebar in the markup, JS-
     positioned against the trigger's own getBoundingClientRect() —
     not position:absolute nested inside the account row. .c-sidebar
     has overflow-x:hidden (never horizontally scrollable — see that
     rule's own comment in components.css), and a clipped ancestor
     clips absolutely-positioned descendants too, no matter their
     offsets, the exact same reason the collapsed sidebar-toggle button
     and the collapsed hover-label both already live outside .c-sidebar
     as shared, JS-positioned elements instead of nesting inside it. */
  .c-account-menu{display:none; position:fixed; width:200px; z-index:20; background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); box-shadow:var(--shadow-3); padding:var(--spacing-4); overflow:hidden;}
  .c-account-menu.is-open{display:block;}
  .c-account-menu-item{display:flex; align-items:center; gap:var(--spacing-12); width:100%; height:36px; padding:0 var(--spacing-8); border:none; background:transparent; border-radius:var(--radius-sm); font-family:var(--font-primary); font-size:var(--text-body1-size); font-weight:500; color:var(--color-neutral-9); text-align:left; cursor:pointer; transition:background-color var(--duration-fast) var(--ease-standard);}
  .c-account-menu-item:hover{background:var(--color-neutral-2);}
  .c-account-menu-item i{flex:none; font-size:16px; color:var(--color-neutral-5);}
</style>
</head>
<body>

  <div class="wipe-panel" id="wipePanel" aria-hidden="true"></div>

  <p class="c-canvas-date" id="canvasDate"></p>

  <div class="c-shell">
    <div class="c-sidebar-shell" id="shellSidebarShell">
      <nav class="c-sidebar" id="shellSidebarNav">
        <div class="c-sidebar-header">
          <div class="c-sidebar-logo">
            <img class="js-sidebar-logo-img"
                 src="../collabrium-dls/logo-lockups/collabrium-default-logo.svg"
                 data-expanded-src="../collabrium-dls/logo-lockups/collabrium-default-logo.svg"
                 data-collapsed-src="../collabrium-dls/SVG/coin.svg"
                 alt="Collabrium" />
          </div>
        </div>
        <div class="c-sidebar-section">Overview</div>
        <button class="c-sidebar-item active" type="button"><i class="ph-fill ph-house"></i><span class="label">Dashboard</span><span class="c-sidebar-hover-text">Dashboard</span></button>
        <button class="c-sidebar-item" type="button"><i class="ph-fill ph-chart-bar"></i><span class="label">Reports</span><span class="c-sidebar-hover-text">Reports</span></button>
        <div class="c-sidebar-footer">
          <button class="c-sidebar-account" type="button" id="accountMenuTrigger" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu">
            <span class="c-userpicker-avatar">BW</span>
            <span class="c-userpicker-text">
              <span class="c-userpicker-name">Bryan Wong</span>
              <span class="c-userpicker-role">Administrator</span>
            </span>
          </button>
        </div>
      </nav>
      <button class="c-sidebar-toggle js-sidebar-toggle" type="button" aria-label="Collapse sidebar" data-sidebar-toggle="shellSidebarNav">
        <svg class="js-sidebar-toggle-icon" viewBox="0 0 20 20" fill="none">
          <rect x="2.5" y="3.5" width="15" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
          <line x1="9" y1="3.5" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
          <path class="js-sidebar-toggle-arrow" d="M13.5 7 11 10l2.5 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="c-shell-main">
      <div class="c-shell-content">
        <div class="c-canvas-greeting">
          <h1><span id="greetingText"></span> <span aria-hidden="true">🌻</span>.</h1>
          <p>Here's what needs your eyes across the business today.</p>
        </div>
        <div class="c-card-slider" id="cardSlider" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Highlights" style="margin-top:var(--spacing-24)">
          <div class="c-card-slider-track">
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="c-sidebar-hover-label" id="shellSidebarHoverLabel" role="tooltip"></div>

  <div class="c-account-menu" id="accountMenu" role="menu" aria-hidden="true">
    <button class="c-account-menu-item" type="button" role="menuitem"><i class="ph-fill ph-gear"></i><span>Settings</span></button>
    <button class="c-account-menu-item" type="button" role="menuitem"><i class="ph-fill ph-sign-out"></i><span>Log out</span></button>
  </div>

<script>
(function () {
  // Top-center canvas date — "[Day], [Date]". No explicit locale passed
  // to toLocaleDateString, so it renders in whatever locale the user's
  // own browser/OS is set to ("follow system setting") rather than a
  // hardcoded "en-US" — weekday/month names and date order all follow
  // the visitor's actual system, not an assumption baked into the page.
  // Computed once on load, not a live-updating clock — this page has no
  // need to notice a real midnight rollover.
  const canvasDate = document.getElementById('canvasDate');
  if (canvasDate) {
    canvasDate.textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
    });
  }

  // Content region greeting — "Good [morning/afternoon/evening],
  // [First name]". Same "follow system setting" idea as the canvas
  // date above: the time-of-day segment is read from the visitor's own
  // system clock (new Date().getHours()), not hardcoded to "Good
  // morning" regardless of when the page is actually opened. First name
  // is read from the sidebar account row's own .c-userpicker-name text
  // (currently "Bryan Wong") rather than a second hardcoded "Bryan" —
  // one source for the name, so the greeting can't drift out of sync
  // with the account row if that name ever changes.
  const greetingText = document.getElementById('greetingText');
  if (greetingText) {
    const hour = new Date().getHours();
    const timeOfDay = hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';
    const fullName = document.querySelector('.c-userpicker-name');
    const firstName = fullName ? fullName.textContent.trim().split(' ')[0] : '';
    greetingText.textContent = `Good ${timeOfDay}, ${firstName}`;
  }

  // Card slider — drag (pointer events, so it works for mouse and touch
  // alike with one code path) and ArrowLeft/ArrowRight paging by one
  // card's own width + the track's gap. No slider/carousel component
  // exists in this DS yet, so this is new, minimal, page-local behavior
  // — not a port of anything. Native CSS scroll-snap (see .c-card-slide
  // in <style> above) handles the actual per-card settling; this script
  // only ever sets scrollLeft, never computes exact stop positions
  // itself.
  const cardSlider = document.getElementById('cardSlider');
  if (cardSlider) {
    let isDragging = false;
    let dragStartX = 0;
    let scrollLeftAtDragStart = 0;
    let didDrag = false; // distinguishes an actual drag from a plain click, so a click on a card isn't swallowed as a failed drag

    cardSlider.addEventListener('pointerdown', (e) => {
      isDragging = true;
      didDrag = false;
      dragStartX = e.clientX;
      scrollLeftAtDragStart = cardSlider.scrollLeft;
      cardSlider.classList.add('is-dragging');
      cardSlider.setPointerCapture(e.pointerId);
    });
    cardSlider.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      if (Math.abs(dx) > 3) didDrag = true;
      cardSlider.scrollLeft = scrollLeftAtDragStart - dx;
    });
    function endDrag() {
      isDragging = false;
      cardSlider.classList.remove('is-dragging');
    }
    cardSlider.addEventListener('pointerup', endDrag);
    cardSlider.addEventListener('pointercancel', endDrag);
    cardSlider.addEventListener('click', (e) => {
      if (didDrag) e.preventDefault(); // suppress the click a drag-release fires, so it doesn't read as a stray click on whatever's under the pointer
    });

    cardSlider.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const track = cardSlider.querySelector('.c-card-slider-track');
      const gap = track ? parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap) || 0 : 0;
      const card = cardSlider.querySelector('.c-card-slide');
      const step = (card ? card.getBoundingClientRect().width : 340) + gap;
      cardSlider.scrollBy({ left: e.key === 'ArrowRight' ? step : -step, behavior: 'smooth' });
    });
  }

  // SidebarNav — collapse/expand toggle. Swaps the logo asset itself
  // and the toggle icon's arrow direction. Pulled out into a named
  // function (ported logic, unmodified) so the auto-collapse timer
  // further down can drive the exact same state change a manual click
  // does — logo swap, arrow direction, aria-label all included — rather
  // than just toggling the class and leaving the toggle button's own
  // visual state out of sync.
  function setSidebarCollapsed(nav, sidebarToggle, collapsed) {
    if (nav.classList.contains('is-collapsed') === collapsed) return;
    nav.classList.toggle('is-collapsed', collapsed);
    sidebarToggle.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');

    const img = nav.querySelector('.js-sidebar-logo-img');
    img.src = collapsed ? img.dataset.collapsedSrc : img.dataset.expandedSrc;

    const arrow = sidebarToggle.querySelector('.js-sidebar-toggle-arrow');
    arrow.setAttribute('d', collapsed ? 'M11.5 7 14 10l-2.5 3' : 'M13.5 7 11 10l2.5 3');
  }
  document.addEventListener('click', (e) => {
    const sidebarToggle = e.target.closest('.js-sidebar-toggle');
    if (!sidebarToggle) return;
    const nav = document.getElementById(sidebarToggle.dataset.sidebarToggle);
    setSidebarCollapsed(nav, sidebarToggle, !nav.classList.contains('is-collapsed'));
  });

  // SidebarNav — collapsed hover label. Single shared, fixed-position
  // element; mouseover/mouseout (they bubble) rather than
  // mouseenter/mouseleave so it stays event-delegated. Ported from
  // collabrium-dls/preview.html's own implementation, unmodified.
  const hoverLabel = document.getElementById('shellSidebarHoverLabel');
  function showHoverLabel(item) {
    const nav = item.closest('.c-sidebar');
    const source = item.querySelector('.c-sidebar-hover-text');
    if (!hoverLabel || !nav || !nav.classList.contains('is-collapsed') || !source) return;
    const iconRect = item.querySelector('i').getBoundingClientRect();
    hoverLabel.textContent = source.textContent;
    hoverLabel.style.left = (iconRect.right + 8) + 'px';
    hoverLabel.style.top = (iconRect.top + iconRect.height / 2) + 'px';
    hoverLabel.style.transform = 'translateY(-50%)';
    hoverLabel.classList.add('is-visible');
  }
  function hideHoverLabel() {
    if (hoverLabel) hoverLabel.classList.remove('is-visible');
  }
  document.addEventListener('mouseover', (e) => {
    const item = e.target.closest('.c-sidebar-item');
    if (item && !item.contains(e.relatedTarget)) showHoverLabel(item);
  });
  document.addEventListener('mouseout', (e) => {
    const item = e.target.closest('.c-sidebar-item');
    if (item && !item.contains(e.relatedTarget)) hideHoverLabel();
  });
  document.addEventListener('focusin', (e) => {
    const item = e.target.closest('.c-sidebar-item');
    if (item) showHoverLabel(item);
  });
  document.addEventListener('focusout', (e) => {
    const item = e.target.closest('.c-sidebar-item');
    if (item) hideHoverLabel();
  });

  // Sidebar footer — account menu. Click the account row to toggle a
  // small popover (Settings, Log out) open above it. It's a shared,
  // position:fixed element living outside .c-sidebar (see its own CSS
  // comment for why — same clipping issue the collapsed hover-label
  // and sidebar-toggle button already solve the same way), so it's
  // positioned in JS against the trigger's own getBoundingClientRect(),
  // the same technique showHoverLabel() below already uses. Click-
  // outside and Escape close it, same pattern UserPicker's/MultiSelect's
  // own dropdowns already use elsewhere in this system. Settings/Log
  // out are inert here (no real settings screen or auth in this
  // stress-test page) — they just close the menu on click.
  const accountTrigger = document.getElementById('accountMenuTrigger');
  const accountMenu = document.getElementById('accountMenu');
  if (accountTrigger && accountMenu) {
    function positionAccountMenu() {
      const rect = accountTrigger.getBoundingClientRect();
      const menuWidth = accountMenu.offsetWidth || 200;
      const left = Math.max(8, Math.min(
        rect.left + rect.width / 2 - menuWidth / 2,
        window.innerWidth - menuWidth - 8
      ));
      accountMenu.style.left = left + 'px';
      accountMenu.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    }
    function closeAccountMenu() {
      accountMenu.classList.remove('is-open');
      accountMenu.setAttribute('aria-hidden', 'true');
      accountTrigger.setAttribute('aria-expanded', 'false');
    }
    function openAccountMenu() {
      positionAccountMenu();
      accountMenu.classList.add('is-open');
      accountMenu.setAttribute('aria-hidden', 'false');
      accountTrigger.setAttribute('aria-expanded', 'true');
    }
    accountTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = accountMenu.classList.contains('is-open');
      if (isOpen) closeAccountMenu(); else openAccountMenu();
    });
    accountMenu.addEventListener('click', (e) => {
      if (e.target.closest('.c-account-menu-item')) closeAccountMenu();
    });
    document.addEventListener('click', (e) => {
      if (!accountMenu.classList.contains('is-open')) return;
      if (e.target.closest('#accountMenu') || e.target.closest('#accountMenuTrigger')) return;
      closeAccountMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAccountMenu();
    });
  }

  // Wipe intro. Sequence: blank warm canvas → a single slanted panel
  // sweeps in from the left and holds, fully covering the viewport →
  // sweeps out to the right, uncovering the canvas again → blank warm
  // canvas, briefly → the main nav slides in from the left. Timed with
  // plain setTimeouts (not transitionend chaining) since the hold phase
  // has no property change of its own to key an event off of. Runs on
  // every load (no sessionStorage skip, by design). See
  // docs/superpowers/specs/2026-08-05-app-shell-intro-page-design.md.
  const wipePanel = document.getElementById('wipePanel');
  const sidebarShell = document.getElementById('shellSidebarShell');
  if (wipePanel && sidebarShell) {
    const PRE_HOLD_MS = 150;        // blank warm canvas, before the panel enters
    const ENTER_MS = 380;           // panel sweeps in, covering the viewport — must match .wipe-panel's transition-duration in <style> above
    const HOLD_COVER_MS = 700;      // panel sits fully covering the viewport (Amber, no flashing)
    const EXIT_MS = 380;            // panel sweeps out, uncovering the viewport — same transition-duration as ENTER_MS
    const POST_WIPE_HOLD_MS = 200;  // blank warm canvas again, after the panel exits, before the nav slides in
    const NAV_DURATION_MS = 450;    // must match .c-sidebar-shell's transition-duration in <style> above
    const AUTO_COLLAPSE_DELAY_MS = 2500; // how long the nav stays expanded, once fully settled, before auto-collapsing

    function hideWipePanel() {
      wipePanel.style.display = 'none';
    }
    function revealNav() {
      sidebarShell.classList.add('is-in');
    }
    // Auto-collapse the main nav a couple seconds after it's settled —
    // reuses setSidebarCollapsed (defined above, in the sidebar-toggle
    // section) so this drives the exact same state a manual click does
    // (logo swap, arrow direction, aria-label), not just the class.
    function autoCollapseNav() {
      const nav = document.getElementById('shellSidebarNav');
      const toggle = document.querySelector('[data-sidebar-toggle="shellSidebarNav"]');
      if (nav && toggle) setSidebarCollapsed(nav, toggle, true);
    }
    function enterCover() {
      wipePanel.style.transform = 'translateX(0) skewX(-12deg)';
    }
    function exitCover() {
      wipePanel.style.transform = 'translateX(160vw) skewX(-12deg)';
    }

    setTimeout(enterCover, PRE_HOLD_MS);
    setTimeout(exitCover, PRE_HOLD_MS + ENTER_MS + HOLD_COVER_MS);
    setTimeout(() => {
      hideWipePanel();
      setTimeout(() => {
        revealNav();
        setTimeout(autoCollapseNav, NAV_DURATION_MS + AUTO_COLLAPSE_DELAY_MS);
      }, POST_WIPE_HOLD_MS);
    }, PRE_HOLD_MS + ENTER_MS + HOLD_COVER_MS + EXIT_MS);

    // Fallback: guarantee the wipe panel hides, the nav reveals, and it
    // still auto-collapses even if something delays a timer (e.g. a
    // backgrounded/throttled tab) — all three functions are idempotent,
    // so this is harmless if the normal path already ran.
    setTimeout(() => {
      hideWipePanel();
      revealNav();
      setTimeout(autoCollapseNav, AUTO_COLLAPSE_DELAY_MS);
    }, PRE_HOLD_MS + ENTER_MS + HOLD_COVER_MS + EXIT_MS + POST_WIPE_HOLD_MS + 300);
  }
})();
</script>

</body>
</html>
