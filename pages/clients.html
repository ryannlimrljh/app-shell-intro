<style>
/* Pods, in the nav. Element marks are SVG files rather than Phosphor
   glyphs, so they sit inside the item's own <i> slot at the icon size:
   the collapsed rail's hover label anchors on that <i>, and an <img>
   in its place left the label with nothing to find. Everything else
   is the DS's sidebar item. A "soon" row is the DS's locked variant with
   its hover invitation removed, and its badge leaves with the label
   when the rail collapses, or the 72px rail would be the one place a
   badge ever sat beside a lone icon. */
.c-sidebar.is-collapsed .c-sidebar-item .c-badge{display:none;}
/* The one line that says what a pod is. Caption size at body weight,
   under the eyebrow it explains; it leaves with the labels when the
   rail collapses, where there is no room for a sentence. */
/* The logo as a home link, and the group the tour spotlights. The link
   hides in the collapsed rail exactly as the old trigger did; the
   collapsed coin stands in for it there. */
.c-sidebar-logo-home{display:inline-flex; align-items:center;}
.c-sidebar.is-collapsed .c-sidebar-logo-home{display:none;}
.c-nav-tree{display:flex; flex-direction:column; gap:var(--spacing-4); flex-shrink:0;}
/* Pod strip: one grey tray under the logo holding a mark per pod; the
   current pod sits on a white tab, segmented-control fashion. */
.c-pod-strip{display:flex; gap:var(--spacing-4); padding:var(--spacing-4); border-radius:var(--radius-sm); background:var(--color-neutral-2); flex-shrink:0;}
.c-sidebar.is-collapsed .c-pod-strip{justify-content:center;}
.c-sidebar.is-collapsed .c-pod-chip:not(.is-current){display:none;}
.c-pod-chip{flex:1 1 0; min-width:0; height:32px; display:inline-flex; align-items:center; justify-content:center; border-radius:calc(var(--radius-sm) - var(--spacing-4)); background:transparent; text-decoration:none; cursor:pointer; transition:background-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);} /* a cell of the tray, six sharing the width with no minimum so the last one keeps its margin; the inner radius is the tray's less its padding */
.c-pod-chip:hover{background:var(--color-neutral-1);}
.c-pod-chip img{width:var(--icon-base); height:var(--icon-base); display:block; object-fit:contain;}
.c-pod-chip i{font-size:var(--icon-base); line-height:1; color:var(--color-neutral-9);}
.c-pod-chip.soon img{filter:grayscale(1); opacity:.45;} /* not built yet: grey, not its element colour */
.c-pod-chip:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:2px;}
.c-pod-chip.is-current{background:var(--color-neutral-1); box-shadow:var(--shadow-1);} /* the white tab */
.c-pod-chip.soon{cursor:not-allowed;}
.c-pod-chip.soon:hover{background:transparent;}
/* The tip: the DS hover label, two lines, fixed so the sidebar's clip cannot cut it. */
.c-pod-tip{position:fixed; z-index:60; max-width:240px; padding:var(--spacing-8) var(--spacing-12); border-radius:var(--radius-sm); background:var(--color-neutral-7); color:var(--color-neutral-1); font-size:var(--text-caption-size); line-height:var(--text-caption-lh); font-weight:500; opacity:0; pointer-events:none; transition:opacity var(--duration-fast) var(--ease-standard);}
.c-pod-tip.is-visible{opacity:1;}
.c-pod-tip b{display:block; font-size:var(--text-label2-size); line-height:var(--text-label2-lh); font-weight:700;}
.c-pod-tip span{display:block; color:var(--color-neutral-3);}
/* The flyout: the pods as rows beside the collapsed rail. */
.c-pod-fly{position:fixed; z-index:60; width:272px; padding:var(--spacing-8); border-radius:var(--radius-md); background:var(--color-neutral-1); box-shadow:var(--shadow-2), var(--shadow-hairline); display:none; flex-direction:column; gap:var(--spacing-4);}
.c-pod-fly.is-open{display:flex;}
.c-pod-fly-row{display:flex; align-items:center; gap:var(--spacing-12); padding:var(--spacing-8); border-radius:var(--radius-sm); text-decoration:none; color:var(--color-neutral-9);}
.c-pod-fly-row:hover{background:var(--color-neutral-2);}
.c-pod-fly-row:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
.c-pod-fly-row[aria-disabled="true"]{color:var(--color-neutral-4); cursor:not-allowed;}
.c-pod-fly-row[aria-disabled="true"]:hover{background:transparent;}
.c-pod-fly-row .c-pod-chip{flex:none; width:32px; min-width:32px; background:var(--color-neutral-2); cursor:inherit;}
.c-pod-fly-row[aria-current] .c-pod-chip{background:var(--color-neutral-1); box-shadow:var(--shadow-hairline);}
.c-pod-fly-text{display:flex; flex-direction:column; min-width:0;}
.c-pod-fly-text b{font-size:var(--text-label1-size); line-height:var(--text-label1-lh); font-weight:700;}
.c-pod-fly-text small{font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}
.c-pod-fly-row[aria-disabled="true"] small{color:var(--color-neutral-4);}
.c-nav-group{padding:var(--spacing-8) var(--spacing-12) var(--spacing-4); font-size:var(--text-caption-size); line-height:var(--text-caption-lh); font-weight:500; letter-spacing:var(--text-caption-tracking); text-transform:none;} /* a shelf label inside a pod's menu: caption type, indented to the entries, quieter than the section label above the pods */
a.c-sidebar-item, a.c-nav-child{text-decoration:none;}
.c-nav-child.soon{color:var(--color-neutral-4); cursor:not-allowed;}
.c-nav-child.soon:hover{background:transparent;}
</style>
</head>
<body>

<div class="c-shell">
  <div class="c-sidebar-shell" id="shellSidebarShell">
    <nav class="c-sidebar" id="shellSidebarNav">
      <div class="c-sidebar-header">
        <!-- The logo is the home link it reads as. The way across to the
             other pods is the Pods section below, so nothing hides here. -->
          <a class="c-sidebar-logo-home" href="landing-v4_1.html" aria-label="Collabrium home"><span class="c-sidebar-logo-live-wrap"><iframe src="../collabrium-dls/logo.html" title="Collabrium" scrolling="no"></iframe></span></a>
        <img class="c-sidebar-logo-collapsed" src="../collabrium-dls/SVG/coin.svg" alt="Collabrium" />

      <!-- The nav is the pods map, rendered by shared/pods.js so every
           app draws the same one. A strip of boxed marks under the logo,

           hover says what each pod does, the grey boxes are not built yet.

      <div class="c-nav-tree" id="podsNav" data-pod="collabrium"></div>
      <script src="../shared/pods.js"></script>

                aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu">
          <span class="c-search-input-avatar">RL</span>

            <span class="c-search-input-subtitle">Super Admin</span>
          </span>

      </div>
    </nav>
    <button class="c-sidebar-toggle" type="button" aria-label="Collapse sidebar" id="sidebarToggle">
      <svg viewBox="0 0 20 20" fill="none">
        <rect x="2.5" y="3.5" width="15" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
        <line x1="9" y1="3.5" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
        <path id="sidebarArrow" d="M13.5 7 11 10l2.5 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="c-shell-main">
    <div class="c-shell-content">
      <div class="pg-wrap">
        <header class="pg-head">
          <div class="pg-title">
            <a class="pg-back" href="settings.html" aria-label="Back to Settings"><i class="ph ph-arrow-left"></i></a>
            <div>
              <h1>Client management</h1>
              <p class="sub">The clients people can pick when they create a campaign, and the brands the board and the hero cards show. A change here shows wherever the brand appears.</p>
            </div>
          </div>
          <div class="pg-head-right">
            <div class="va" id="viewingAs"></div>
          </div>
          <hr class="pg-rule" />
        </header>

        <div id="content"></div>
      </div>
    </div>
  </div>
</div>

<div class="c-sidebar-hover-label" id="shellSidebarHoverLabel" role="tooltip"></div>

<div class="c-account-menu" id="accountMenu" role="menu" aria-hidden="true">
  <a class="c-account-menu-item" href="settings.html" role="menuitem"><i class="ph-fill ph-gear"></i><span>Settings</span></a>
  <a class="c-account-menu-item" href="login-v1.html" role="menuitem"><i class="ph-fill ph-sign-out"></i><span>Log out</span></a>
</div>

<div class="al-overlay" id="overlay" aria-hidden="true">
  <div class="al-backdrop" data-close></div>
  <div class="c-modal al-modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>

<script>
/* A blank page tells nobody anything. If the page's own script fails before
   it paints, say so where the content would be, with a way to clear this
   browser's stored data, which is the usual cause after a stale load. */
window.addEventListener('error', function (e) {
  var c = document.getElementById('content');
  if (!c || c.children.length) return;
  var msg = (e && e.message) || 'Unknown error';
  c.innerHTML = '<div class="c-empty" style="max-width:520px;margin:48px auto"><i class="ph ph-warning-circle"></i>' +
    '<h4>This page could not load</h4><p>' + String(msg).replace(/[&<>]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]; }) +
    '</p><p>Reload with a fresh copy, or clear this browser\'s stored data for the prototype and reload.</p>' +
    '<button class="c-btn c-btn-secondary c-btn-md" type="button" onclick="[\'collabrium.access.directory\',\'collabrium.access.overrides\',\'collabrium.access.viewer\'].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});location.reload(true)">Clear stored data and reload</button></div>';
});
</script>
<script src="../shared/access.js?v=6"></script>
<script src="../shared/shell.js?v=4"></script>
<script src="../data/brand-logos.js"></script>
<script src="../shared/clients.js?v=1"></script>
<script>
/* Client management (4 Nov). The one list of clients and brands: the ones
   people can pick when they create a campaign, and the ones the board and
   the hero cards show, each with its logo. It reads and writes through
   shared/clients.js, which lays these edits over data/brand-logos.js for
   every page that shows a brand. Kept in this browser until the directory
   is served from the server. */
(function () {

  var A = window.CollabAccess, Sh = window.CollabShell, esc = Sh.esc;
  /* Gated as Users & roles is: whoever can invite to the workspace. */
  var GATE = 'Invite / add a user to the workspace';
  var viewer, ready = false;
  A.loadOverrides(localStorage);
  viewer = Sh.init({ onViewerChange: function (v) { viewer = v; if (ready) render(); } });
  function denied() {
    document.getElementById('content').innerHTML =
      '<div class="c-empty al-denied"><i class="ph ph-lock-simple"></i><h4>Admin only</h4>' +
      '<p>' + esc(document.querySelector('.pg-title h1').textContent + ' is for an Admin or Super Admin.') + '</p><a class="c-btn c-btn-secondary c-btn-md" href="settings.html">Back to Settings</a></div>';
  }
  function sortHead(cols, sort) {
    return cols.map(function (c) {
      if (!c.sort) return '<th scope="col"' + (c.right ? ' class="is-right"' : '') + (c.w ? ' style="width:' + c.w + '"' : '') + '>' + esc(c.label) + '</th>';
      var on = sort.key === c.key;
      return '<th scope="col"' + (c.w ? ' style="width:' + c.w + '"' : '') + ' aria-sort="' + (on ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none') + '">' +
        '<button type="button" class="al-sort" data-sort="' + c.key + '">' + esc(c.label) +
        '<i class="ph ' + (on ? (sort.dir > 0 ? 'ph-caret-up' : 'ph-caret-down') : 'ph-caret-up-down') + ' al-sorticon' + (on ? ' is-on' : '') + '" aria-hidden="true"></i></button></th>';
    }).join('');
  }
  function skeleton(cols, rows) {
    var sk = function (w, h) { return '<span class="al-sk" style="width:' + w + (h ? '; height:' + h : '') + '"></span>'; };
    var body = '';
    for (var i = 0; i < rows; i++) body += '<tr>' + cols.map(function (c, j) { return '<td>' + sk(j ? '60%' : '72%') + (j ? '' : '<span class="al-sk" style="width:48%; height:9px; margin-top:8px"></span>') + '</td>'; }).join('') + '</tr>';
    document.getElementById('content').innerHTML =
      '<div class="al-bar" aria-hidden="true"><div class="al-bar-left"><span class="al-sk al-sk-box" style="width:280px"></span><span class="al-sk al-sk-box" style="width:168px"></span></div></div>' +
      '<div class="al-count"><span class="al-sk" style="width:72px"></span></div>' +
      '<div class="al-tablewrap"><table class="c-table al-table" aria-hidden="true"><thead><tr>' +
      cols.map(function (c) { return '<th' + (c.w ? ' style="width:' + c.w + '"' : '') + '>' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  /* Bones for the roster's beat, then the page, so it lands in place. */
  var HOLD = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700;

  var C = window.CollabClients;
  var COLS = [
    { key: 'name', label: 'Client', sort: true, w: '27%' },
    { key: 'company', label: 'Company name', sort: true, w: '19%' },
    { key: 'domain', label: 'Website', sort: true, w: '17%' },
    { key: 'updated', label: 'Last updated', sort: true, w: '14%' },
    { key: 'active', label: 'Status', sort: true, w: '11%' },
    { key: 'acts', label: 'Actions', w: '12%', right: true }
  ];
  var state = { q: '', sort: { key: 'name', dir: 1 } };
  var by = function () { var n = document.querySelector('.c-search-input-title'); return n ? n.textContent.trim() : ''; };

  function ago(t) {
    if (!t) return '—';
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return 'Just now';
    var m = s / 60; if (m < 60) return Math.round(m) + (Math.round(m) === 1 ? ' minute ago' : ' minutes ago');
    var h = m / 60; if (h < 24) return Math.round(h) + (Math.round(h) === 1 ? ' hour ago' : ' hours ago');
    var d = h / 24; if (d < 1.5) return 'Yesterday'; if (d < 30) return Math.round(d) + ' days ago';
    var mo = Math.floor(d / 30.44); if (mo < 12) return mo + (mo === 1 ? ' month ago' : ' months ago');
    var y = Math.floor(mo / 12); return y + (y === 1 ? ' year ago' : ' years ago');
  }
  /* A brand nobody has edited carries only the date the directory was
     revised, so it counts in whole days: Today, not "3 hours ago". */
  function agoDay(t) {
    if (!t) return '—';
    var d0 = new Date(t), today = new Date(); d0 = new Date(d0.getUTCFullYear(), d0.getUTCMonth(), d0.getUTCDate()); today.setHours(0, 0, 0, 0);
    var n = Math.round((today - d0) / 864e5);
    return n <= 0 ? 'Today' : n === 1 ? 'Yesterday' : n < 30 ? n + ' days ago' : ago(t);
  }
  /* The brand's mark, as the board draws it: its live logo, or its
     initials when it has no website, the logo fails, or it comes back too
     small to read (under 32px, how a placeholder globe arrives). */
  window.__logoOk = window.__logoOk || {};
  function mark(c, big) {
    var url = C.logoUrl(c.domain), known = url ? window.__logoOk[url] : 0;
    return '<span class="al-logo' + (big ? ' is-big' : '') + (known === 1 ? ' has-logo' : '') + '" aria-hidden="true"><span class="ini">' + esc(C.initials(c.name)) + '</span>' +
      (url && known !== 0 ? '<img src="' + esc(url) + '" alt="" decoding="async" referrerpolicy="no-referrer" ' +
        'onload="var u=this.getAttribute(\'src\');if(this.naturalWidth<32){window.__logoOk[u]=0;this.remove()}else{window.__logoOk[u]=1;this.parentNode.classList.add(\'has-logo\')}" ' +
        'onerror="window.__logoOk[this.getAttribute(\'src\')]=0;this.remove()">' : '') + '</span>';
  }
  function rows(all) {
    var q = state.q.trim().toLowerCase();
    var list = all.filter(function (c) { return !q || (c.name + ' ' + c.company + ' ' + c.domain).toLowerCase().indexOf(q) >= 0; });
    var k = state.sort.key, dir = state.sort.dir;
    var val = function (c) { return k === 'updated' ? c.updated : k === 'active' ? (c.active ? 0 : 1) : String(c[k] || '￿').toLowerCase(); };
    return list.sort(function (a, b) { var x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir || a.name.localeCompare(b.name); });
  }

  function render() {
    if (!A.holds(viewer.role, GATE)) { denied(); return; }
    if (!document.getElementById('bar')) {
      document.getElementById('content').innerHTML =
        '<div class="al-bar" id="bar"><div class="al-bar-left"><div class="al-search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i>' +
        '<input type="text" id="q" placeholder="Search client, company or website" aria-label="Search clients" /></div></div>' +
        '<div class="al-bar-right"><button class="c-btn c-btn-ghost c-btn-md" type="button" id="resetAll" hidden>Undo my changes</button>' +
        '<button class="c-btn c-btn-primary c-btn-md" type="button" id="addClient"><i class="ph ph-plus"></i> Add new client</button></div></div>' +
        '<p class="al-note">Changes are kept in this browser for now, and show on the board and the hero cards straight away. To make one permanent for everyone, it goes into the brand directory.</p>' +
        '<div id="list"></div>';
      wire();
    }
    var all = C.list();
    document.getElementById('resetAll').hidden = !C.log().length;
    var list = rows(all);
    var h = '<div class="al-count" aria-live="polite"><span><b>' + list.length + '</b> ' + (list.length === 1 ? 'client' : 'clients') + (list.length !== all.length ? ' of ' + all.length : '') + '</span></div>' +
      '<div class="al-tablewrap"><table class="c-table al-table cl-table"><thead><tr>' + sortHead(COLS, state.sort) + '</tr></thead><tbody>';
    if (!list.length) h += '<tr><td colspan="6"><div class="c-empty al-empty"><i class="ph ph-buildings"></i><h4>' + (all.length ? 'No client matches' : 'No clients yet') + '</h4><p>' + (all.length ? 'Change the search, or add the client.' : 'Add the first one, and people can pick it for a campaign.') + '</p></div></td></tr>';
    list.forEach(function (c) {
      h += '<tr data-key="' + esc(c.key) + '" data-letter="' + letterOf(c.name) + '"><td><div class="cl-client">' + mark(c) + '<span class="al-strong">' + esc(c.name) + '</span></div></td>' +
        '<td>' + (c.company ? esc(c.company) : '<span class="al-muted" aria-label="No company name">—</span>') + '</td>' +
        '<td>' + (c.domain ? '<span class="al-muted">' + esc(c.domain) + '</span>' : '<span class="al-muted" aria-label="No website">—</span>') + '</td>' +
        '<td>' + esc(c.edited ? ago(c.updated) : agoDay(c.updated)) + '</td>' +
        '<td><span class="al-badge ' + (c.active ? 'is-active">Active' : 'is-inactive">Inactive') + '</span></td>' +
        '<td><div class="al-acts"><button class="al-icon" type="button" data-edit="' + esc(c.key) + '" aria-label="Edit ' + esc(c.name) + '"><i class="ph ph-pencil-simple"></i></button>' +
        '<button class="al-icon is-danger" type="button" data-remove="' + esc(c.key) + '" aria-label="Remove ' + esc(c.name) + '"><i class="ph ph-trash"></i></button></div></td></tr>';
    });
    h += '</tbody></table></div>';
    document.getElementById('list').innerHTML = h;
    /* The rail only means something in name order; sorted by anything
       else the letters are scattered, so it steps aside. */
    lastRows = state.sort.key === 'name' ? list : [];
    renderRail();
    spy();
  }

  /* ── A–Z rail: the Influencers page's jump-and-spy, as Users & roles
     has it. Letter counts come from the filtered list; a jump scrolls the
     shell's own scroll container to the first client with that letter,
     and the spy marks the letter of the row at the top as you scroll. ── */
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  var railEl = document.createElement('nav');
  railEl.className = 'al-rail'; railEl.id = 'rail'; railEl.hidden = true;
  railEl.setAttribute('aria-label', 'Jump to letter');
  document.body.appendChild(railEl);
  document.body.classList.add('has-rail');
  var scroller = document.querySelector('.c-shell-content');
  var lastRows = [];
  var REDUCED_RAIL = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function letterOf(name) {
    var c = String(name || '').trim().charAt(0).toUpperCase();
    return /[A-Z]/.test(c) ? c : '#';
  }
  function renderRail() {
    var counts = {};
    LETTERS.forEach(function (L) { counts[L] = 0; });
    lastRows.forEach(function (r) { counts[letterOf(r.name)] += 1; });
    railEl.hidden = !lastRows.length;
    document.body.classList.toggle('has-rail', !railEl.hidden);
    railEl.innerHTML = LETTERS.map(function (L) {
      var n = counts[L];
      return '<button class="al-rail-row' + (n ? '' : ' is-empty') + '" type="button" data-letter="' + L + '"' +
        (n ? ' title="' + n + '" aria-label="Jump to ' + (L === '#' ? 'symbols' : L) + ', ' + n + (n === 1 ? ' client' : ' clients') + '"' : ' tabindex="-1" aria-hidden="true"') + '>' +
        '<span class="al-rail-letter">' + L + '</span></button>';
    }).join('');
  }
  railEl.addEventListener('click', function (e) {
    var row = e.target.closest('.al-rail-row');
    if (!row || row.classList.contains('is-empty')) return;
    var target = document.querySelector('#list tr[data-letter="' + row.dataset.letter + '"]');
    if (!target || !scroller) return;
    /* land the row just under the pinned header */
    var head = document.querySelector('#list thead');
    var top = target.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - (head ? head.offsetHeight : 0);
    jumped = row.dataset.letter; jumpedAt = Date.now();
    /* Smooth only when the tab is actually being painted: a hidden pane
       stalls the animation clock and the glide never lands. */
    var glide = !REDUCED_RAIL && document.visibilityState === 'visible';
    scroller.scrollTo({ top: Math.max(0, top), behavior: glide ? 'smooth' : 'auto' });
    if (!glide) spy();
  });
  /* Squares the pinned header's corners once it is stuck. */
  function syncStick() {
    var table = document.querySelector('#list .al-table');
    if (!table || !scroller) return;
    table.classList.toggle('is-stuck', table.querySelector('thead').getBoundingClientRect().top <= scroller.getBoundingClientRect().top + 0.5);
  }
  /* Scroll-spy: the letter of the row that owns the top, under the header. */
  var spyTick = false, jumped = null, jumpedAt = 0;
  function spy() {
    syncStick();
    if (!scroller || railEl.hidden) return;
    var rows = document.querySelectorAll('#list tr[data-letter]');
    var head = document.querySelector('#list thead');
    var topEdge = scroller.getBoundingClientRect().top + (head ? head.offsetHeight : 0) + 24;
    var current = null;
    rows.forEach(function (tr) { if (tr.getBoundingClientRect().top <= topEdge) current = tr.dataset.letter; });
    if (!current && rows.length) current = rows[0].dataset.letter;
    /* At the very end the last letters can't scroll to the top: there the
       letter you jumped to stays marked, as long as its rows are in view. */
    var atEnd = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2;
    if (atEnd && jumped) {
      var j = document.querySelector('#list tr[data-letter="' + jumped + '"]');
      if (j && j.getBoundingClientRect().top < scroller.getBoundingClientRect().bottom) current = jumped;
    } else if (!atEnd && Date.now() - jumpedAt > 1200) jumped = null;   /* not mid-glide */
    railEl.querySelectorAll('.al-rail-row').forEach(function (b) { b.classList.toggle('is-active', b.dataset.letter === current); });
  }
  if (scroller) scroller.addEventListener('scroll', function () {
    if (spyTick) return;
    spyTick = true;
    setTimeout(function () { spyTick = false; spy(); }, 80);
  });

  function byKey(k) { return C.list().filter(function (c) { return c.key === k; })[0]; }
  function wire() {
    document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
    document.getElementById('addClient').addEventListener('click', function (e) { openEdit(null, e.currentTarget); });
    document.getElementById('resetAll').addEventListener('click', function (e) { openReset(e.currentTarget); });
    document.getElementById('content').addEventListener('click', function (e) {
      var s = e.target.closest('[data-sort]');
      if (s) {
        var k = s.dataset.sort;
        state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: k === 'updated' ? -1 : 1 };
        render();
        var again = document.querySelector('[data-sort="' + k + '"]'); if (again) again.focus();
        return;
      }
      var ed = e.target.closest('[data-edit]'); if (ed) { openEdit(byKey(ed.dataset.edit), ed); return; }
      var rm = e.target.closest('[data-remove]'); if (rm) openRemove(byKey(rm.dataset.remove), rm);
    });
  }

  /* ── The sheet ── */
  var overlay = document.getElementById('overlay'), modal = document.getElementById('modal'), returnTo = null;
  function open(html, focusSel) {
    modal.innerHTML = html;
    overlay.classList.add('is-open');
    overlay.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(function () { overlay.classList.add('is-shown'); });
    var f = modal.querySelector(focusSel); if (f) f.focus();
  }
  function close() {
    overlay.classList.remove('is-shown');
    overlay.setAttribute('aria-hidden', 'true');
    setTimeout(function () { overlay.classList.remove('is-open'); modal.innerHTML = ''; }, 260);
    if (returnTo && document.contains(returnTo)) returnTo.focus();
  }
  overlay.addEventListener('click', function (e) { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', function (e) {
    if (!overlay.classList.contains('is-open')) return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key === 'Tab') {   /* keep focus inside the sheet */
      var f = modal.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  var head = function (title, sub) {
    return '<div class="c-modal-head"><div><h4 id="modalTitle">' + esc(title) + '</h4><p class="sub">' + esc(sub) + '</p></div>' +
      '<button class="al-x" type="button" data-close aria-label="Close"><i class="ph ph-x"></i></button></div>';
  };
  /* "https://www.shopee.com.my/shop" -> "shopee.com.my" */
  function cleanDomain(v) { return String(v || '').trim().toLowerCase().replace(/^[a-z]+:\/\//, '').replace(/^www\./, '').replace(/[\/?#].*$/, ''); }
  var DOMAIN_OK = /^[a-z0-9-]+(\.[a-z0-9-]+)+$/;
  function openEdit(c, from) {
    returnTo = from;
    var isAdd = !c, active = c ? c.active : true;
    open(head(isAdd ? 'Add new client' : 'Edit client', isAdd ? 'People can pick it as soon as it is added.' : 'The change shows wherever ' + c.name + ' appears.') +
      '<form class="c-modal-body" id="clientForm" novalidate>' +
        '<div class="cl-preview" aria-hidden="true"><span id="fMark"></span><span><b id="fPrevName"></b><small id="fPrevSrc"></small></span></div>' +
        '<div class="al-f"><label for="fName">Client</label><input type="text" id="fName" maxlength="80" autocomplete="off" value="' + esc(c ? c.name : '') + '" aria-describedby="fNameErr" />' +
        '<span class="err" id="fNameErr" hidden></span></div>' +
        '<div class="al-f"><label for="fCo">Company name <span class="opt">(optional)</span></label><input type="text" id="fCo" maxlength="120" autocomplete="off" value="' + esc(c ? c.company : '') + '" /></div>' +
        '<div class="al-f"><label for="fWeb">Website <span class="opt">(optional, for the logo)</span></label><input type="text" id="fWeb" maxlength="120" autocomplete="off" inputmode="url" placeholder="e.g. shopee.com.my" value="' + esc(c ? c.domain : '') + '" aria-describedby="fWebErr fWebHelp" />' +
        '<span class="help" id="fWebHelp">The logo comes from the brand\'s own website. Leave it empty and the initials show.</span><span class="err" id="fWebErr" hidden></span></div>' +
        '<button class="al-switch" type="button" role="switch" id="fActive" aria-checked="' + active + '"><span class="c-switch-track" aria-hidden="true"><span class="c-switch-thumb"></span></span>' +
          '<span>Active<small>Inactive clients stay on their campaigns and the board but can no longer be picked.</small></span></button>' +
      '</form>' +
      '<div class="c-modal-foot"><button class="c-btn c-btn-secondary c-btn-md" type="button" data-close>Cancel</button>' +
      '<button class="c-btn c-btn-primary c-btn-md" type="submit" form="clientForm">' + (isAdd ? 'Add client' : 'Save changes') + '</button></div>', '#fName');
    var nameEl = document.getElementById('fName'), webEl = document.getElementById('fWeb'), t = null;
    /* the preview: the mark as it will show everywhere, a beat after typing */
    function preview() {
      var box = document.getElementById('fMark');
      if (!box) return;   /* the sheet closed before the typing pause ran out */
      var d = cleanDomain(webEl.value), name = nameEl.value.trim() || 'New client';
      box.innerHTML = mark({ name: name, domain: DOMAIN_OK.test(d) ? d : '' }, true);
      document.getElementById('fPrevName').textContent = name;
      document.getElementById('fPrevSrc').textContent = DOMAIN_OK.test(d) ? 'Logo from ' + d : 'Initials until a website is added';
    }
    preview();
    [nameEl, webEl].forEach(function (el) { el.addEventListener('input', function () { clearTimeout(t); t = setTimeout(preview, 350); }); });
    var sw = document.getElementById('fActive');
    sw.addEventListener('click', function () { sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true')); });
    document.getElementById('clientForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var nErr = document.getElementById('fNameErr'), wErr = document.getElementById('fWebErr');
      var name = nameEl.value.trim().replace(/\s+/g, ' '), company = document.getElementById('fCo').value.trim(), domain = cleanDomain(webEl.value);
      var clash = C.list().filter(function (x) { return (!c || x.key !== c.key) && x.name.toLowerCase() === name.toLowerCase(); })[0];
      var nMsg = !name ? 'Give the client a name.' : clash ? clash.name + ' is already a client.' : '';
      var wMsg = domain && !DOMAIN_OK.test(domain) ? 'That doesn\'t look like a website. Try something like shopee.com.my.' : '';
      nErr.textContent = nMsg; nErr.hidden = !nMsg; nameEl.setAttribute('aria-invalid', String(!!nMsg));
      wErr.textContent = wMsg; wErr.hidden = !wMsg; webEl.setAttribute('aria-invalid', String(!!wMsg));
      if (nMsg) { nameEl.focus(); return; }
      if (wMsg) { webEl.focus(); return; }
      C.save({ key: c && c.key, name: name, company: company, domain: domain, active: sw.getAttribute('aria-checked') === 'true' }, by());
      close(); render();
      Sh.toast('success', isAdd ? 'Client added' : 'Changes saved', isAdd ? name + ' can now be picked for a campaign.' : name + ' is up to date everywhere it shows.');
    });
  }
  function openRemove(c, from) {
    returnTo = from;
    open(head('Remove ' + c.name + '?', 'People will no longer be able to pick it for a campaign.') +
      '<div class="c-modal-body"><p style="margin:0">Campaigns already made with ' + esc(c.name) + ' keep it, and its deals stay on the board without its logo. To stop it being picked without removing it, mark it inactive instead.</p></div>' +
      '<div class="c-modal-foot"><button class="c-btn c-btn-secondary c-btn-md" type="button" data-close>Cancel</button>' +
      '<button class="c-btn c-btn-md al-btn-danger" type="button" id="confirmRemove">Remove client</button></div>', '[data-close].c-btn');
    document.getElementById('confirmRemove').addEventListener('click', function () {
      C.remove(c.key, by());
      returnTo = document.getElementById('addClient');
      close(); render();
      Sh.toast('neutral', 'Client removed', c.name + ' can no longer be picked for a campaign.');
    });
  }
  function openReset(from) {
    returnTo = from;
    open(head('Undo my changes?', 'Every client goes back to the brand directory as it was.') +
      '<div class="c-modal-body"><p style="margin:0">The clients you added, edited or removed in this browser go back to how the directory has them. The Activity log forgets those changes too.</p></div>' +
      '<div class="c-modal-foot"><button class="c-btn c-btn-secondary c-btn-md" type="button" data-close>Cancel</button>' +
      '<button class="c-btn c-btn-md al-btn-danger" type="button" id="confirmReset">Undo changes</button></div>', '[data-close].c-btn');
    document.getElementById('confirmReset').addEventListener('click', function () {
      C.reset();
      returnTo = document.getElementById('addClient');
      close(); render();
      Sh.toast('neutral', 'Changes undone', 'The clients match the brand directory again.');
    });
  }

  if (A.holds(viewer.role, GATE)) skeleton(COLS, 10);
  setTimeout(function () { ready = true; render(); }, HOLD);
})();
</script>
</body>
</html>
