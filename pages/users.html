<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Collabrium · Users &amp; roles</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="../collabrium-dls/tokens.css?v=f278e40" />
<link rel="stylesheet" href="../collabrium-dls/components.css?v=f278e40" />

<style>
  /* ── Toolbar ─────────────────────────────────────────────────────── */
  .us-bar{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-12);
    flex-wrap:wrap; margin-bottom:var(--spacing-8);}
  .us-bar-left{display:flex; align-items:center; gap:var(--spacing-8); flex-wrap:wrap;}
  .us-bar-right{display:flex; align-items:center; gap:var(--spacing-12); flex-wrap:wrap;
    font-size:var(--text-caption-size); color:var(--color-neutral-5);}
  .us-search{position:relative;}
  .us-search i{position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color:var(--color-neutral-5); font-size:var(--icon-sm); pointer-events:none;}
  .us-search input{height:36px; width:260px; max-width:100%; padding:0 12px 0 34px;
    border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm);
    font-family:inherit; font-size:var(--text-body2-size); background:var(--color-neutral-1);}
  .us-search input:focus{outline:none; border:2px solid var(--color-obsidian); padding:0 11px 0 33px;}
  .us-sep{width:1px; height:24px; background:var(--color-neutral-3); margin:0 var(--spacing-4);}
  /* A filter pill: the design system's filter trigger and panel. Every
     toggle applies at once; the panel stays open while the rows move. */
  .us-pill{position:relative;}
  .us-pill .c-filter-panel{z-index:40;}
  .us-pill .c-filter-option .n{color:var(--color-neutral-4); margin-left:4px;}
  .us-pill .c-filter-option input{position:absolute; opacity:0; width:0; height:0;}
  .us-note{font-size:var(--text-caption-size); color:var(--color-neutral-5); margin:0 0 var(--spacing-16);}
  .us-count{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-12);
    flex-wrap:wrap; font-size:var(--text-caption-size); color:var(--color-neutral-5); margin-bottom:var(--spacing-8);}
  .us-count b{color:var(--color-neutral-9);}
  .us-pager{display:flex; align-items:center; gap:var(--spacing-8);}
  .us-pager select{height:28px; border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm);
    font-family:inherit; font-size:var(--text-caption-size); background:var(--color-neutral-1);}
  .us-pager button{width:28px; height:28px; border:1px solid transparent; border-radius:var(--radius-pill);
    background:transparent; font-family:inherit; font-size:var(--text-caption-size); font-weight:700;
    color:var(--color-neutral-9); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .us-pager button:hover:not(:disabled){background:var(--color-neutral-2);}
  .us-pager button[aria-current="page"]{background:var(--color-obsidian); color:var(--color-neutral-1);}
  .us-pager button:disabled{color:var(--color-neutral-4); cursor:default;}

  /* ── Table ───────────────────────────────────────────────────────── */
  .us-tablewrap{background:var(--color-neutral-1); border:1px solid var(--color-neutral-3);
    border-radius:var(--radius-lg); overflow:auto;}
  .us-table{min-width:960px;}
  .us-table th{background:var(--color-canvas-warm-card); white-space:nowrap; cursor:pointer; user-select:none;}
  .us-table th .arr{font-size:10px; margin-left:4px; color:var(--color-neutral-4);}
  .us-table th.is-sorted .arr{color:var(--color-neutral-9);}
  .us-sort{border:none; background:transparent; padding:0; font:inherit; color:inherit; text-transform:inherit; letter-spacing:inherit; cursor:pointer; display:inline-flex; align-items:center;}
  .us-sort:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:2px;}
  .us-table th:first-child, .us-table td:first-child{padding-left:var(--spacing-16);}
  .us-table tbody tr{cursor:default;}
  .us-table td{vertical-align:top;}
  .us-name{font-weight:600; color:var(--color-neutral-9); display:flex; align-items:center; gap:var(--spacing-8);}
  .us-sub{font-size:var(--text-caption-size); color:var(--color-neutral-5); margin-top:2px;}
  .us-sub.warn{color:var(--color-neutral-5); font-style:italic;}
  .us-hubs{display:flex; gap:4px; flex-wrap:wrap;}
  .us-ext{color:var(--color-neutral-5);}
  tr.is-off td{opacity:.55;}
  .us-edit{width:32px; height:32px; border:none; background:transparent; border-radius:var(--radius-sm);
    color:var(--color-neutral-5); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .us-edit:hover{background:var(--color-neutral-2); color:var(--color-neutral-9);}
  .us-empty{padding:var(--spacing-40);}

  /* ── Admin-only state ────────────────────────────────────────────── */
  .us-denied{max-width:420px; margin:var(--spacing-60) auto;}
  .us-denied a{text-decoration:none;}

  /* ── The modal: the Influencers page's card modal, ported. A warm-canvas
     backdrop at .88 rather than a black veil, and the panel swings open out
     of the element you clicked (the pencil, or Add new user) via the same
     parameterised FLIP keyframes (--sw-dx/-dy/-sx/-sy/-dir set from JS at
     open and close), folding back into it on close. ── */
  .us-cardmodal{position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center; perspective:1200px;}
  .us-cardmodal.is-open{display:flex;}
  .us-cardmodal-backdrop{position:absolute; inset:0;
    background:var(--color-canvas-warm); opacity:0;
    transition:opacity .32s var(--ease-standard);}
  .us-cardmodal.is-shown .us-cardmodal-backdrop{opacity:.88; transition-duration:.5s;}
  .us-modal{position:relative; display:flex; flex-direction:column; max-width:none; overflow:hidden;
    width:min(520px, calc(100vw - var(--spacing-32)));
    max-height:min(780px, calc(100dvh - var(--spacing-60)));
    background:var(--color-neutral-1); border:1px solid var(--color-neutral-3);
    border-radius:var(--radius-lg); box-shadow:0 25px 50px -12px rgba(0,0,0,.25);
    transform-origin:top left; opacity:0; transition:opacity .3s var(--ease-standard);}
  .us-cardmodal.is-shown .us-modal{opacity:1;}
  .us-modal.is-swinging-open{animation:us-swing-open .8s cubic-bezier(.25,.9,.35,1) both;}
  .us-modal.is-swinging-closed{animation:us-swing-close .55s cubic-bezier(.3,.6,.35,1) both;}
  @keyframes us-swing-open{
    0%{transform:translate(var(--sw-dx, 0px), var(--sw-dy, 0px)) scale(var(--sw-sx, 1), var(--sw-sy, 1)); opacity:.4;}
    45%{transform:translate(calc(var(--sw-dx, 0px) * .5), calc(var(--sw-dy, 0px) * .5)) scale(.7) rotateY(calc(48deg * var(--sw-dir, 1))) rotateZ(calc(-7deg * var(--sw-dir, 1))); opacity:1;}
    78%{transform:translate(0px, 0px) scale(1) rotateY(calc(-7deg * var(--sw-dir, 1))) rotateZ(calc(1deg * var(--sw-dir, 1)));}
    100%{transform:none; opacity:1;}
  }
  @keyframes us-swing-close{
    0%{transform:none; opacity:1;}
    50%{transform:translate(calc(var(--sw-dx, 0px) * .5), calc(var(--sw-dy, 0px) * .5)) scale(.7) rotateY(calc(45deg * var(--sw-dir, 1))) rotateZ(calc(-6deg * var(--sw-dir, 1))); opacity:1;}
    100%{transform:translate(var(--sw-dx, 0px), var(--sw-dy, 0px)) scale(var(--sw-sx, 1), var(--sw-sy, 1)); opacity:.35;}
  }
  @media (prefers-reduced-motion:reduce){
    .us-modal.is-swinging-open, .us-modal.is-swinging-closed{animation:none;}
  }
  .us-modal .c-modal-head{flex:none; align-items:flex-start; padding:var(--spacing-20) var(--spacing-24) var(--spacing-12); border-bottom:1px solid var(--color-neutral-3);}
  .us-modal .c-modal-head .sub{margin:2px 0 0; font-size:var(--text-body2-size); color:var(--color-neutral-5); font-weight:400;}
  .us-modal .c-modal-body{flex:1; min-height:0; overflow-y:auto; padding:var(--spacing-20) var(--spacing-24); display:flex; flex-direction:column; gap:var(--spacing-16);}
  .us-modal .c-modal-body > *{flex:none;} /* a column child with overflow set would otherwise shrink to fit */
  .us-modal .c-modal-foot{flex:none; align-items:center; padding:var(--spacing-16) var(--spacing-24); background:var(--color-neutral-1);}

  /* ── A–Z rail, the Influencers page's, ported: small grey letters, the
     current one in ink, letters with nothing to jump to faded near-out. It
     takes the strip the scrollbar used, so the scrollbar goes. ── */
  .c-shell .c-shell-content{scrollbar-width:none; -ms-overflow-style:none;}
  .c-shell .c-shell-content::-webkit-scrollbar{width:0; height:0;}
  .us-rail{position:fixed; right:6px; top:50%; transform:translateY(-50%);
    width:24px; z-index:20; display:flex; flex-direction:column; align-items:center; gap:7px;}
  .us-rail-row{display:flex; align-items:center; justify-content:center;
    border:0; background:none; padding:0; cursor:pointer; font-family:inherit; line-height:1;}
  .us-rail-letter{width:22px; text-align:center; font-size:12px; font-weight:600; color:var(--color-neutral-4);
    transition:color var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-settle);}
  .us-rail-row:hover .us-rail-letter{color:var(--color-neutral-9); transform:translateX(-2px) scale(1.15);}
  .us-rail-row.is-active .us-rail-letter{color:var(--color-neutral-9); font-weight:800;}
  .us-rail-row.is-empty{cursor:default; pointer-events:none;}
  .us-rail-row.is-empty .us-rail-letter{color:var(--color-neutral-3);}
  .us-rail-row:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:1px; border-radius:var(--radius-sm);}
  @media (max-height:760px){ .us-rail{gap:4px;} .us-rail-letter{font-size:11px;} }
  @media (max-height:620px){ .us-rail{gap:2px;} .us-rail-letter{font-size:10px;} }
  @media (max-width:640px){ .us-rail{display:none;} }
  /* The rail takes the right edge, so the page keeps clear of it. */
  @media (min-width:641px){ .pg-wrap{padding-right:var(--spacing-60);} }

  /* ── Skeleton first paint: bones in the shape of the toolbar and the
     table, swapped for the real thing after a short beat so the page lands
     in place instead of popping. Same pulse as the roster and campaigns
     pages. ── */
  .us-sk{display:block; height:12px; border-radius:var(--radius-sm); background:var(--color-neutral-2);}
  .us-sk-pill{height:20px; border-radius:var(--radius-pill);}
  .us-sk-box{height:36px; border-radius:var(--radius-sm); border:1px solid var(--color-neutral-3); background:var(--color-neutral-1);}
  .us-sk-btn{height:32px; width:150px; border-radius:var(--radius-sm); background:var(--color-neutral-2);}
  .us-sk-dot{width:24px; height:24px; border-radius:var(--radius-pill); background:var(--color-neutral-2);}
  .us-sk-row td{padding-top:14px; padding-bottom:14px;}
  @media (prefers-reduced-motion:no-preference){
    .us-sk, .us-sk-btn, .us-sk-dot{animation:us-sk-pulse 1.4s var(--ease-standard) infinite;}
    @keyframes us-sk-pulse{0%,100%{opacity:1;} 50%{opacity:.45;}}
  }
  /* What the role can do: the artifact's activity matrix, read-only, folded
     under the description so the sheet stays short until someone asks. */
  .us-acts{border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm); overflow:hidden;}
  .us-acts-toggle{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-8); width:100%;
    padding:var(--spacing-12); border:none; background:var(--color-neutral-1); font-family:inherit; font-size:var(--text-body2-size);
    font-weight:700; color:var(--color-neutral-9); cursor:pointer; text-align:left;}
  .us-acts-toggle:hover{background:var(--color-neutral-2);}
  .us-acts-toggle:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
  .us-acts-toggle .n{font-weight:500; color:var(--color-neutral-5);}
  .us-acts-toggle i{flex:none; font-size:16px; line-height:1; color:var(--color-neutral-5); transition:transform var(--duration-fast) var(--ease-standard);}
  .us-acts-toggle[aria-expanded="true"] i{transform:rotate(180deg);}
  .us-acts-body{padding:var(--spacing-4) var(--spacing-12) var(--spacing-12); border-top:1px solid var(--color-neutral-3);}
  .us-acts-body[hidden]{display:none;}
  .us-act-cat{font-size:var(--text-label3-size); font-weight:700; letter-spacing:var(--tracking-eyebrow); text-transform:uppercase;
    color:var(--color-neutral-5); margin:var(--spacing-12) 0 var(--spacing-4); padding-bottom:4px; border-bottom:1px solid var(--color-neutral-3);}
  .us-act{display:flex; align-items:flex-start; gap:var(--spacing-8); padding:4px 0; font-size:var(--text-caption-size); color:var(--color-neutral-9); line-height:1.4;}
  .us-act.off{color:var(--color-neutral-4);}
  .us-act .c-checkbox-box{width:16px; height:16px; margin-top:1px; border-radius:4px; font-size:11px;}
  .us-acts-foot{margin-top:var(--spacing-12); padding-top:var(--spacing-8); border-top:1px solid var(--color-neutral-3); font-size:var(--text-caption-size); color:var(--color-neutral-5);}
  .us-acts-foot a{color:var(--color-neutral-9); font-weight:700; text-decoration:none; white-space:nowrap;}
  .us-acts-foot a:hover{text-decoration:underline;}
  .us-act.off .c-checkbox-box{background:var(--color-neutral-1); border-color:var(--color-neutral-3);}
  .us-x{border:none; background:transparent; width:32px; height:32px; margin:-4px -8px 0 0; border-radius:var(--radius-sm);
    cursor:pointer; color:var(--color-neutral-5); display:inline-flex; align-items:center; justify-content:center;}
  .us-x:hover{background:var(--color-neutral-2); color:var(--color-neutral-9);}
  .us-f{display:flex; flex-direction:column; gap:var(--spacing-4);}
  .us-f > label, .us-f > .lab{font-size:var(--text-label1-size); font-weight:700;}
  .us-f input[type="text"], .us-f select{height:40px; border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm);
    padding:0 var(--spacing-12); font-family:inherit; font-size:var(--text-body2-size); background:var(--color-neutral-1); width:100%;}
  .us-f input[type="text"]:focus, .us-f select:focus{outline:none; border:2px solid var(--color-obsidian); padding:0 11px;}
  /* One chevron for every dropdown in the sheet: the same 16px caret at
     the same 12px inset as the checklist toggle's, not the browser's own. */
  .us-f select{-webkit-appearance:none; appearance:none; padding-right:40px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' width='16' height='16'><path fill='none' stroke='%23525252' stroke-width='16' stroke-linecap='round' stroke-linejoin='round' d='M208 96l-80 80-80-80'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; background-size:16px 16px;}
  .us-f select:focus{padding-right:39px; background-position:right 11px center;}
  .us-f .help{font-size:var(--text-caption-size); color:var(--color-neutral-5); line-height:1.4;}
  .us-f .ro{height:40px; display:flex; align-items:center; padding:0 var(--spacing-12);
    border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm); background:var(--color-neutral-2);
    font-size:var(--text-body2-size); color:var(--color-neutral-9);}
  .us-hubgrid{display:flex; flex-direction:column; gap:var(--spacing-8);}
  .us-hubgrid .c-checkbox-box{margin-top:3px;}
  .us-desc{border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm); padding:var(--spacing-12);
    font-size:var(--text-caption-size); color:var(--color-neutral-5); line-height:1.5; display:flex; flex-direction:column; gap:4px;}
  .us-desc b{color:var(--color-neutral-9);}
  .us-ad{background:var(--color-neutral-2); border-radius:var(--radius-sm); padding:var(--spacing-12);
    font-size:var(--text-caption-size); display:grid; grid-template-columns:auto 1fr; gap:4px var(--spacing-16);}
  .us-ad .k{color:var(--color-neutral-5);}
  .us-ad .note{grid-column:1 / -1; color:var(--color-neutral-5); margin-top:4px;}
  .us-guard{display:flex; align-items:flex-start; gap:var(--spacing-8); font-size:var(--text-caption-size);
    color:var(--color-red); line-height:1.4;}
  .us-guard[hidden]{display:none;}
  .us-guard i{flex:none; font-size:14px; margin-top:1px;}
  .us-cands{border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm); overflow:hidden; max-height:220px; overflow-y:auto;}
  .us-cands[hidden]{display:none;}
  .us-cand{display:block; width:100%; text-align:left; border:none; background:transparent; padding:8px 12px;
    font-family:inherit; font-size:var(--text-body2-size); cursor:pointer;}
  .us-cand:hover{background:var(--color-neutral-2);}
  .us-cand .us-sub{margin:0;}
  .us-picked{display:flex; align-items:center; gap:var(--spacing-12); padding:8px 12px;
    border:1px solid var(--color-obsidian); border-radius:var(--radius-sm);}
  .us-picked .us-x{margin-left:auto;}
  .us-remove{margin-right:auto; border:none; background:transparent; font-family:inherit; font-size:var(--text-body2-size);
    font-weight:700; color:var(--color-red); cursor:pointer; padding:0;}
  .us-confirm{margin-right:auto; display:flex; align-items:center; gap:var(--spacing-8); font-size:var(--text-caption-size); flex-wrap:wrap;}
  .us-confirm[hidden]{display:none;}
  .us-btn-danger{background:var(--color-red); color:var(--color-neutral-1);}
  .us-btn-danger:hover{background:#d8232f;}

  @media (max-width:760px){
    .us-search input{width:100%;}
    .us-bar-left{width:100%;}
  }
</style>
</head>

<div class="c-shell">
  <div class="c-sidebar-shell" id="shellSidebarShell">
    <nav class="c-sidebar" id="shellSidebarNav">

      <a class="c-sidebar-item" href="feedback-v1.html"><i class="ph-fill ph-lightbulb-filament"></i><span class="label">Feedback</span><span class="c-sidebar-hover-text">Feedback</span></a>

        <line x1="9" y1="3.5" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
        <path id="sidebarArrow" d="M13.5 7 11 10l2.5 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  <div class="c-shell-main">

        <header class="pg-head">

          </div>

        <div id="content"></div>
      </div>

  </div>
</div>

<script>
/* A blank page tells nobody anything. If the page's own script fails before
   it paints, say so where the content would be, with a way to clear this
   browser's stored data, which is the usual cause after a stale load. */
window.addEventListener('error', function (e) {
  var c = document.getElementById('content');
  if (!c || c.children.length) return;
  var msg = (e && e.message) || 'Unknown error';
  c.innerHTML = '<div class="c-empty" style="max-width:520px;margin:48px auto"><i class="ph ph-warning-circle"></i>' +
    '<h4>This page could not load</h4><p>' + String(msg).replace(/[&<>]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]; }) +
    '</p><p>Reload with a fresh copy, or clear this browser\'s stored data for the prototype and reload.</p>' +
    '<button class="c-btn c-btn-secondary c-btn-md" type="button" onclick="[\'collabrium.access.directory\',\'collabrium.access.overrides\',\'collabrium.access.viewer\'].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});location.reload(true)">Clear stored data and reload</button></div>';
});
</script>
<script src="../shared/access.js?v=4"></script>
<script src="../shared/shell.js?v=4"></script>
<script>
(function () {
  var A = window.CollabAccess, Sh = window.CollabShell, esc = Sh.esc;
  var S = localStorage;
  var GATE = 'Invite / add a user to the workspace';
  var EDIT_GATE = 'Deactivate or remove a user';

  var viewer, store, seedAll;
  var state = { q: '', role: [], hub: [], st: [], sort: { key: 'name', dir: 1 }, page: 1, rows: 50 };

  /* ── Boot: the shell, then the org chart, then the store, then the page ── */
  A.loadOverrides(S);   /* a Super Admin's edits on Roles & permissions reach the checklist here */
  viewer = Sh.init({ onViewerChange: function (v) { viewer = v; state.page = 1; if (store) render(); } });
  /* Bones first. The chart is one local fetch, so the beat is staged
     rather than real: the roster page's own 1000ms, long enough for the
     bones to register as a considered loading state instead of a flicker. */
  function skeleton() {
    var sk = function (w, extra) { return '<span class="us-sk' + (extra ? ' ' + extra : '') + '" style="width:' + w + '"></span>'; };
    var rows = '';
    for (var i = 0; i < 8; i++) {
      rows += '<tr class="us-sk-row"><td>' + sk('58%') + '<span class="us-sk" style="width:42%; height:9px; margin-top:6px"></span></td>' +
        '<td>' + sk('44px', 'us-sk-pill') + '</td><td>' + sk('70%') + '</td><td>' + sk('60%') + '</td>' +
        '<td>' + sk('56%') + '<span class="us-sk" style="width:48%; height:9px; margin-top:6px"></span></td>' +
        '<td>' + sk('18px') + '</td><td>' + sk('40px') + '</td><td><span class="us-sk-dot"></span></td></tr>';
    }
    document.getElementById('content').innerHTML =
      '<div class="us-bar" aria-hidden="true"><div class="us-bar-left">' +
        '<span class="us-sk us-sk-box" style="width:260px"></span><span class="us-sep"></span>' +
        sk('72px', 'us-sk-pill') + sk('68px', 'us-sk-pill') + sk('76px', 'us-sk-pill') +
      '</div><div class="us-bar-right">' + sk('90px') + '<span class="us-sk-btn"></span></div></div>' +
      '<p class="us-note"><span class="us-sk" style="width:520px; max-width:100%"></span></p>' +
      '<div class="us-count"><span class="us-sk" style="width:150px"></span><span class="us-sk" style="width:180px"></span></div>' +
      '<div class="us-tablewrap"><table class="c-table us-table" aria-hidden="true"><thead><tr>' +
        ['54px','36px','34px','52px','66px','36px','70px',''].map(function (w) { return '<th>' + (w ? '<span class="us-sk" style="width:' + w + '; height:9px"></span>' : '') + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    document.getElementById('content').setAttribute('aria-busy', 'true');
  }
  var SK_HOLD = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1000;
  var skeletonUntil = Date.now() + SK_HOLD;
  skeleton();

  fetch('../data/org-tree.json').then(function (r) {
    if (!r.ok) throw new Error('org-tree.json ' + r.status);
    return r.json();
  }).then(function (tree) {
    seedAll = A.buildSeed(tree);
    store = A.createStore({ seed: seedAll, storage: S });
    document.getElementById('newUser').addEventListener('click', function () { openAdd(); });
    setTimeout(function () {
      document.getElementById('content').removeAttribute('aria-busy');
      render();
    }, Math.max(0, skeletonUntil - Date.now()));
  }).catch(function (e) {
    document.getElementById('content').removeAttribute('aria-busy');
    document.getElementById('content').innerHTML =
      '<div class="c-empty"><i class="ph ph-warning-circle"></i><h4>The org chart did not load</h4><p>' + esc(String(e)) + '</p></div>';
    document.getElementById('newUser').hidden = true;
  });

  /* ── Formatting ───────────────────────────────────────────────────── */
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'June', 'July', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
  function fmtWhen(iso) {
    if (!iso) return 'Never';
    var d = new Date(iso);
    return d.getDate() + ' ' + MON[d.getMonth()] + ', ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function stateOf(r) { return r.access === 'inactive' ? 'inactive' : r.lastSignIn ? 'active' : 'never'; }

  /* ── Filtering and sorting ────────────────────────────────────────── */
  function visible(all) {
    var byId = {};
    all.forEach(function (r) { byId[r.id] = r; });
    var q = state.q.trim().toLowerCase();
    var out = all.filter(function (r) {
      if (state.role.length && state.role.indexOf(r.role) === -1) return false;
      if (state.hub.length && !state.hub.some(function (h) { return r.hubs.indexOf(h) !== -1; })) return false;
      if (state.st.length && state.st.indexOf(stateOf(r)) === -1) return false;
      if (!q) return true;
      var hay = [r.name, r.email, A.roleLabel(r.role), r.influencerRole ? A.influencerRoleLabel(r.influencerRole) : ''].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    var k = state.sort.key, d = state.sort.dir;
    function val(r) {
      switch (k) {
        case 'hubs': return r.hubs.map(A.hubShort).join(', ');
        case 'role': return A.roleLabel(r.role);
        case 'scope': return A.scopeWord(r.role);
        case 'reportsTo': return r.reportsTo && byId[r.reportsTo] ? byId[r.reportsTo].name : (r.reportsToEmail || '');
        case 'team': return r.teamDirect;
        case 'lastSignIn': return r.lastSignIn || '';
        default: return r.name;
      }
    }
    out.sort(function (a, b) {
      var x = val(a), y = val(b);
      var c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y));
      return c ? c * d : a.name.localeCompare(b.name);
    });
    return { rows: out, byId: byId };
  }

  /* ── Render ───────────────────────────────────────────────────────── */
  var COLS = [
    { key: 'name', label: 'Person' }, { key: 'hubs', label: 'Hubs' }, { key: 'role', label: 'Role' },
    { key: 'scope', label: 'Can see' }, { key: 'reportsTo', label: 'Reports to' },
    { key: 'team', label: 'Team' }, { key: 'lastSignIn', label: 'Last sign-in' }
  ];

  var FACETS = [
    { key: 'role', label: 'Role', options: function () { return A.ROLES.map(function (r) { return { key: r.key, label: r.label }; }); },
      of: function (r) { return [r.role]; } },
    { key: 'hub', label: 'Hub', options: function () { return A.HUBS.map(function (x) { return { key: x.key, label: x.label }; }); },
      of: function (r) { return r.hubs; } },
    { key: 'st', label: 'State', options: function () { return [{ key: 'active', label: 'Active' }, { key: 'inactive', label: 'Deactivated' }, { key: 'never', label: 'Never signed in' }]; },
      of: function (r) { return [stateOf(r)]; } }
  ];
  function facetByKey(k) { return FACETS.filter(function (f) { return f.key === k; })[0]; }

  function render() {
    var content = document.getElementById('content');
    var mayOpen = A.holds(viewer.role, GATE);
    var mayEdit = A.holds(viewer.role, EDIT_GATE);
    document.getElementById('newUser').hidden = !mayOpen;
    if (!mayOpen) {
      lastRows = [];
      renderRail();
      closePops();
      content.innerHTML =
        '<div class="c-empty us-denied"><i class="ph ph-lock-simple"></i><h4>Admin only</h4>' +
        '<p>' + esc(A.DENIED) + '</p>' +
        '<a class="c-btn c-btn-secondary c-btn-md" href="settings.html">Back to Settings</a></div>';
      return;
    }
    var all = store.list();
    var v = visible(all), rows = v.rows, byId = v.byId;
    var never = all.filter(function (r) { return stateOf(r) === 'never'; }).length;
    var total = rows.length, pages = Math.max(1, Math.ceil(total / state.rows));
    if (state.page > pages) state.page = pages;
    var from = (state.page - 1) * state.rows, page = rows.slice(from, from + state.rows);

    /* The bar is built once and never rebuilt: an open filter panel and a
       focused search box both survive every re-render that way. */
    if (!document.getElementById('bar')) {
      content.innerHTML = renderBar() + '<div id="list"></div>';
      wireBar();
    }
    var synced = store.syncedAt();
    document.getElementById('synced').textContent = synced ? 'Synced ' + fmtWhen(synced) : 'Not yet synced';
    FACETS.forEach(function (f) { updateTrigger(f.key); });
    renderTray();

    var before = snapshotRects();
    var h = '';
    h += '<p class="us-note">' + never + ' of ' + all.length + ' have never signed in. Until they do, nothing has confirmed the address we hold is one they can use.</p>';
    h += '<div class="us-count"><span>Showing <b>' + (total ? from + 1 : 0) + '–' + Math.min(from + state.rows, total) + '</b> of <b>' + total + '</b> items</span>' +
      '<div class="us-pager"><span>Rows</span><select id="rows" aria-label="Rows per page">' +
      [25, 50, 100, 250].map(function (n) { return '<option value="' + n + '"' + (n === state.rows ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
      '</select>' + pager(pages) + '</div></div>';

    h += '<div class="us-tablewrap"><table class="c-table us-table"><thead><tr>' +
      COLS.map(function (c) {
        var on = state.sort.key === c.key;
        return '<th data-sort="' + c.key + '" class="' + (on ? 'is-sorted' : '') + '" aria-sort="' + (on ? (state.sort.dir > 0 ? 'ascending' : 'descending') : 'none') + '">' +
          '<button type="button" class="us-sort">' + esc(c.label) + '<span class="arr">' + (on ? (state.sort.dir > 0 ? '↑' : '↓') : '↕') + '</span></button></th>';
      }).join('') + '<th aria-label="Edit"></th></tr></thead><tbody>';
    if (!page.length) {
      h += '<tr><td colspan="8"><div class="c-empty us-empty"><i class="ph ph-users"></i><h4>No one matches</h4><p>Clear a filter or change the search.</p></div></td></tr>';
    }
    page.forEach(function (r) {
      var mgr = r.reportsTo && byId[r.reportsTo] ? byId[r.reportsTo] : null;
      h += '<tr class="' + (r.access === 'inactive' ? 'is-off' : '') + '" data-id="' + esc(r.id) + '" data-letter="' + letterOf(r.name) + '">' +
        '<td><div class="us-name">' + esc(r.name) + (r.access === 'inactive' ? ' <span class="c-badge c-badge-neutral">Deactivated</span>' : '') + '</div><div class="us-sub">' + esc(r.email) + '</div></td>' +
        '<td><div class="us-hubs">' + r.hubs.map(function (k) { return '<span class="c-badge c-badge-neutral">' + esc(A.hubShort(k)) + '</span>'; }).join('') + '</div></td>' +
        '<td>' + esc(A.roleLabel(r.role)) + (r.influencerRole ? '<div class="us-sub">Influencer: ' + esc(A.influencerRoleLabel(r.influencerRole)) + '</div>' : '') + '</td>' +
        '<td>' + esc(A.scopeWord(r.role)) + '</td>' +
        '<td>' + (mgr ? esc(mgr.name) + '<div class="us-sub">' + esc(mgr.email) + '</div>'
                      : r.reportsToEmail ? '<span class="us-ext">' + esc(r.reportsToEmail) + '</span><div class="us-sub warn">Not a Collabrium user — grants no access</div>'
                      : '<span class="us-ext">—</span>') + '</td>' +
        '<td class="num">' + (r.teamDirect ? r.teamDirect : '—') + '</td>' +
        '<td><span class="us-sub" style="margin:0">' + esc(fmtWhen(r.lastSignIn)) + '</span></td>' +
        '<td>' + (mayEdit ? '<button class="us-edit" type="button" data-edit="' + esc(r.id) + '" aria-label="Edit ' + esc(r.name) + '"><i class="ph ph-pencil-simple"></i></button>' : '') + '</td>' +
        '</tr>';
    });
    h += '</tbody></table></div>';
    document.getElementById('list').innerHTML = h;
    wireList();
    playMove(before);
    lastRows = rows;
    renderRail();
    spy();
  }

  function pager(pages) {
    var h = '<button type="button" data-page="' + (state.page - 1) + '" aria-label="Previous page"' + (state.page <= 1 ? ' disabled' : '') + '><i class="ph ph-caret-left"></i></button>';
    for (var p = 1; p <= pages; p++) {
      if (pages > 7 && Math.abs(p - state.page) > 2 && p !== 1 && p !== pages) {
        if (p === 2 || p === pages - 1) h += '<span>…</span>';
        continue;
      }
      h += '<button type="button" data-page="' + p + '"' + (p === state.page ? ' aria-current="page"' : '') + '>' + p + '</button>';
    }
    h += '<button type="button" data-page="' + (state.page + 1) + '" aria-label="Next page"' + (state.page >= pages ? ' disabled' : '') + '><i class="ph ph-caret-right"></i></button>';
    return h;
  }

  /* ── The bar: search, one pill per facet, the sync stamp ──────────── */
  function renderBar() {
    return '<div class="us-bar" id="bar"><div class="us-bar-left">' +
      '<div class="us-search"><i class="ph ph-magnifying-glass"></i>' +
      '<input type="text" id="q" placeholder="Search name, address, role…" value="' + esc(state.q) + '" aria-label="Search" /></div>' +
      '<span class="us-sep"></span>' +
      FACETS.map(function (f) {
        return '<div class="us-pill" data-facet="' + f.key + '">' +
          '<button class="c-filter-trigger" type="button" data-facet="' + f.key + '" aria-haspopup="true" aria-expanded="false">' +
            esc(f.label) + '<i class="ph ph-caret-down chev"></i></button>' +
          '<div class="c-filter-panel" data-panel="' + f.key + '">' +
            '<div data-options="' + f.key + '"></div>' +
            '<div class="c-filter-footer"><button class="c-btn c-btn-ghost c-btn-sm" type="button" data-clear="' + f.key + '">Clear</button></div>' +
          '</div></div>';
      }).join('') +
      '<button class="c-btn c-btn-ghost c-btn-sm c-filter-clear-bar" type="button" id="clearAll" hidden>Clear all</button>' +
      '</div><div class="us-bar-right">' +
      '<span id="synced"></span>' +
      '<button class="c-btn c-btn-secondary c-btn-sm" type="button" id="sync">Sync from Azure AD</button>' +
      '</div></div>' +
      '<div class="c-filter-tray" id="tray" hidden aria-label="Applied filters"></div>';
  }
  /* The tray under the bar: one chip per applied option, "Facet: Value",
     each removable on its own, plus Clear all at the end of the pills. Opens
     the moment anything is selected, as on the roster and the media plans. */
  function labelFor(f, key) {
    var o = f.options().filter(function (x) { return x.key === key; })[0];
    return o ? o.label : key;
  }
  function renderTray() {
    var tray = document.getElementById('tray'), clearAll = document.getElementById('clearAll');
    if (!tray) return;
    var n = FACETS.reduce(function (m, f) { return m + state[f.key].length; }, 0);
    tray.hidden = !n;
    clearAll.hidden = !n;
    tray.innerHTML = FACETS.map(function (f) {
      return state[f.key].map(function (key) {
        var text = f.label + ': ' + labelFor(f, key);
        return '<span class="c-chip c-chip-input">' + esc(text) +
          '<button class="c-chip-remove" type="button" data-facet="' + f.key + '" data-remove="' + esc(key) + '" aria-label="Remove ' + esc(text) + '"><i class="ph ph-x"></i></button></span>';
      }).join('');
    }).join('');
  }
  /* Option rows carry the count across the whole directory, as the roster
     does, so a choice says how many people it will keep before it is made. */
  function optionRows(f) {
    var counts = {};
    store.list().forEach(function (r) { f.of(r).forEach(function (k) { counts[k] = (counts[k] || 0) + 1; }); });
    return f.options().map(function (o) {
      var on = state[f.key].indexOf(o.key) !== -1;
      return '<label class="c-filter-option" data-facet="' + f.key + '" data-v="' + esc(o.key) + '">' +
        '<span class="c-checkbox-box' + (on ? ' on' : '') + '">' + (on ? '<i class="ph ph-check" style="font-size:12px"></i>' : '') + '</span>' +
        '<input type="checkbox"' + (on ? ' checked' : '') + ' aria-label="' + esc(o.label) + '" />' +
        '<span class="label">' + esc(o.label) + '<span class="n">' + (counts[o.key] || 0) + '</span></span></label>';
    }).join('');
  }
  /* The trigger's count badge, updated in place so an open panel never has
     to be rebuilt, which would close it mid-selection. */
  function updateTrigger(k) {
    var trig = document.querySelector('.c-filter-trigger[data-facet="' + k + '"]');
    if (!trig) return;
    var n = state[k].length;
    trig.classList.toggle('active', !!n);
    trig.innerHTML = esc(facetByKey(k).label) + (n ? '<span class="count">' + n + '</span>' : '') + '<i class="ph ph-caret-down chev"></i>';
  }
  var openFacet = null;
  function closePops() {
    openFacet = null;
    document.querySelectorAll('.c-filter-panel.is-open').forEach(function (p) { p.classList.remove('is-open'); });
    document.querySelectorAll('.c-filter-trigger.is-open').forEach(function (t) {
      t.classList.remove('is-open');
      t.setAttribute('aria-expanded', 'false');
    });
  }
  function wireBar() {
    var q = document.getElementById('q');
    q.addEventListener('input', function () { state.q = q.value; state.page = 1; render(); });
    document.getElementById('sync').addEventListener('click', function () {
      store.stampSync();
      render();
      Sh.toast('success', 'Synced from Azure AD', 'The directory is up to date.');
    });
    document.getElementById('clearAll').addEventListener('click', function () {
      FACETS.forEach(function (f) { state[f.key] = []; });
      state.page = 1;
      closePops();
      render();
    });
    document.getElementById('tray').addEventListener('click', function (e) {
      var b = e.target.closest('[data-remove]');
      if (!b) return;
      var k = b.dataset.facet;
      state[k] = state[k].filter(function (v) { return v !== b.dataset.remove; });
      state.page = 1;
      var opts = document.querySelector('[data-options="' + k + '"]');
      if (opts && opts.innerHTML) opts.innerHTML = optionRows(facetByKey(k));
      render();
    });
    document.getElementById('bar').addEventListener('click', function (e) {
      var trig = e.target.closest('.c-filter-trigger');
      if (trig) {
        e.stopPropagation();
        var k = trig.dataset.facet, was = openFacet === k;
        closePops();
        if (!was) {
          openFacet = k;
          document.querySelector('[data-options="' + k + '"]').innerHTML = optionRows(facetByKey(k));
          document.querySelector('[data-panel="' + k + '"]').classList.add('is-open');
          trig.classList.add('is-open');
          trig.setAttribute('aria-expanded', 'true');
        }
        return;
      }
      var clr = e.target.closest('[data-clear]');
      if (clr) {
        e.stopPropagation();
        var ck = clr.dataset.clear;
        state[ck] = []; state.page = 1;
        document.querySelector('[data-options="' + ck + '"]').innerHTML = optionRows(facetByKey(ck));
        render();
        return;
      }
      if (e.target.closest('.c-filter-panel')) e.stopPropagation();
    });
    /* A toggle applies the moment it is made: state, the option rows, the
       trigger's badge, then the list moves underneath the open panel. */
    document.getElementById('bar').addEventListener('change', function (e) {
      var opt = e.target.closest('.c-filter-option');
      if (!opt) return;
      var k = opt.dataset.facet, val = opt.dataset.v, i = state[k].indexOf(val);
      if (i > -1) state[k].splice(i, 1); else state[k].push(val);
      state.page = 1;
      document.querySelector('[data-options="' + k + '"]').innerHTML = optionRows(facetByKey(k));
      render();
    });
  }

  /* ── The list's own controls, rebound after every render ──────────── */
  function wireList() {
    document.getElementById('rows').addEventListener('change', function (e) {
      state.rows = Number(e.target.value); state.page = 1; render();
    });
    document.querySelectorAll('.us-pager button[data-page]').forEach(function (b) {
      b.addEventListener('click', function () { state.page = Number(b.dataset.page); render(); });
    });
    document.querySelectorAll('.us-table th[data-sort]').forEach(function (th) {
      th.addEventListener('click', function () {
        var k = th.dataset.sort;
        if (state.sort.key === k) state.sort.dir = -state.sort.dir; else state.sort = { key: k, dir: 1 };
        render();
      });
    });
    document.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () { openEdit(b.dataset.edit); });
    });
  }

  /* ── FLIP: rows that survive a filter, sort or page change travel from
     where they were to where they are; rows that arrive fade in. The
     roster page's move, on table rows. Off-screen rows are skipped, and so
     is the whole pass under reduced motion. ── */
  var FLIP_PAD = 240;
  var REDUCED_MOVE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function snapshotRects() {
    var map = {}, vh = window.innerHeight;
    var els = document.querySelectorAll('#list tr[data-id]');
    for (var i = 0; i < els.length; i++) {
      var rc = els[i].getBoundingClientRect();
      if (rc.top > vh + FLIP_PAD) break;
      if (rc.bottom < -FLIP_PAD) continue;
      map[els[i].dataset.id] = rc;
    }
    return map;
  }
  function playMove(before) {
    if (REDUCED_MOVE || !before || !('animate' in Element.prototype)) return;
    var hadAny = false;
    for (var k in before) { hadAny = true; break; }
    if (!hadAny) return; /* first real paint: the skeleton hands over, nothing to travel from */
    var moved = 0, appeared = 0, vh = window.innerHeight;
    var els = document.querySelectorAll('#list tr[data-id]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var now = el.getBoundingClientRect();
      if (now.top > vh + FLIP_PAD) break;
      if (now.bottom < -FLIP_PAD) continue;
      var was = before[el.dataset.id];
      if (!was) {
        el.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }],
          { duration: 300, delay: Math.min(appeared * 14, 180), easing: 'cubic-bezier(.32,.72,.3,1)', fill: 'backwards' });
        appeared++;
        continue;
      }
      var dy = was.top - now.top;
      if (Math.abs(dy) < 1) continue;
      el.animate([{ transform: 'translateY(' + dy.toFixed(1) + 'px)' }, { transform: 'translateY(0)' }],
        { duration: 520, delay: Math.min(moved * 22, 220), easing: 'cubic-bezier(.32,.72,.3,1)', fill: 'backwards' });
      moved++;
    }
  }
  document.addEventListener('click', function (e) { if (!e.target.closest('.us-pill')) closePops(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePops(); closeModal(); } });

  /* ── Modals ───────────────────────────────────────────────────────── */
  /* ── A–Z rail: the Influencers page's jump-and-spy, on a paged table.
     Letter counts come from the whole filtered list, so the rail describes
     the directory, not the page; a jump to a letter on another page turns
     to that page first, then scrolls the shell's own scroll container. ── */
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  var railEl = document.getElementById('rail');
  var scroller = document.querySelector('.c-shell-content');
  var lastRows = [];
  function letterOf(name) {
    var c = String(name || '').trim().charAt(0).toUpperCase();
    return /[A-Z]/.test(c) ? c : '#';
  }
  function renderRail() {
    var counts = {};
    LETTERS.forEach(function (L) { counts[L] = 0; });
    lastRows.forEach(function (r) { counts[letterOf(r.name)] += 1; });
    railEl.hidden = !lastRows.length;
    railEl.innerHTML = LETTERS.map(function (L) {
      var n = counts[L];
      return '<button class="us-rail-row' + (n ? '' : ' is-empty') + '" type="button" data-letter="' + L + '"' +
        (n ? ' title="' + n + '" aria-label="Jump to ' + (L === '#' ? 'symbols' : L) + ', ' + n + ' people"' : ' tabindex="-1" aria-hidden="true"') + '>' +
        '<span class="us-rail-letter">' + L + '</span></button>';
    }).join('');
  }
  railEl.addEventListener('click', function (e) {
    var row = e.target.closest('.us-rail-row');
    if (!row || row.classList.contains('is-empty')) return;
    var L = row.dataset.letter, idx = -1;
    for (var i = 0; i < lastRows.length; i++) if (letterOf(lastRows[i].name) === L) { idx = i; break; }
    if (idx < 0) return;
    var pg = Math.floor(idx / state.rows) + 1;
    if (pg !== state.page) { state.page = pg; render(); }
    var target = content.querySelector('tr[data-letter="' + L + '"]');
    if (!target || !scroller) return;
    var top = target.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - 16;
    /* Smooth only when the tab is actually being painted: a hidden pane
       stalls the animation clock and the glide never lands. */
    var glide = !REDUCED_RAIL && document.visibilityState === 'visible';
    scroller.scrollTo({ top: Math.max(0, top), behavior: glide ? 'smooth' : 'auto' });
    /* The spy normally follows the scroll event; an instant jump in a hidden
       pane fires none, so mark the letter directly. */
    if (!glide) spy();
  });
  var REDUCED_RAIL = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* Scroll-spy: the letter of the row that owns the viewport top. */
  var spyTick = false;
  function spy() {
    if (!scroller || railEl.hidden) return;
    var rows = content.querySelectorAll('tr[data-letter]');
    var topEdge = scroller.getBoundingClientRect().top + 90;
    var current = null;
    rows.forEach(function (tr) { if (tr.getBoundingClientRect().top <= topEdge) current = tr.dataset.letter; });
    if (!current && rows.length) current = rows[0].dataset.letter;
    railEl.querySelectorAll('.us-rail-row').forEach(function (b) { b.classList.toggle('is-active', b.dataset.letter === current); });
  }
  if (scroller) scroller.addEventListener('scroll', function () {
    if (spyTick) return;
    spyTick = true;
    setTimeout(function () { spyTick = false; spy(); }, 80);
  });

  var overlay = document.getElementById('overlay');
  var modal = document.getElementById('modal');
  var form = null;   // { mode:'add'|'edit', before, next, picked }
  var opener = null;

  /* The swing: the panel flies out of the element that opened it and folds
     back into it on close. The source rect is frozen at open time in case a
     re-render swaps the button out from under the modal. Same math as the
     Influencers page, so the two read as one behaviour. */
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var swingSrcEl = null, swingSrcRect = null, hideTimer = null;
  function swingVars() {
    modal.classList.remove('is-swinging-open', 'is-swinging-closed');
    void modal.offsetWidth;
    var from = (swingSrcEl && swingSrcEl.isConnected) ? swingSrcEl.getBoundingClientRect() : swingSrcRect;
    if (!from) return false;
    var to = modal.getBoundingClientRect();
    modal.style.setProperty('--sw-dx', (from.left - to.left).toFixed(1) + 'px');
    modal.style.setProperty('--sw-dy', (from.top - to.top).toFixed(1) + 'px');
    modal.style.setProperty('--sw-sx', (from.width / to.width).toFixed(4));
    modal.style.setProperty('--sw-sy', (from.height / to.height).toFixed(4));
    modal.style.setProperty('--sw-dir', (from.left + from.width / 2) <= window.innerWidth / 2 ? '1' : '-1');
    return true;
  }
  function showModal(srcEl) {

  function closeModal() {

    if (opener && opener.focus) opener.focus();

  /* Backdrop closes, but only when the press started on it too, so a drag

  var downOnBackdrop = false;
  overlay.addEventListener('mousedown', function (e) { downOnBackdrop = !!e.target.closest('.us-cardmodal-backdrop'); });
  overlay.addEventListener('click', function (e) { if (downOnBackdrop && e.target.closest('.us-cardmodal-backdrop')) closeModal(); downOnBackdrop = false; });

  function blank() {
    return { id: '', name: '', email: '', networkId: '', role: A.DEFAULT_ROLE, hubs: ['sales'],
             influencerRole: null, reportsTo: null, reportsToEmail: null, access: 'active', lastSignIn: null };
  }
  function openAdd() {
    opener = document.activeElement;

    var p = document.getElementById('person');

  }
  function openEdit(id) {
    var rec = store.get(id);
    if (!rec) return;
    opener = document.activeElement;
    form = { mode: 'edit', before: rec, next: JSON.parse(JSON.stringify(rec)), picked: rec };
    paintModal();

    var first = modal.querySelector('input:not([disabled]), select, button[data-close]');
    if (first) first.focus();

  /* One paint per change. The inputs are rebuilt, so focus is restored to
     whichever control was active, by id or by hub key. */
  function paintModal() {
    var active = document.activeElement, activeId = active && active.id,
        activeHub = active && active.dataset ? active.dataset.hub : null;
    var f = form, n = f.next, isAdd = f.mode === 'add';
    var mayRole = A.holds(viewer.role, "Assign or change a user's role");
    var hasInfl = n.hubs.indexOf('influencer') !== -1;
    var all = store.list();
    var byId = {};
    all.forEach(function (r) { byId[r.id] = r; });
    var guard = isAdd && !f.picked ? null : A.check(viewer, f.before, n, all);
    var dirty = isAdd ? !!f.picked : JSON.stringify(strip(n)) !== JSON.stringify(strip(f.before));
    var canSave = dirty && !guard;

    var h = '<div class="c-modal-head"><div><h4 id="modalTitle">' + (isAdd ? 'Add a user' : esc(n.name)) + '</h4>' +
      '<p class="sub">' + (isAdd ? 'Search Azure AD, then give them a role.' : esc(n.email)) + '</p></div>' +
      '<button class="us-x" type="button" data-close aria-label="Close"><i class="ph ph-x"></i></button></div>';
    h += '<div class="c-modal-body">';

    if (isAdd) {
      h += '<div class="us-f"><label for="person">Person</label>';
      if (f.picked) {
        h += '<div class="us-picked"><span class="c-search-input-avatar">' + esc(A.initials(f.picked.name)) + '</span>' +
          '<span><div>' + esc(f.picked.name) + '</div><div class="us-sub">' + esc(f.picked.email) + '</div></span>' +
          '<button class="us-x" type="button" data-unpick aria-label="Choose someone else"><i class="ph ph-x"></i></button></div>';

          '<div class="us-cands" id="cands" hidden></div>';

    }

    h += '<div class="us-f"><div class="lab">Hubs</div><div class="us-hubgrid">' +

        return '<label class="c-choice' + (last ? ' disabled' : '') + '"><span class="c-checkbox-box' + (on ? ' on' : '') + '">' + (on ? '<i class="ph ph-check" style="font-size:12px"></i>' : '') + '</span>' +
          '<input type="checkbox" data-hub="' + x.key + '"' + (on ? ' checked' : '') + (last ? ' disabled' : '') + ' />' +
          '<span class="text"><span class="label">' + esc(x.label) + '</span>' + (last ? '<span class="desc">The last hub stays. Deactivate them instead.</span>' : '') + '</span></label>';

          '<div class="help">Decides what they can see and edit. Change it any time.</div>'
        : '<div class="ro">' + esc(A.roleLabel(n.role)) + '</div><div class="help">' + esc(A.ROLE_IS_SUPER) + '</div>') +
      '</div>';

    if (hasInfl) {
      h += '<div class="us-f"><label for="irole">Influencer role</label>' +
        (mayRole
          ? '<select id="irole">' + A.INFLUENCER_ROLES.map(function (r) { return '<option value="' + r.key + '"' + (r.key === n.influencerRole ? ' selected' : '') + '>' + esc(r.label) + '</option>'; }).join('') + '</select>' +
            '<div class="help">Collab: Influencer runs its own role set.</div>'
          : '<div class="ro">' + esc(A.influencerRoleLabel(n.influencerRole)) + '</div><div class="help">' + esc(A.ROLE_IS_SUPER) + '</div>') +
        '</div>';
    }

    h += '<div class="us-desc">' + A.describe(n).map(function (line, i) {
      return '<div>' + (i === 0 ? esc(line).replace(/^Sees ([^.]+)\./, 'Sees <b>$1</b>.') : esc(line)) + '</div>';
    }).join('') + '</div>';

    /* The activity matrix for the chosen role, read-only: the role decides

    var held = 0, totalActs = 0;
    var actsHtml = A.ACTIVITIES.map(function (cat) {
      return '<div class="us-act-cat">' + esc(cat.title) + '</div>' + cat.items.map(function (item) {
        var on = A.holds(n.role, item.label);
        totalActs++; if (on) held++;
        return '<div class="us-act' + (on ? '' : ' off') + '"><span class="c-checkbox-box' + (on ? ' on' : '') + '" aria-hidden="true">' +

      '<div class="us-acts-body" id="actsBody" role="list" aria-label="Activities held by this role"' + (f.showActs ? '' : ' hidden') + '>' + actsHtml +

                              : '<a href="roles.html?role=' + encodeURIComponent(n.role) + '">See it in Roles &amp; permissions <i class="ph ph-arrow-right"></i></a>') +

  function strip(r) {

  function wireModal() {
    var f = form, n = f.next;

    var person = document.getElementById('person');
    if (person) {
      person.addEventListener('input', function () {
        f.q = person.value;
        var q = f.q.trim().toLowerCase();
        var box = document.getElementById('cands');
        if (!q) { box.hidden = true; box.innerHTML = ''; return; }
        var hits = store.candidates().filter(function (c) {
          return (c.name + ' ' + c.email).toLowerCase().indexOf(q) !== -1;
        }).slice(0, 8);
        box.hidden = false;
        box.innerHTML = hits.length
          ? hits.map(function (c) {
              return '<button class="us-cand" type="button" data-pick="' + esc(c.id) + '">' + esc(c.name) + '<div class="us-sub">' + esc(c.email) + '</div></button>';
            }).join('')
          : '<div class="us-cand" style="cursor:default;color:var(--color-neutral-5)">No one in Azure AD matches, or they are already in the directory.</div>';

    if (actsToggle) actsToggle.addEventListener('click', function () { f.showActs = !f.showActs; paintModal(); });

      cb.addEventListener('change', function () {

    });

    if (role) role.addEventListener('change', function () { n.role = role.value; paintModal(); });
    var irole = document.getElementById('irole');
    if (irole) irole.addEventListener('change', function () { n.influencerRole = irole.value; paintModal(); });
    var access = document.getElementById('access');

    if (yes) yes.addEventListener('click', function () {

    var save = modal.querySelector('[data-save]');
    if (save) save.addEventListener('click', function () {
      var err = A.check(viewer, f.before, n, store.list());
      if (err) { showGuard(err); return; }
      store.save(n);
      var isAdd = f.mode === 'add';
      closeModal();
      render();
      Sh.toast('success', isAdd ? 'User added' : 'Changes saved',
        n.name + (isAdd ? ' can open ' + n.hubs.map(A.hubLabel).join(', ') + '.' : ' is updated.'));
    });
  }
  function showGuard(msg) {
    var g = document.getElementById('guard');
    if (!g) return;
    g.hidden = false;
    g.querySelector('span').textContent = msg;
  }
})();
</script>
</body>
</html>
