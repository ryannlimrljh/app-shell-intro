<style>
  .rp-tabs{margin-bottom:var(--spacing-24);}
  .rp-layout{display:grid; grid-template-columns:320px minmax(0,1fr); gap:var(--spacing-32); align-items:start;}
  .rp-roles h2, .rp-pane h2{margin:0; font-size:var(--text-h4-size); font-weight:800;}
  .rp-roles .sub{margin:var(--spacing-4) 0 var(--spacing-16); font-size:var(--text-caption-size); color:var(--color-neutral-5);}
  .rp-role{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--spacing-12); width:100%;
    padding:var(--spacing-16); margin-bottom:var(--spacing-12); text-align:left; cursor:pointer; font-family:inherit;
    background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md);
    transition:border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);}
  .rp-role:hover{border-color:var(--color-neutral-4);}
  .rp-role[aria-pressed="true"]{border-color:var(--color-obsidian); box-shadow:inset 0 0 0 1px var(--color-obsidian);}
  .rp-role:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:2px;}
  .rp-role .name{font-size:var(--text-body1-size); font-weight:700; color:var(--color-neutral-9); display:flex; align-items:center; gap:var(--spacing-8); flex-wrap:wrap;}
  .rp-role .meaning{font-size:var(--text-caption-size); color:var(--color-neutral-5); margin-top:4px; line-height:1.4;}
  .rp-role .c-radio-circle{margin-top:2px;}
  .rp-role .n{font-size:var(--text-caption-size); font-weight:500; color:var(--color-neutral-5);}

  .rp-pane-head{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--spacing-16); flex-wrap:wrap; margin-bottom:var(--spacing-8);}
  .rp-pane-head .meta{display:flex; align-items:center; gap:var(--spacing-8); flex-wrap:wrap; margin-top:var(--spacing-8);}
  .rp-pane-head .last{font-size:var(--text-caption-size); color:var(--color-neutral-5);}
  .rp-note{display:flex; align-items:flex-start; gap:var(--spacing-8); padding:var(--spacing-12); margin:var(--spacing-12) 0 var(--spacing-8);
    border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-neutral-1);
    font-size:var(--text-caption-size); color:var(--color-neutral-5); line-height:1.45;}
  .rp-note i{flex:none; font-size:16px; margin-top:1px; color:var(--color-neutral-5);}
  .rp-group{margin-top:var(--spacing-24);}
  .rp-group h3{margin:0 0 var(--spacing-8); padding-bottom:var(--spacing-8); border-bottom:1px solid var(--color-neutral-3);
    font-size:var(--text-body1-size); font-weight:700;}
  .rp-row{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-16); padding:var(--spacing-12) var(--spacing-8);
    border-radius:var(--radius-sm);}
  .rp-row:hover{background:var(--color-neutral-2);}
  .rp-row .t{min-width:0;}
  .rp-row .lab{font-size:var(--text-body1-size); color:var(--color-neutral-9);}
  .rp-row .help{font-size:var(--text-caption-size); color:var(--color-neutral-5); margin-top:2px;}
  .rp-row.off .lab{color:var(--color-neutral-5);}
  .rp-row .ctl{display:flex; align-items:center; gap:var(--spacing-8); flex:none;}
  .rp-row .lock{font-size:14px; color:var(--color-neutral-4);}
  .rp-switch{border:0; padding:0; cursor:pointer; font:inherit;}
  .rp-switch:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:2px;}
  .rp-switch.is-off{cursor:not-allowed; opacity:.5;}
  .rp-denied{max-width:420px; margin:var(--spacing-60) auto;}
  .rp-denied a{text-decoration:none;}
  @media (max-width:900px){ .rp-layout{grid-template-columns:1fr;} }
</style>
</head>
<body>

        <path id="sidebarArrow" d="M13.5 7 11 10l2.5 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  <div class="c-shell-main">
    <div class="c-shell-content">
      <div class="pg-wrap">
        <header class="pg-head">

            <a class="pg-back" href="settings.html" aria-label="Back to Settings"><i class="ph ph-arrow-left"></i></a>

<script src="../shared/access.js?v=2"></script>
<script src="../shared/shell.js?v=1"></script>
<script>
(function () {
  var A = window.CollabAccess, Sh = window.CollabShell, esc = Sh.esc;
  var S = localStorage;
  var VIEW_GATE = 'Invite / add a user to the workspace';
  var MEANING = {
    super_admin: 'Platform ceiling: every activity, everywhere.',
    admin: 'Hub administrator. On Mothership, mirrors Leadership plus the console items.',
    leadership: 'Company-wide view of the Sales Board.',
    sales_vp: 'Own org: the line they run.',
    head_of_sales: 'Own team: the book they head.',
    sales_manager: 'Own pod.',
    sales_rep: 'Own quota and own campaigns.',
    marketing_services: 'Owns Inventory, Bundles and Brand Profiles.',
    creative_strategist: 'Own campaigns; intelligence and case studies.',
    infl_admin: 'Hub administrator for Collab: Influencer.',
    infl_manager: 'Full access; views Users & Permissions, cannot manage it.',
    viewer: 'No standing access; responds to their own preview or draft.'
  };
  var viewer, store;
  var state = { matrix: 'mothership', role: 'admin' };

  A.loadOverrides(S);
  viewer = Sh.init({ onViewerChange: function (v) { viewer = v; render(); } });
  render();   /* the matrix needs no data; the counts arrive with the chart */
  fetch('../data/org-tree.json').then(function (r) {
    if (!r.ok) throw new Error('org-tree.json ' + r.status);
    return r.json();
  }).then(function (tree) {
    store = A.createStore({ seed: A.buildSeed(tree), storage: S });
    render();
  }).catch(function () { store = null; render(); });

  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'June', 'July', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
  function fmtWhen(iso) {
    var d = new Date(iso);
    return d.getDate() + ' ' + MON[d.getMonth()] + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  /* How many directory users carry this role, on this matrix. The
     Influencer tab counts by Influencer role among those with that hub. */
  function countFor(matrixKey, roleKey) {
    if (!store) return null;
    var all = store.list();
    if (matrixKey === 'influencer' && roleKey !== 'super_admin') {
      return all.filter(function (r) { return r.hubs.indexOf('influencer') !== -1 && r.influencerRole === roleKey; }).length;
    }
    return all.filter(function (r) { return r.role === roleKey; }).length;
  }
  function firstRole(m) { return m.roles.filter(function (r) { return r.key !== 'super_admin'; })[0].key; }

  function render() {
    var content = document.getElementById('content');
    if (!A.holds(viewer.role, VIEW_GATE)) {
      content.innerHTML = '<div class="c-empty rp-denied"><i class="ph ph-lock-simple"></i><h4>Admin only</h4>' +
        '<p>' + esc(A.DENIED) + '</p><a class="c-btn c-btn-secondary c-btn-md" href="settings.html">Back to Settings</a></div>';
      return;
    }
    var m = A.MATRICES[state.matrix];
    if (!m.roles.some(function (r) { return r.key === state.role; })) state.role = firstRole(m);
    var canEdit = A.mayEditRoles(viewer);
    var role = m.roles.filter(function (r) { return r.key === state.role; })[0];
    var n = countFor(m.key, role.key);
    var modified = A.isModified(m.key, role.key);
    var last = A.lastChange(m.key, role.key);

    var h = '<div class="c-tabs rp-tabs" role="group" aria-label="Matrix">' + Object.keys(A.MATRICES).map(function (k) {
      return '<button class="c-tab' + (k === m.key ? ' active' : '') + '" type="button" aria-pressed="' + (k === m.key) + '" data-matrix="' + k + '">' + esc(A.MATRICES[k].title) + '</button>';
    }).join('') + '</div>';

    h += '<div class="rp-layout"><aside class="rp-roles"><h2>Roles</h2><p class="sub">Select a role to view' + (canEdit ? ' and edit' : '') + ' permissions</p>';
    h += m.roles.map(function (r) {
      var c = countFor(m.key, r.key), on = r.key === role.key;
      return '<button class="rp-role" type="button" data-role="' + r.key + '" aria-pressed="' + on + '">' +
        '<span><span class="name">' + esc(r.label) + (c === null ? '' : '<span class="n">· ' + c + (c === 1 ? ' user' : ' users') + '</span>') +
        (A.isModified(m.key, r.key) ? '<span class="c-badge c-badge-warning">Modified</span>' : '') + '</span>' +
        '<span class="meaning">' + esc(MEANING[r.key] || '') + '</span></span>' +
        '<span class="c-radio-circle' + (on ? ' on' : '') + '" aria-hidden="true">' + (on ? '<span class="dot"></span>' : '') + '</span></button>';
    }).join('');
    h += '</aside><section class="rp-pane">';
    h += '<div class="rp-pane-head"><div><h2 id="paneTitle" tabindex="-1">' + esc(role.label) + (n === null ? '' : ' (' + n + (n === 1 ? ' user' : ' users') + ')') + '</h2>' +
      '<div class="meta">' + (modified ? '<span class="c-badge c-badge-warning">Modified from default</span>' : '<span class="c-badge c-badge-neutral">Artifact default</span>') +
      (last ? '<span class="last">Last change ' + esc(fmtWhen(last.at)) + ' by ' + esc(last.by) + (last.label === null ? ', reset to default' : '') + '</span>' : '') + '</div></div>' +
      (canEdit && modified ? '<button class="c-btn c-btn-secondary c-btn-sm" type="button" id="reset">Reset to default</button>' : '') + '</div>';
    if (role.key === 'super_admin') {
      h += '<div class="rp-note"><i class="ph ph-lock-simple"></i><span>Super Admin is the platform ceiling: every activity, everywhere. The ceiling cannot lower itself, so these switches are locked.</span></div>';
    } else if (!canEdit) {
      h += '<div class="rp-note"><i class="ph ph-eye"></i><span>' + esc(A.ROLES_ARE_SUPER) + ' You can see what this role holds; only a Super Admin can change it.</span></div>';
    }
    h += m.groups.map(function (g) {
      return '<div class="rp-group"><h3>' + esc(g.title) + '</h3>' + g.items.map(function (item) {
        var on = A.holdsIn(m.key, role.key, item.label);
        var lock = A.lockReason(m.key, role.key, item.label);
        var disabled = !canEdit || !!lock;
        return '<div class="rp-row' + (on ? '' : ' off') + '"><div class="t"><div class="lab">' + esc(item.label) + '</div>' +
          (lock && role.key !== 'super_admin' ? '<div class="help">' + esc(lock) + '</div>' : '') + '</div>' +
          '<div class="ctl">' + (lock ? '<i class="ph ph-lock-simple lock" title="' + esc(lock) + '" aria-hidden="true"></i>' : '') +
          '<button class="c-switch-track rp-switch' + (on ? ' on' : '') + (disabled ? ' is-off' : '') + '" type="button" role="switch" aria-checked="' + on + '" aria-label="' + esc(item.label) + '" data-label="' + esc(item.label) + '"' +
          (disabled ? ' aria-disabled="true"' : '') + (lock ? ' title="' + esc(lock) + '"' : '') + '><span class="c-switch-thumb"></span></button></div></div>';
      }).join('') + '</div>';
    }).join('');
    h += '</section></div>';
    content.innerHTML = h;
    wire();
  }

  function wire() {
    /* Every handler re-renders, so each one puts focus back where it was. */
    function refocus(sel) { var el = document.querySelector(sel); if (el) el.focus(); }
    document.querySelectorAll('[data-matrix]').forEach(function (b) {
      b.addEventListener('click', function () { state.matrix = b.dataset.matrix; render(); refocus('[data-matrix="' + state.matrix + '"]'); });
    });
    document.querySelectorAll('.rp-role').forEach(function (b) {
      b.addEventListener('click', function () { state.role = b.dataset.role; render(); refocus('.rp-role[data-role="' + state.role + '"]'); });
    });
    document.querySelectorAll('.rp-switch').forEach(function (sw) {
      sw.addEventListener('click', function () {
        var label = sw.dataset.label;
        if (sw.getAttribute('aria-disabled') === 'true') {
          Sh.toast('neutral', 'Not changed', A.lockReason(state.matrix, state.role, label) || A.ROLES_ARE_SUPER);
          return;
        }
        var on = sw.getAttribute('aria-checked') === 'true';
        var err = A.setOverride(S, viewer, state.matrix, state.role, label, !on);
        if (err) { Sh.toast('warning', 'Not changed', err); return; }
        render();
        refocus('.rp-switch[data-label="' + CSS.escape(label) + '"]');
      });
    });
    var reset = document.getElementById('reset');
    if (reset) reset.addEventListener('click', function () {
      var err = A.resetRole(S, viewer, state.matrix, state.role);
      if (err) { Sh.toast('warning', 'Not reset', err); return; }
      var m = A.MATRICES[state.matrix];
      var role = m.roles.filter(function (r) { return r.key === state.role; })[0];
      render();
      refocus('#paneTitle');
      Sh.toast('success', 'Reset to default', m.title + ' · ' + (role ? role.label : state.role));
    });
  }
})();
</script>
</body>
