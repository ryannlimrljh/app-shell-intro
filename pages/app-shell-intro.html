<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Collabrium — App Shell</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="../collabrium-dls/tokens.css" />
<link rel="stylesheet" href="../collabrium-dls/components.css" />
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{font-family:var(--font-primary); color:var(--color-neutral-9);}

  /* .c-shell in components.css is pinned to a 480px demo height for
     the component gallery — this page is a real full-viewport shell,
     so the height is overridden here, not in components.css.
     position:relative makes it the containing block for the main nav's
     new absolute positioning below, so the nav's insets resolve against
     the shell, not the viewport at large. */
  .c-shell{height:100dvh; position:relative;}

  /* Top-center canvas date — "[Day], [Date]", e.g. "Wednesday, August
     5". position:fixed and centered on the full viewport (the DS's
     Page canvas — the whole warm background, not just the Content
     region to the right of the sidebar), not tied to the wipe/nav
     choreography, so it's already there under the wipe panel from
     first paint, same as the canvas itself. z-index sits above the
     plain canvas but below the wipe panel (100)/account menu (20)/
     hover label, so the wipe still sweeps over it correctly. Text/
     styling reuses Page header's own subtitle recipe (body2,
     Neutral-5) since there's no other "small label text on canvas"
     precedent to draw from. */
  .c-canvas-date{position:fixed; top:var(--spacing-24); left:50%; transform:translateX(-50%); z-index:5; margin:0; font-family:var(--font-primary); font-size:var(--text-body2-size); font-weight:var(--text-body2-weight); color:var(--color-neutral-5); pointer-events:none;}

  /* Content region — personalized greeting. Centered, unlike Page
     header (left-aligned title/subtitle, App Shell's documented
     top-of-screen pattern) — this is a different shape (a dashboard
     "hero" greeting, not the shell's structural header), so it's a new
     page-local block rather than a reuse of .c-shell-page-header.
     Still built from the same h1/body1 type tokens .c-shell-page-header
     itself uses, not new sizes — the only new thing here is the
     centered layout. Name is read from the sidebar account row's own
     .c-userpicker-name (see script below) rather than a second hardcoded
     "Bryan" — one source for the name, not two copies that can drift. */
  .c-canvas-greeting{text-align:center; padding:var(--spacing-60) var(--page-gutter) 0;}
  .c-canvas-greeting h1{margin:0 0 var(--spacing-8); font-family:var(--font-primary); font-size:var(--text-h1-size); font-weight:var(--text-h1-weight); color:var(--color-neutral-9);}
  .c-canvas-greeting p{margin:0; font-family:var(--font-primary); font-size:var(--text-body1-size); font-weight:var(--text-body1-weight); color:var(--color-neutral-5);}

  /* Greeting entrance — held invisible until the nav has finished its
     own auto-collapse (see revealCanvasContent() in the script below),
     then fade + slide up, staggered one after another (h1, then
     subtitle) via transition-delay off a single shared .is-revealed
     trigger — one JS call sets the class on both at once, CSS alone
     does the staggering. The card slider's own children stagger
     separately and more elaborately — see .c-card-slide below —
     rather than the whole slider moving as one block. Same easing
     curve as the nav's own slide-in (cubic-bezier(.16,1,.3,1)) for a
     consistent "settle" feel on these two. */
  .c-canvas-greeting h1, .c-canvas-greeting p{opacity:0; transform:translateY(16px); transition:opacity 550ms cubic-bezier(.16,1,.3,1), transform 550ms cubic-bezier(.16,1,.3,1);}
  .c-canvas-greeting h1.is-revealed{opacity:1; transform:translateY(0);}
  .c-canvas-greeting p.is-revealed{opacity:1; transform:translateY(0); transition-delay:130ms;}

  /* Blank placeholder cards — now a slider, not the Content region's
     fixed 4-column box grid (.c-shell-grid), since 8 cards at a
     "larger" width don't fit a static grid without either shrinking
     back down or wrapping to multiple rows — neither of which is what
     "slider content, drag or arrow keys to move" asks for. No slider/
     carousel component exists anywhere in this DS yet, so this is a
     new, page-local composition — built from Card's own .c-card fill/
     border/radius exactly, unmodified, laid out in a horizontally
     scrolling flex track instead of a grid. Drag-to-scroll and
     ArrowLeft/ArrowRight paging are handled in the script below;
     native scroll-snap does the actual per-card settling so the JS
     doesn't have to compute exact stop positions itself.

     Full-bleed on the right: margin-right cancels .c-shell-content's
     own page-gutter (32px) right padding, so the scrollable window's
     right edge is the true viewport edge — cards crop flush against it
     while scrolling, no reserved gutter creating a gap before the true
     end. The *only* padding-right that exists is on the track itself
     (16px, below), so it scrolls away with the content and only ever
     shows up once you've actually reached the last card.

     Left inset is dynamic, not the static page-gutter either — the
     nav floats on top now (position:absolute, see below), so the
     track's own leading padding-left has to clear the nav's own right
     edge + a 16px gap, in both collapse states. Target *viewport*
     position: 16(nav's own left inset)+240(width)+16(gap)=272px
     expanded, 16+72+16=104px collapsed — but the track sits inside
     .c-shell-content's own 32px page-gutter left padding already, so
     the padding *value* has to be 32px less than that target to land
     the card at the right actual screen position: 272-32=240px
     expanded, 104-32=72px collapsed (this 32px was missed on the
     first pass — verified and caught via direct pixel/hit-test
     checks, not getComputedStyle, see below for why that mattered
     here). It's on the track (not the outer scroll window) so it
     scrolls away too, same as the trailing padding — once you've
     scrolled past card 1's leading edge, the nav's overlay is no
     longer this content's problem.

     Set from JS (updateCardSliderInset(), called from
     setSidebarCollapsed() so it can never drift out of sync with the
     collapse state), not a :has(.c-sidebar.is-collapsed) reactive CSS
     rule — tried that first, but shrinking the *scrollable content's
     own* leading padding moves every card's scroll-snap-align:start
     offset with it, and CSS scroll-snap re-aligns scrollLeft to the
     nearest snap target's new offset on the very next layout pass,
     silently scrolling the new padding right back out of view. A
     plain scrollLeft=0 reset issued the same tick doesn't survive
     that. overflow-anchor:none on the scroll container (below) does
     NOT fix this either — that's a different mechanism (scroll
     *anchoring*, not scroll *snap*) and was a dead end tried first.
     The actual fix, in updateCardSliderInset(): briefly set
     scroll-snap-type:none around the padding change (one
     requestAnimationFrame), so there's no snap target yet for the
     browser to re-align to when the padding shifts, then restore it.
     The scrollLeft=0 reset stays too (only applied when the slider
     was already at/near the start — never fighting a real mid-slider
     scroll position), as a belt-and-suspenders correction alongside
     the snap suppression, not a replacement for it. No CSS transition
     on padding-left, for the same reason — an animated change gives
     the browser a longer window in which a snap re-alignment could
     still slip in before the suppression takes hold. */
  .c-card-slider{overflow-x:auto; overflow-anchor:none; scroll-snap-type:x proximity; cursor:grab; outline:none; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin-right:calc(-1 * var(--page-gutter));}
  .c-card-slider::-webkit-scrollbar{display:none;}
  .c-card-slider.is-dragging{cursor:grabbing; scroll-snap-type:none; user-select:none;}
  .c-card-slider-track{display:flex; gap:var(--spacing-16); width:max-content; padding:4px 16px var(--spacing-8) 240px; perspective:900px;}
  .c-card-slide{flex:0 0 340px; width:340px; min-height:280px; scroll-snap-align:start;}

  /* Card entrance — each card fades/glides in independently, not the
     slider as one block, per feedback ("each card randomly move in
     [at a] slight different speed"). --card-reveal-delay/-duration are
     set per card from JS (revealCanvasContent(), randomized — see
     script below) rather than a fixed nth-child stagger, since a
     uniform pattern reads as mechanical and the ask was specifically
     for a less uniform, "sophisticated" feel. Defaults here (650ms,
     0ms delay) only matter if the JS somehow didn't run — the real
     values always come from the inline custom properties. Gentler
     than the h1/subtitle entrance on purpose: slower (~600–820ms vs a
     flat 550ms), more travel (24px vs 16px), and a softer, more
     decelerated ease-out curve (cubic-bezier(.22,1,.36,1) vs the
     nav/h1's snappier cubic-bezier(.16,1,.3,1)). */
  .c-card-slide{opacity:0; transform:translateY(24px); transition:opacity var(--card-reveal-duration, 650ms) cubic-bezier(.22,1,.36,1), transform var(--card-reveal-duration, 650ms) cubic-bezier(.22,1,.36,1); transition-delay:var(--card-reveal-delay, 0ms);}
  .c-card-slide.is-revealed{opacity:1; transform:translateY(0);}

  /* Main nav — position:absolute, floating overlay with a top z-index,
     not a flex sibling reserving row space anymore. Canvas content
     (.c-shell-main) is now the *only* in-flow flex child of .c-shell,
     so it fills the full row width/height on its own — its position
     and alignment (the centered greeting, the centered canvas date)
     no longer shift based on whether the nav is expanded, collapsed,
     or mid-slide-in. The nav paints on top of the canvas instead
     (z-index above plain content, below the wipe panel/account menu/
     hover label so those still layer correctly over it).
     top:0/left:0/bottom:0 + components.css's own untouched
     margin:16px 0 16px 16px (still applies to a position:absolute box
     exactly like it did in flow) is what reproduces the original 16px
     inset — no need to restate that spacing value here. Still starts
     off-screen and slides in via transform, same as before; transform
     composes fine with absolute positioning. */
  .c-sidebar-shell{position:absolute; top:0; left:0; bottom:0; z-index:50; transition:transform 450ms cubic-bezier(.16,1,.3,1); transform:translateX(-120%);}
  .c-sidebar-shell.is-in{transform:translateX(0);}

  /* Cast shadow on the nav itself — now that it's position:absolute and
     paints on top of the canvas (see note above), it reads as a floating
     panel rather than a docked column, so it should look like one.
     shadow-3 (not the heavier shadow-4) keeps it subtle: enough lift to
     separate it from the canvas behind it without looking like a modal.
     Page-local, since components.css's plain .c-sidebar is still meant
     for the flush, in-flow docked case elsewhere. */
  .c-sidebar-shell .c-sidebar{box-shadow:var(--shadow-3);}

  /* Wipe intro: a single solid, slanted panel — off-screen left on load
     (so the warm canvas is what's actually visible first) — sweeps in,
     holds fully covering the viewport for a beat, then sweeps out to
     the right. skewX turns it into a parallelogram instead of a plain
     rectangle; left/right overscan (beyond -12deg's worst-case shift of
     ~50vh*tan(12deg)≈10.6vh at the top/bottom edges, from the default
     center transform-origin) keeps the slanted edges from ever exposing
     a gap at the viewport's top or bottom while it's in the "cover"
     resting position. transform order matters here: translateX is
     listed first (outermost), so it always shifts the *already-skewed*
     shape by a plain screen-space amount, independent of the skew. */
  .wipe-panel{position:fixed; top:0; bottom:0; left:-14vh; right:-14vh; z-index:100; background:var(--color-amber); transform:translateX(-160vw) skewX(-12deg); transition:transform 380ms cubic-bezier(.65,0,.35,1);}

  /* Sidebar footer — pin to the bottom. DESIGN-SYSTEM.md documents the
     Footer row as "pinned to the bottom (margin-top: auto)", but
     components.css actually ships a fixed margin-top:spacing-16 instead
     — a real gap between the spec and the component, not something App
     Shell invented. Overridden here at the page level (not in
     components.css) for the same reason .c-shell's height is: this
     page needs the documented behavior, but fixing the shared file
     isn't this page's call to make. .c-sidebar is already a stretched-
     height flex column (via the align-items:stretch chain from
     .c-shell down), so margin-top:auto has a real height to push
     against. The existing border-top (from components.css, untouched)
     is what reads as "a divider on top of the row" once this sits
     pinned at the bottom, directly above the account row below. */
  .c-sidebar-footer{margin-top:auto;}

  /* Sidebar footer — account row, now a menu trigger. Not a documented
     SidebarNav sub-part yet (DESIGN-SYSTEM.md's Footer row says
     "sign-out, account, or help slot" but specs no row anatomy of its
     own) — composed from UserPicker's existing avatar/name/role classes
     (.c-userpicker-*) rather than inventing new ones, same "compose,
     don't invent" rule App Shell follows elsewhere. It's a <button> now
     (was a plain div) since it opens the account menu below. Collapse
     behavior mirrors nav items: text hides, avatar stays and
     re-centers. */
  .c-sidebar-account{display:flex; align-items:center; gap:var(--spacing-12); width:100%; padding:var(--spacing-8) var(--spacing-12); margin-bottom:var(--spacing-4); border:none; background:transparent; border-radius:var(--radius-sm); font-family:inherit; text-align:left; cursor:pointer; transition:background-color var(--duration-fast) var(--ease-standard);}
  .c-sidebar-account:hover{background:var(--color-neutral-2);}
  .c-sidebar.is-collapsed .c-sidebar-account{justify-content:center; padding:var(--spacing-8) 0;}
  .c-sidebar.is-collapsed .c-sidebar-account .c-userpicker-text{display:none;}

  /* Account menu — opens above the trigger (it's pinned to the bottom,
     so there's no room below), Settings + Log out. No existing
     component covers "simple icon+label popover menu" exactly, so this
     follows the documented popover convention instead (shadow-3,
     radius-md, 1px Neutral-3 border, Neutral-1 fill — see
     DESIGN-SYSTEM.md's Elevation table: "shadow-3 | Popovers,
     dropdowns") with row hover reusing the same Neutral-2 token every
     other row/item hover in this system already uses. Click-outside +
     Escape to close matches UserPicker's/MultiSelect's own dropdown
     pattern.

     position:fixed, living outside .c-sidebar in the markup, JS-
     positioned against the trigger's own getBoundingClientRect() —
     not position:absolute nested inside the account row. .c-sidebar
     has overflow-x:hidden (never horizontally scrollable — see that
     rule's own comment in components.css), and a clipped ancestor
     clips absolutely-positioned descendants too, no matter their
     offsets, the exact same reason the collapsed sidebar-toggle button
     and the collapsed hover-label both already live outside .c-sidebar
     as shared, JS-positioned elements instead of nesting inside it.

     z-index:60, above .c-sidebar-shell's 50 (not the component's
     default 20 — components.css wrote that back when the nav was a
     plain in-flow column with nothing above it worth stacking against).
     Now that the nav is a position:absolute overlay that paints on top
     of the canvas, the popover opens directly over the nav's own
     footprint (it's anchored right above the account row, inside the
     rail), so it needs to out-rank the rail or the rail paints over
     it — which is exactly what was happening: icons fully hidden,
     labels clipped to their tail ("Settings" reading as "ngs"). */
  .c-account-menu{display:none; position:fixed; width:200px; z-index:60; background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); box-shadow:var(--shadow-3); padding:var(--spacing-4); overflow:hidden;}
  .c-account-menu.is-open{display:block;}
  .c-account-menu-item{display:flex; align-items:center; gap:var(--spacing-12); width:100%; height:36px; padding:0 var(--spacing-8); border:none; background:transparent; border-radius:var(--radius-sm); font-family:var(--font-primary); font-size:var(--text-body1-size); font-weight:500; color:var(--color-neutral-9); text-align:left; cursor:pointer; transition:background-color var(--duration-fast) var(--ease-standard);}
  .c-account-menu-item:hover{background:var(--color-neutral-2);}
  .c-account-menu-item i{flex:none; font-size:16px; color:var(--color-neutral-5);}

  /* Logo — now a menu trigger, same "wrap the existing element in a
     <button>, reset the button chrome, keep everything else" move
     .c-sidebar-account already made. Row padding/radius/hover echo the
     account row's own so both triggers in this rail read as the same
     kind of control. */
  .c-sidebar-logo{border:none; background:transparent; padding:var(--spacing-4); border-radius:var(--radius-sm); cursor:pointer; transition:background-color var(--duration-fast) var(--ease-standard);}
  .c-sidebar-logo:hover{background:var(--color-neutral-2);}

  /* App switcher menu — same popover convention and same off-DOM/
     position:fixed/z-index:60 reasoning as .c-account-menu above (see
     its comment for the clipping + stacking rationale in full; not
     repeated here). Only real difference: it opens *below* its trigger,
     not above — the logo sits at the top of the rail, so there's room
     underneath, unlike the footer-pinned account row. Wider than the
     account menu (240px vs 200px) since these are logo lockups, not
     icon+label rows, and the widest of the four ("Influencers") needs
     the room.

     Row chrome is now a direct copy of .c-account-menu-item's own
     values (gap-12, padding 0 spacing-8, radius-sm, Neutral-2 hover) —
     same trigger family, same row recipe, so the two menus read as one
     consistent pattern instead of two different ones stacked in the
     same rail. The one deliberate difference: height 40px, not 36 —
     the logo images need a hair more vertical room than a 16px icon +
     text row does. Checkmark uses margin-left:auto (was
     justify-content:space-between on the row) — same visual result,
     but keeps the row a plain content-first flex line like
     .c-account-menu-item's, not a two-column layout with its own
     spacing model.

     Logo sizing: all four source SVGs share the same viewBox height
     (269) and the same combined ink bounding box (~162 units tall,
     verified — "Studio"/"Sales" measure literally identical, "Content"
     and "Influencers" are within ~3% of that, i.e. sub-pixel at this
     size) — so scaling every <img> to the same CSS height with
     width:auto already renders every wordmark at the same cap-height;
     confirmed in-browser too (getBoundingClientRect().height reports
     the identical value for all four). What differs, correctly, is
     each logo's rendered *width* — "Influencers" is the longest word,
     so its image is the widest; that's the wordmark being read at a
     consistent size, not an inconsistent one. Bumped from 18px to 22px
     ("enlarge the logos") — still comfortable in the 240px menu even
     for the widest lockup. */
  .c-app-switcher-menu{display:none; position:fixed; width:240px; z-index:60; background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); box-shadow:var(--shadow-3); padding:var(--spacing-4); overflow:hidden;}
  .c-app-switcher-menu.is-open{display:block;}
  .c-app-switcher-item{display:flex; align-items:center; gap:var(--spacing-12); width:100%; height:40px; padding:0 var(--spacing-8); border:none; background:transparent; border-radius:var(--radius-sm); cursor:pointer; transition:background-color var(--duration-fast) var(--ease-standard);}
  .c-app-switcher-item:hover{background:var(--color-neutral-2);}
  .c-app-switcher-item img{height:22px; width:auto; display:block;}
  .c-app-switcher-item i{flex:none; margin-left:auto; font-size:16px; color:var(--color-obsidian); visibility:hidden;}
  .c-app-switcher-item.is-active i{visibility:visible;}
</style>
</head>
<body>

  <div class="wipe-panel" id="wipePanel" aria-hidden="true"></div>

  <p class="c-canvas-date" id="canvasDate"></p>

  <div class="c-shell">
    <div class="c-sidebar-shell" id="shellSidebarShell">
      <nav class="c-sidebar" id="shellSidebarNav">
        <div class="c-sidebar-header">
          <button class="c-sidebar-logo" type="button" id="appSwitcherTrigger" aria-haspopup="menu" aria-expanded="false" aria-controls="appSwitcherMenu">
            <img class="js-sidebar-logo-img"
                 src="../collabrium-dls/logo-lockups/collabrium-default-logo.svg"
                 data-expanded-src="../collabrium-dls/logo-lockups/collabrium-default-logo.svg"
                 data-collapsed-src="../collabrium-dls/SVG/coin.svg"
                 alt="Collabrium" />
          </button>
        </div>
        <div class="c-sidebar-section">Overview</div>
        <button class="c-sidebar-item active" type="button"><i class="ph-fill ph-house"></i><span class="label">Dashboard</span><span class="c-sidebar-hover-text">Dashboard</span></button>
        <button class="c-sidebar-item" type="button"><i class="ph-fill ph-chart-bar"></i><span class="label">Reports</span><span class="c-sidebar-hover-text">Reports</span></button>
        <div class="c-sidebar-footer">
          <button class="c-sidebar-account" type="button" id="accountMenuTrigger" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu">
            <span class="c-userpicker-avatar">BW</span>
            <span class="c-userpicker-text">
              <span class="c-userpicker-name">Bryan Wong</span>
              <span class="c-userpicker-role">Administrator</span>
            </span>
          </button>
        </div>
      </nav>
      <button class="c-sidebar-toggle js-sidebar-toggle" type="button" aria-label="Collapse sidebar" data-sidebar-toggle="shellSidebarNav">
        <svg class="js-sidebar-toggle-icon" viewBox="0 0 20 20" fill="none">
          <rect x="2.5" y="3.5" width="15" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
          <line x1="9" y1="3.5" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
          <path class="js-sidebar-toggle-arrow" d="M13.5 7 11 10l2.5 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="c-shell-main">
      <div class="c-shell-content">
        <div class="c-canvas-greeting">
          <h1 id="greetingH1"><span id="greetingText"></span> <span aria-hidden="true">🌻</span>.</h1>
          <p id="greetingSubtitle">Here's what needs your eyes across the business today.</p>
        </div>
        <div class="c-card-slider" id="cardSlider" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Highlights" style="margin-top:var(--spacing-32)">
          <div class="c-card-slider-track">
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
            <div class="c-card c-card-slide"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="c-sidebar-hover-label" id="shellSidebarHoverLabel" role="tooltip"></div>

  <div class="c-account-menu" id="accountMenu" role="menu" aria-hidden="true">
    <button class="c-account-menu-item" type="button" role="menuitem"><i class="ph-fill ph-gear"></i><span>Settings</span></button>
    <button class="c-account-menu-item" type="button" role="menuitem"><i class="ph-fill ph-sign-out"></i><span>Log out</span></button>
  </div>

  <div class="c-app-switcher-menu" id="appSwitcherMenu" role="menu" aria-hidden="true">
    <button class="c-app-switcher-item" type="button" role="menuitemradio" data-engine="studio" aria-checked="false"><img src="assets/logos/collab-studio.svg" alt="Studio" /><i class="ph-fill ph-check"></i></button>
    <button class="c-app-switcher-item" type="button" role="menuitemradio" data-engine="sales" aria-checked="false"><img src="assets/logos/collab-sales.svg" alt="Sales" /><i class="ph-fill ph-check"></i></button>
    <button class="c-app-switcher-item" type="button" role="menuitemradio" data-engine="influencers" aria-checked="false"><img src="assets/logos/collab-influencers.svg" alt="Influencers" /><i class="ph-fill ph-check"></i></button>
    <button class="c-app-switcher-item" type="button" role="menuitemradio" data-engine="content" aria-checked="false"><img src="assets/logos/collab-content.svg" alt="Content" /><i class="ph-fill ph-check"></i></button>
  </div>

<script type="module">
// Motion (motion.dev's vanilla JS package, not the React build — this
// page has no framework) via ESM CDN import, no bundler needed, same
// no-build-step approach as the rest of this static page. Pinned to a
// major version rather than @latest so this stress-test page doesn't
// silently change behavior on a future Motion release. Used below only
// for the card tilt's spring physics — everything else on this page
// stays plain CSS transitions/vanilla JS, on purpose, not migrated to
// Motion wholesale just because it's now loaded.
import { animate } from "https://cdn.jsdelivr.net/npm/motion@12/+esm";

(function () {
  // Top-center canvas date — "[Day], [Date]". No explicit locale passed
  // to toLocaleDateString, so it renders in whatever locale the user's
  // own browser/OS is set to ("follow system setting") rather than a
  // hardcoded "en-US" — weekday/month names and date order all follow
  // the visitor's actual system, not an assumption baked into the page.
  // Computed once on load, not a live-updating clock — this page has no
  // need to notice a real midnight rollover.
  const canvasDate = document.getElementById('canvasDate');
  if (canvasDate) {
    canvasDate.textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
    });
  }

  // Content region greeting — "Good [morning/afternoon/evening],
  // [First name]". Same "follow system setting" idea as the canvas
  // date above: the time-of-day segment is read from the visitor's own
  // system clock (new Date().getHours()), not hardcoded to "Good
  // morning" regardless of when the page is actually opened. First name
  // is read from the sidebar account row's own .c-userpicker-name text
  // (currently "Bryan Wong") rather than a second hardcoded "Bryan" —
  // one source for the name, so the greeting can't drift out of sync
  // with the account row if that name ever changes.
  const greetingText = document.getElementById('greetingText');
  if (greetingText) {
    const hour = new Date().getHours();
    const timeOfDay = hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';
    const fullName = document.querySelector('.c-userpicker-name');
    const firstName = fullName ? fullName.textContent.trim().split(' ')[0] : '';
    greetingText.textContent = `Good ${timeOfDay}, ${firstName}`;
  }

  // Card slider — drag (pointer events, so it works for mouse and touch
  // alike with one code path) and ArrowLeft/ArrowRight paging by one
  // card's own width + the track's gap. No slider/carousel component
  // exists in this DS yet, so this is new, minimal, page-local behavior
  // — not a port of anything. Native CSS scroll-snap (see .c-card-slide
  // in <style> above) handles the actual per-card settling; this script
  // only ever sets scrollLeft, never computes exact stop positions
  // itself.
  const cardSlider = document.getElementById('cardSlider');
  if (cardSlider) {
    let isDragging = false;
    let dragStartX = 0;
    let scrollLeftAtDragStart = 0;
    let didDrag = false; // distinguishes an actual drag from a plain click, so a click on a card isn't swallowed as a failed drag

    cardSlider.addEventListener('pointerdown', (e) => {
      isDragging = true;
      didDrag = false;
      dragStartX = e.clientX;
      scrollLeftAtDragStart = cardSlider.scrollLeft;
      cardSlider.classList.add('is-dragging');
      cardSlider.setPointerCapture(e.pointerId);
    });
    cardSlider.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      if (Math.abs(dx) > 3) didDrag = true;
      cardSlider.scrollLeft = scrollLeftAtDragStart - dx;
    });
    function endDrag() {
      isDragging = false;
      cardSlider.classList.remove('is-dragging');
    }
    cardSlider.addEventListener('pointerup', endDrag);
    cardSlider.addEventListener('pointercancel', endDrag);
    cardSlider.addEventListener('click', (e) => {
      if (didDrag) e.preventDefault(); // suppress the click a drag-release fires, so it doesn't read as a stray click on whatever's under the pointer
    });

    cardSlider.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const track = cardSlider.querySelector('.c-card-slider-track');
      const gap = track ? parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap) || 0 : 0;
      const card = cardSlider.querySelector('.c-card-slide');
      const step = (card ? card.getBoundingClientRect().width : 340) + gap;
      cardSlider.scrollBy({ left: e.key === 'ArrowRight' ? step : -step, behavior: 'smooth' });
    });

    // Card tilt — each card leans toward the pointer in 3D
    // (rotateX/rotateY, pivoting around its own center), spring-
    // animated via Motion rather than a CSS transition, so it has real
    // physics (stiffness/damping) instead of a fixed easing curve —
    // that's what actually gives the "chases the pointer, slightly
    // overshoots, settles" feel a plain ease can't. .c-card-slider-
    // track's own perspective (in <style> above) is what makes the
    // rotation read as 3D depth instead of a flat skew.
    //
    // Deferred per card until *that card's own* entrance transition
    // (the CSS opacity/translateY reveal from the previous pass) has
    // actually finished — not attached at load — so a stray pointer
    // already resting over a card during its staggered, randomized
    // entrance can't fight the entrance transform before the card has
    // even finished arriving.
    //
    // Mouse-only (pointerType check): the same pointer events already
    // drive this slider's own drag-to-scroll on touch, and a finger
    // panning across cards would otherwise also fire wild tilts on
    // every card it crosses — a real conflict, not a hypothetical one,
    // since both listen on overlapping pointer events. Also skipped
    // outright while an actual slider drag is in progress.
    function enableCardTilt(card) {
      const MAX_TILT_DEG = 12;
      card.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse' || cardSlider.classList.contains('is-dragging')) return;
        const rect = card.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width;
        const py = (e.clientY - rect.top) / rect.height;
        const rotateY = (px - 0.5) * 2 * MAX_TILT_DEG;
        const rotateX = -(py - 0.5) * 2 * MAX_TILT_DEG;
        animate(card, { rotateX, rotateY }, { type: 'spring', stiffness: 300, damping: 22, mass: 0.6 });
      });
      card.addEventListener('pointerleave', (e) => {
        if (e.pointerType !== 'mouse') return;
        animate(card, { rotateX: 0, rotateY: 0 }, { type: 'spring', stiffness: 220, damping: 18 });
      });
    }
    document.querySelectorAll('.c-card-slide').forEach((card) => {
      card.addEventListener('transitionend', (e) => {
        if (e.propertyName === 'transform') enableCardTilt(card);
      }, { once: true });
    });
  }

  // SidebarNav — collapse/expand toggle. Swaps the logo asset itself
  // and the toggle icon's arrow direction. Pulled out into a named
  // function (ported logic, unmodified) so the auto-collapse timer
  // further down can drive the exact same state change a manual click
  // does — logo swap, arrow direction, aria-label all included — rather
  // than just toggling the class and leaving the toggle button's own
  // visual state out of sync.
  // Card slider's leading inset has to track the nav's own collapse
  // state (see .c-card-slider-track's own CSS comment for why this is
  // JS, not a :has() reactive rule — scroll anchoring silently
  // cancelled the pure-CSS version out). Called from
  // setSidebarCollapsed() below so it can never drift out of sync with
  // the class that actually drives the nav's width.
  function updateCardSliderInset(collapsed) {
    const track = document.querySelector('.c-card-slider-track');
    const slider = document.getElementById('cardSlider');
    if (!track || !slider) return;
    const wasAtStart = slider.scrollLeft <= 4; // only correct scrollLeft if the user hasn't actually scrolled into the slider yet — don't fight a real mid-slider position
    // Root cause (found by direct pixel/hit-test verification, not
    // getComputedStyle — see this function's call site for why):
    // shrinking padding-left moves every card's own scroll-snap-align:
    // start offset with it, and CSS scroll-snap re-aligns scrollLeft to
    // the nearest snap target's *new* offset on the very next layout —
    // which for card 1 is exactly the new padding-left value, silently
    // scrolling the padding right back out of view. overflow-anchor:
    // none (still set on .c-card-slider, doesn't hurt) does NOT prevent
    // this — that property governs scroll *anchoring*, a different
    // mechanism from scroll *snap*. The actual fix: suppress snapping
    // for one frame around the padding change, so there's no snap
    // target for the browser to re-align to yet.
    const previousSnapType = slider.style.scrollSnapType;
    slider.style.scrollSnapType = 'none';
    track.style.paddingLeft = collapsed ? '72px' : '240px';
    if (wasAtStart) slider.scrollLeft = 0;
    requestAnimationFrame(() => {
      slider.style.scrollSnapType = previousSnapType;
    });
  }

  function setSidebarCollapsed(nav, sidebarToggle, collapsed) {
    if (nav.classList.contains('is-collapsed') === collapsed) return;
    nav.classList.toggle('is-collapsed', collapsed);
    sidebarToggle.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');

    const img = nav.querySelector('.js-sidebar-logo-img');
    img.src = collapsed ? img.dataset.collapsedSrc : img.dataset.expandedSrc;

    const arrow = sidebarToggle.querySelector('.js-sidebar-toggle-arrow');
    arrow.setAttribute('d', collapsed ? 'M11.5 7 14 10l-2.5 3' : 'M13.5 7 11 10l2.5 3');

    updateCardSliderInset(collapsed);
  }
  document.addEventListener('click', (e) => {
    const sidebarToggle = e.target.closest('.js-sidebar-toggle');
    if (!sidebarToggle) return;
    const nav = document.getElementById(sidebarToggle.dataset.sidebarToggle);
    setSidebarCollapsed(nav, sidebarToggle, !nav.classList.contains('is-collapsed'));
  });

  // SidebarNav — collapsed hover label. Single shared, fixed-position
  // element; mouseover/mouseout (they bubble) rather than
  // mouseenter/mouseleave so it stays event-delegated. Ported from
  // collabrium-dls/preview.html's own implementation, unmodified.
  const hoverLabel = document.getElementById('shellSidebarHoverLabel');
  function showHoverLabel(item) {
    const nav = item.closest('.c-sidebar');
    const source = item.querySelector('.c-sidebar-hover-text');
    if (!hoverLabel || !nav || !nav.classList.contains('is-collapsed') || !source) return;
    const iconRect = item.querySelector('i').getBoundingClientRect();
    hoverLabel.textContent = source.textContent;
    hoverLabel.style.left = (iconRect.right + 8) + 'px';
    hoverLabel.style.top = (iconRect.top + iconRect.height / 2) + 'px';
    hoverLabel.style.transform = 'translateY(-50%)';
    hoverLabel.classList.add('is-visible');
  }
  function hideHoverLabel() {
    if (hoverLabel) hoverLabel.classList.remove('is-visible');
  }
  document.addEventListener('mouseover', (e) => {
    const item = e.target.closest('.c-sidebar-item');
    if (item && !item.contains(e.relatedTarget)) showHoverLabel(item);
  });
  document.addEventListener('mouseout', (e) => {
    const item = e.target.closest('.c-sidebar-item');
    if (item && !item.contains(e.relatedTarget)) hideHoverLabel();
  });
  document.addEventListener('focusin', (e) => {
    const item = e.target.closest('.c-sidebar-item');
    if (item) showHoverLabel(item);
  });
  document.addEventListener('focusout', (e) => {
    const item = e.target.closest('.c-sidebar-item');
    if (item) hideHoverLabel();
  });

  // Sidebar footer — account menu. Click the account row to toggle a
  // small popover (Settings, Log out) open above it. It's a shared,
  // position:fixed element living outside .c-sidebar (see its own CSS
  // comment for why — same clipping issue the collapsed hover-label
  // and sidebar-toggle button already solve the same way), so it's
  // positioned in JS against the trigger's own getBoundingClientRect(),
  // the same technique showHoverLabel() below already uses. Click-
  // outside and Escape close it, same pattern UserPicker's/MultiSelect's
  // own dropdowns already use elsewhere in this system. Settings/Log
  // out are inert here (no real settings screen or auth in this
  // stress-test page) — they just close the menu on click.
  const accountTrigger = document.getElementById('accountMenuTrigger');
  const accountMenu = document.getElementById('accountMenu');
  if (accountTrigger && accountMenu) {
    function positionAccountMenu() {
      const rect = accountTrigger.getBoundingClientRect();
      const menuWidth = accountMenu.offsetWidth || 200;
      const left = Math.max(8, Math.min(
        rect.left + rect.width / 2 - menuWidth / 2,
        window.innerWidth - menuWidth - 8
      ));
      accountMenu.style.left = left + 'px';
      accountMenu.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    }
    function closeAccountMenu() {
      accountMenu.classList.remove('is-open');
      accountMenu.setAttribute('aria-hidden', 'true');
      accountTrigger.setAttribute('aria-expanded', 'false');
    }
    function openAccountMenu() {
      positionAccountMenu();
      accountMenu.classList.add('is-open');
      accountMenu.setAttribute('aria-hidden', 'false');
      accountTrigger.setAttribute('aria-expanded', 'true');
    }
    accountTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = accountMenu.classList.contains('is-open');
      if (isOpen) closeAccountMenu(); else openAccountMenu();
    });
    accountMenu.addEventListener('click', (e) => {
      if (e.target.closest('.c-account-menu-item')) closeAccountMenu();
    });
    document.addEventListener('click', (e) => {
      if (!accountMenu.classList.contains('is-open')) return;
      if (e.target.closest('#accountMenu') || e.target.closest('#accountMenuTrigger')) return;
      closeAccountMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAccountMenu();
    });
  }

  // Sidebar header — app switcher. Click the logo to pick which
  // engine's lockup it shows (Studio / Sales / Influencers / Content).
  // Same position:fixed/JS-positioned/z-index:60 popover pattern as the
  // account menu above (see its CSS comment for the full clipping +
  // stacking rationale) — opens *below* the trigger instead of above,
  // since the logo sits at the top of the rail with room underneath.
  // Selecting an item swaps the sidebar's *expanded* logo image (via
  // the same data-expanded-src attribute setSidebarCollapsed() already
  // reads) to that engine's lockup and re-renders immediately if the
  // rail isn't currently collapsed; the collapsed coin icon is shared
  // across all four engines on purpose — none of the source files is a
  // compact square mark, so collapsed state stays engine-agnostic.
  const appSwitcherTrigger = document.getElementById('appSwitcherTrigger');
  const appSwitcherMenu = document.getElementById('appSwitcherMenu');
  if (appSwitcherTrigger && appSwitcherMenu) {
    const logoImg = appSwitcherTrigger.querySelector('.js-sidebar-logo-img');
    function positionAppSwitcherMenu() {
      const rect = appSwitcherTrigger.getBoundingClientRect();
      const menuWidth = appSwitcherMenu.offsetWidth || 240;
      const left = Math.max(8, Math.min(rect.left, window.innerWidth - menuWidth - 8));
      appSwitcherMenu.style.left = left + 'px';
      appSwitcherMenu.style.top = (rect.bottom + 8) + 'px';
    }
    function closeAppSwitcherMenu() {
      appSwitcherMenu.classList.remove('is-open');
      appSwitcherMenu.setAttribute('aria-hidden', 'true');
      appSwitcherTrigger.setAttribute('aria-expanded', 'false');
    }
    function openAppSwitcherMenu() {
      positionAppSwitcherMenu();
      appSwitcherMenu.classList.add('is-open');
      appSwitcherMenu.setAttribute('aria-hidden', 'false');
      appSwitcherTrigger.setAttribute('aria-expanded', 'true');
    }
    appSwitcherTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = appSwitcherMenu.classList.contains('is-open');
      if (isOpen) closeAppSwitcherMenu(); else openAppSwitcherMenu();
    });
    appSwitcherMenu.addEventListener('click', (e) => {
      const item = e.target.closest('.c-app-switcher-item');
      if (!item) return;
      appSwitcherMenu.querySelectorAll('.c-app-switcher-item').forEach((btn) => {
        const active = btn === item;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-checked', String(active));
      });
      logoImg.dataset.expandedSrc = item.querySelector('img').src;
      if (!logoImg.closest('.c-sidebar').classList.contains('is-collapsed')) {
        logoImg.src = logoImg.dataset.expandedSrc;
      }
      closeAppSwitcherMenu();
    });
    document.addEventListener('click', (e) => {
      if (!appSwitcherMenu.classList.contains('is-open')) return;
      if (e.target.closest('#appSwitcherMenu') || e.target.closest('#appSwitcherTrigger')) return;
      closeAppSwitcherMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAppSwitcherMenu();
    });
  }

  // Wipe intro. Sequence: blank warm canvas → a single slanted panel
  // sweeps in from the left and holds, fully covering the viewport →
  // sweeps out to the right, uncovering the canvas again → blank warm
  // canvas, briefly → the main nav slides in from the left. Timed with
  // plain setTimeouts (not transitionend chaining) since the hold phase
  // has no property change of its own to key an event off of. Runs on
  // every load (no sessionStorage skip, by design). See
  // docs/superpowers/specs/2026-08-05-app-shell-intro-page-design.md.
  const wipePanel = document.getElementById('wipePanel');
  const sidebarShell = document.getElementById('shellSidebarShell');
  if (wipePanel && sidebarShell) {
    const PRE_HOLD_MS = 150;        // blank warm canvas, before the panel enters
    const ENTER_MS = 380;           // panel sweeps in, covering the viewport — must match .wipe-panel's transition-duration in <style> above
    const HOLD_COVER_MS = 700;      // panel sits fully covering the viewport (Amber, no flashing)
    const EXIT_MS = 380;            // panel sweeps out, uncovering the viewport — same transition-duration as ENTER_MS
    const POST_WIPE_HOLD_MS = 200;  // blank warm canvas again, after the panel exits, before the nav slides in
    const NAV_DURATION_MS = 450;    // must match .c-sidebar-shell's transition-duration in <style> above
    const AUTO_COLLAPSE_DELAY_MS = 2500; // how long the nav stays expanded, once fully settled, before auto-collapsing

    function hideWipePanel() {
      wipePanel.style.display = 'none';
    }
    function revealNav() {
      sidebarShell.classList.add('is-in');
    }
    // Greeting/cards stay invisible (see their own CSS above) until
    // this fires — called only from inside autoCollapseNav(), below,
    // once the sidebar's own width transition (--duration-slow, 360ms)
    // has actually finished collapsing, not the moment the class is
    // set. Setting all three .is-revealed classes together here is the
    // *only* thing this needs to do — the h1→p→cards stagger itself is
    // pure CSS (transition-delay), not sequenced in JS.
    const SIDEBAR_COLLAPSE_TRANSITION_MS = 360; // must match .c-sidebar's own transition-duration in components.css
    function revealCanvasContent() {
      const h1 = document.getElementById('greetingH1');
      const subtitle = document.getElementById('greetingSubtitle');
      if (h1) h1.classList.add('is-revealed');
      if (subtitle) subtitle.classList.add('is-revealed');

      // Cards: each one gets its own randomized delay and duration
      // (read by .c-card-slide's own CSS via --card-reveal-delay/
      // -duration) instead of one shared timing for the whole row —
      // a fixed nth-child stagger would still look like a single
      // mechanical wave; per-card randomness is what actually reads as
      // "sophisticated" rather than programmatic. CARDS_BASE_DELAY_MS
      // keeps the first card starting after the h1/subtitle beat
      // above (130ms) has already begun, not simultaneously with it.
      const CARDS_BASE_DELAY_MS = 260;
      const CARDS_STAGGER_STEP_MS = 90;   // average spacing between one card's start and the next
      const CARDS_JITTER_MS = 50;         // +/- randomness on top of the step, so the spacing itself isn't perfectly even
      const CARDS_DURATION_MIN_MS = 600;
      const CARDS_DURATION_MAX_MS = 820;
      document.querySelectorAll('.c-card-slide').forEach((card, i) => {
        const jitter = (Math.random() * 2 - 1) * CARDS_JITTER_MS;
        const delay = Math.max(0, CARDS_BASE_DELAY_MS + i * CARDS_STAGGER_STEP_MS + jitter);
        const duration = CARDS_DURATION_MIN_MS + Math.random() * (CARDS_DURATION_MAX_MS - CARDS_DURATION_MIN_MS);
        card.style.setProperty('--card-reveal-delay', `${delay.toFixed(0)}ms`);
        card.style.setProperty('--card-reveal-duration', `${duration.toFixed(0)}ms`);
        card.classList.add('is-revealed');
      });
    }
    // Auto-collapse the main nav a couple seconds after it's settled —
    // reuses setSidebarCollapsed (defined above, in the sidebar-toggle
    // section) so this drives the exact same state a manual click does
    // (logo swap, arrow direction, aria-label), not just the class.
    function autoCollapseNav() {
      const nav = document.getElementById('shellSidebarNav');
      const toggle = document.querySelector('[data-sidebar-toggle="shellSidebarNav"]');
      if (nav && toggle) setSidebarCollapsed(nav, toggle, true);
      setTimeout(revealCanvasContent, SIDEBAR_COLLAPSE_TRANSITION_MS);
    }
    function enterCover() {
      wipePanel.style.transform = 'translateX(0) skewX(-12deg)';
    }
    function exitCover() {
      wipePanel.style.transform = 'translateX(160vw) skewX(-12deg)';
    }

    setTimeout(enterCover, PRE_HOLD_MS);
    setTimeout(exitCover, PRE_HOLD_MS + ENTER_MS + HOLD_COVER_MS);
    setTimeout(() => {
      hideWipePanel();
      setTimeout(() => {
        revealNav();
        setTimeout(autoCollapseNav, NAV_DURATION_MS + AUTO_COLLAPSE_DELAY_MS);
      }, POST_WIPE_HOLD_MS);
    }, PRE_HOLD_MS + ENTER_MS + HOLD_COVER_MS + EXIT_MS);

    // Fallback: guarantee the wipe panel hides, the nav reveals, and it
    // still auto-collapses even if something delays a timer (e.g. a
    // backgrounded/throttled tab) — all three functions are idempotent,
    // so this is harmless if the normal path already ran.
    setTimeout(() => {
      hideWipePanel();
      revealNav();
      setTimeout(autoCollapseNav, AUTO_COLLAPSE_DELAY_MS);
    }, PRE_HOLD_MS + ENTER_MS + HOLD_COVER_MS + EXIT_MS + POST_WIPE_HOLD_MS + 300);
  }
})();
</script>

</body>
</html>
