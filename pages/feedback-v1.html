   The measure happens after innerHTML and before any left/top is set,
   which is one forced layout per render rather than one per note. */
var NOTE_W = 210;      // the paper's edge. Square, so this is its height too
var OVERLAP = 30;      // how far each note tucks under the one before it
var ROW_GAP = 18;      // breathing room between rows, after the tallest note
var DRIFT_GAP_X = 52;  // between two clusters side by side
var DRIFT_GAP_Y = 40;  // between one band of clusters and the next
var LABEL_H = 26;      // the drift's name sits in this band above its notes

function layout(host, drifts) {
  var notes = host.querySelectorAll('.fb-note');
  if (!notes.length) { host.style.removeProperty('--fb-h'); return; }

  var W = host.clientWidth || 900;
  /* Below roughly two notes wide the scatter has nothing to scatter into:
     overlapping cards on a 375px screen means every note is half-hidden
     with no pointer to part them. One column, still tilted. */
  var narrow = W < 2 * NOTE_W + 40;
  var w = narrow ? Math.min(W, 320) : NOTE_W;
  /* Overlap is what the pointer parts. With reduced motion the parting is
     off, so the overlap has to go with it or the notes underneath become
     unreachable by anything except the tab key. A positive gap instead. */
  var step = narrow ? w : (REDUCED ? w + 14 : w - OVERLAP);

  var i, h = [];
  for (i = 0; i < notes.length; i++) {
    notes[i].style.setProperty('--fb-w', w + 'px');
    h.push(notes[i].offsetHeight);
  }

  /* Places notes [from, to) as an overlapping run inside `avail` pixels,
     starting at (x0, y0), wrapping to a new row when the run runs out of
     width. Returns the bottom it reached. Jitter is deterministic from
     the note's id, so a redraw does not reshuffle the wall. */
  function place(from, to, x0, y0, avail) {
    var perRow = narrow ? 1 : Math.max(1, Math.floor((avail - w) / step) + 1);
    var col = 0, rowTop = y0, rowMax = 0, low = y0, k;
    for (k = from; k < to; k++) {
      if (col >= perRow) { rowTop += rowMax + ROW_GAP; col = 0; rowMax = 0; }
      var key = notes[k].dataset.open || String(k);
      var jx = narrow ? 0 : jit(key, 13) - 6;
      var jy = narrow ? 0 : jit(key + 'y', 25) - 12;
      var x = narrow ? x0 + Math.round((avail - w) / 2) : x0 + col * step + jx;
      var top = rowTop + Math.max(0, jy);
      notes[k].style.left = Math.max(0, Math.min(x, W - w)) + 'px';
      notes[k].style.top = top + 'px';
      /* Later notes sit on top of earlier ones, which is what makes the
         overlap read as a pile rather than a mistake. The peek pass
         overrides this for whichever note the pointer is on. */
      notes[k].style.zIndex = String(10 + k);
      var bot = top + h[k];
      if (bot - rowTop > rowMax) rowMax = bot - rowTop;
      if (bot > low) low = bot;
      col++;
    }
    return low;
  }

  var bottom;
  if (!drifts) {
    bottom = place(0, notes.length, 0, 0, W);
  } else {
    /* Drifts pack left to right and wrap, rather than each claiming a
       band of its own: four two-note topics stacked vertically is four
       screens of mostly empty canvas, and the point of the horizontal
       run is that you can see the topics beside each other. */
    var at = 0, x = 0, rowTop = 0, rowLow = 0;
    var labels = host.querySelectorAll('.fb-drift');
    bottom = 0;
    for (i = 0; i < drifts.length; i++) {
      var n = drifts[i].notes.length;
      var runW = Math.min(W, (n - 1) * step + w);
      if (x > 0 && x + runW > W) {          // no room beside the last one
        rowTop = rowLow + DRIFT_GAP_Y;
        x = 0;
      }
      if (labels[i]) {
        labels[i].style.left = x + 'px';
        labels[i].style.top = rowTop + 'px';
      }
      var low = place(at, at + n, x, rowTop + LABEL_H, runW);
      if (low > rowLow) rowLow = low;
      if (low > bottom) bottom = low;
      x += runW + DRIFT_GAP_X;
      at += n;
    }
  }

  host.style.setProperty('--fb-h', (bottom + 8) + 'px');
  PEEK.step = step;
  PEEK.dirty = true;
}

/* A deterministic small integer from a string, for jitter that survives a
   redraw. Same hash rot() uses; kept separate so the two can be tuned
   without one silently changing the other. */
function jit(key, span) {
  var x = 0;
  for (var i = 0; i < key.length; i++) x = (x * 31 + key.charCodeAt(i)) & 0xffff;
  return x % span;
}

/* ═══ 5c. Parting the pile ═════════════════════════════════════════════

   Moving across the canvas pushes the notes either side of the pointer
   out of the way and squares up the one underneath, which is how you
   read a stack of paper you have not sorted. Nothing here changes the
   layout: the pass only writes --fb-push on notes near the pointer and
   clears it when the pointer leaves, so the placement above stays the
   single source of where a note lives.

   Off on a coarse pointer. There is no hover on a finger, and pushing
   cards around as a side effect of scrolling would be a bug. */
var PEEK = {el: null, dirty: true, rects: null, step: 198};
/* The reach is measured in neighbours, not pixels. Two notes sit one
   `step` apart, so a fixed pixel radius that felt right at one note width
   moved the neighbour by two pixels at another. At 2.2 steps the note
   beside the pointer moves about 17px and the one beyond it about 3,
   which is a pile opening rather than the whole row sliding. */
var PUSH_REACH = 2.2;
var PUSH_MAX = 30;    // how far the nearest neighbour moves

function peekAt(host, px, py) {
  var notes = host.querySelectorAll('.fb-note');
  if (!notes.length) return;
  if (PEEK.dirty || !PEEK.rects || PEEK.rects.length !== notes.length) {
    PEEK.rects = [];
    for (var r = 0; r < notes.length; r++) {
      var b = notes[r].getBoundingClientRect();
      PEEK.rects.push({cx: b.left + b.width / 2, cy: b.top + b.height / 2, h: b.height});
    }
    PEEK.dirty = false;
  }

  /* The note under the pointer, topmost first — the DOM order is the
     stacking order, so the last match wins. */
  var hit = -1, i;
  for (i = 0; i < notes.length; i++) {
    var q = notes[i].getBoundingClientRect();
    if (px >= q.left && px <= q.right && py >= q.top && py <= q.bottom) hit = i;
  }

  for (i = 0; i < notes.length; i++) {
    var m = PEEK.rects[i], push = 0;
    if (hit >= 0 && i !== hit) {
      /* Only the band the pointer is in gets parted. Without the vertical
         test the row above shuffles too, which reads as the whole board
         flinching rather than one pile opening. */
      var dy = Math.abs(m.cy - py);
      if (dy < m.h * 0.75) {
        var dx = m.cx - px;
        var d = Math.abs(dx), R = PEEK.step * PUSH_REACH;
        if (d < R) push = (dx < 0 ? -1 : 1) * (1 - d / R) * PUSH_MAX;
      }
    }
    notes[i].style.setProperty('--fb-push', push.toFixed(1) + 'px');
    var on = i === hit;
    notes[i].classList.toggle('is-peeked', on);
    if (on) notes[i].style.zIndex = String(900);
    else notes[i].style.zIndex = String(10 + i);
  }
  PEEK.el = hit >= 0 ? notes[hit] : null;
}

function peekOff(host) {
  var notes = host.querySelectorAll('.fb-note');
  for (var i = 0; i < notes.length; i++) {
    notes[i].style.setProperty('--fb-push', '0px');
    notes[i].classList.remove('is-peeked');
    notes[i].style.zIndex = String(10 + i);
  }
  PEEK.el = null;
}

/* ═══ 6. Writing one, and reading one ══════════════════════════════════

   Both are the same piece of paper. A note is written on a sticky and
   read on a sticky, and the sticky swings out of whatever you pressed to
   get it — the Add button for a new one, the note's own tile for an
   existing one. There is no modal on this page: a white dialog over a
   wall of coloured paper was the one place the board stopped looking
   like what it is. */
var COMPOSE = null;

/* Clicking away closes the note, but only while it is still empty:
   somebody who has typed two sentences and clicked the canvas has not
   asked to throw them away. A note being read closes on any click out.

   Bound one tick after opening and unbound on close, rather than left on
   the document permanently. The click that opens the note is still
   propagating when the panel is built, so a permanent listener catches
   that very click and closes what it just opened. */
function awayFromCompose(e) {
  if (!COMPOSE) return;
  if (e.target.closest('.fb-compose')) return;
  if (COMPOSE.mode !== 'read') {
    var ta = COMPOSE.panel.querySelector('textarea');
    if (ta && ta.value.trim().length >= 3) return;
    if (COMPOSE.shot) return;
  }
  closeCompose();
}

function anchorSwing(panel, anchor) {
  /* The start pose: the panel scaled and translated onto the anchor's own
     rect, so frame zero of the animation is the thing that was pressed.
     Mirrored when the anchor sits right of centre, so the card turns
     toward the reader rather than away. */
  var a = anchor.getBoundingClientRect(), p = panel.getBoundingClientRect();
  panel.style.setProperty('--nsw-dx', (a.left - p.left) + 'px');
  panel.style.setProperty('--nsw-dy', (a.top - p.top) + 'px');
  panel.style.setProperty('--nsw-sx', (a.width / Math.max(1, p.width)).toFixed(3));
  panel.style.setProperty('--nsw-sy', (a.height / Math.max(1, p.height)).toFixed(3));
  panel.style.setProperty('--nsw-dir',
    a.left + a.width / 2 > window.innerWidth / 2 ? '-1' : '1');
}

function placePanel(panel, anchor) {
  /* Measured after the panel is in the DOM: its height depends on how
     much of it the viewport can give it.

     A note opens over its own tile, sharing the tile's top-left corner,
     so the paper grows out of where it already was. The compose panel
     hangs under its button and ranges right with it. Both are clamped
     into the viewport, which is what actually decides the position on a
     small screen. */
  var a = anchor.getBoundingClientRect();
  var w = panel.offsetWidth, h = panel.offsetHeight;
  var overTile = anchor.classList && anchor.classList.contains('fb-note');
  var left = overTile ? a.left : a.right - w;
  var top = overTile ? a.top : a.bottom + 10;
  left = Math.min(Math.max(8, left), Math.max(8, window.innerWidth - w - 8));
  if (top + h > window.innerHeight - 8) top = window.innerHeight - h - 8;
  panel.style.left = Math.round(left) + 'px';
  panel.style.top = Math.round(Math.max(8, top)) + 'px';
}

function closeCompose(instant) {
  if (!COMPOSE) return;
  document.removeEventListener('click', awayFromCompose);
  var panel = COMPOSE.panel;
  if (COMPOSE.tile) COMPOSE.tile.classList.remove('is-open-elsewhere');
  COMPOSE = null;
  STATE.open = null;
  var done = function () { if (panel.parentNode) panel.parentNode.removeChild(panel); };
  if (instant || REDUCED) { done(); return; }
  panel.classList.remove('is-opening');
  panel.classList.add('is-closing');
  panel.addEventListener('animationend', done, {once: true});
  setTimeout(done, 600);                    // in case the animation never fires
}

/* The month, for the note's kicker. The dashboard writes "Note · August"
   and this says the same thing about the same kind of object. */
var MONTHS_LONG = ['January','February','March','April','May','June','July',
                   'August','September','October','November','December'];
function monthWord(ts) {
  var d = ts ? new Date(ts) : new Date();
  return MONTHS_LONG[d.getMonth()] || '';
}

/* One panel, two modes. Write and read are the same piece of paper with
   different things on it, which is the whole reason a note opens as a
   note: the thing you clicked and the thing that opened are visibly the
   same object, and a white modal would break that. */
function panelHTML(mode, f) {
  var who = me(), top, body, act;

  if (mode === 'read') {
    var voters = f.v || [], backed = iBacked(f), mine = f.a === who;
    var names = voters.slice(0, 4).map(esc).join(', ') +
      (voters.length > 4 ? ' and ' + (voters.length - 4) + ' more' : '');
    top = '<span class="np-eyebrow">Note by</span>' +
      '<i class="ava" aria-hidden="true">' + esc(initials(f.a)) + '</i>' +
      '<b>' + esc(f.a) + '</b>' +
      '';
    body = '<span class="np-kick">Note &middot; ' + esc(monthWord(f.ts)) + '</span>' +
      '<p class="np-text">' + esc(f.t) + '</p>' +
      (f.img ? '<img class="np-shot" src="' + esc(f.img) + '" data-full="' + esc(f.i) +
               '" alt="Screenshot attached to this note" />' : '') +
      '<div class="np-by">' + esc(when(f.ts)) + ' &middot; ' +
        (voters.length ? 'backed by <b>' + names + '</b>' : 'nobody has backed it yet') +
      '</div>' +
      '<div class="np-status">' +
        ['new', 'planned', 'shipped'].map(function (st) {
          return '<button class="np-st' + ((f.st || 'new') === st ? ' is-on' : '') +
            '" type="button" data-status="' + st + '">' +
            (st === 'new' ? 'Open' : st === 'planned' ? 'Planned' : 'Shipped') + '</button>';
        }).join('') +
      '</div>' +
      (f.stb ? '<div class="np-by">' + esc(f.stb) + ' moved this on ' + esc(when(f.sts)) + '</div>' : '');
    act = (mine ? '<button class="np-del" type="button" data-del="' + esc(f.i) + '" ' +
                  'aria-label="Withdraw this request" title="Withdraw this request">' +
                  '<i class="ph ph-trash"></i></button>' : '') +
      '<button class="np-chip cancel" type="button" data-vote="' + esc(f.i) + '">' +
        (backed ? 'Remove my vote' : 'Vote this') + '</button>' +
      '<button class="np-chip go" type="button" data-cancel>Done</button>';
    return '<div class="np-top">' + top + '</div>' +
           '<div class="np-body">' + body + '</div>' +
           '<div class="np-act">' + act + '</div>';
  }

  top = '<span class="np-eyebrow">Signing in as</span>' +
    '<i class="ava" aria-hidden="true">' + esc(initials(who)) + '</i>' +
    '<b>' + esc(who) + '</b>' +
    '';
  body = '<span class="np-kick">Note &middot; ' + esc(monthWord()) + '</span>' +
    '<textarea id="fbText" maxlength="' + MAX_LEN + '" ' +
      'aria-label="What got in your way" ' +
      'placeholder="What got in your way, and what would you rather happen?"></textarea>' +
    /* The DS FileUploader. The zone stays visible once a file is
       attached, per the component's own Do. */
    '<div class="c-uploader">' +
      '<button class="c-uploader-zone" type="button" data-pick>' +
        '<i class="ph ph-upload-simple"></i>' +
        '<span class="c-uploader-label">Attach a screenshot</span>' +
      '</button>' +
      '<input type="file" accept="image/*" hidden data-file />' +
      '<div class="c-uploader-files" data-files></div>' +
    '</div>' +
    '<div id="fbDupes"></div>';
  act = '<span class="np-count" id="fbCount">0 / ' + MAX_LEN + '</span>' +
    '<button class="np-chip cancel" type="button" data-cancel>Cancel</button>' +
    '<button class="np-chip go" type="button" id="fbPost" disabled>Post</button>';
  return '<div class="np-top">' + top + '</div>' +
         '<div class="np-body">' + body + '</div>' +
         '<div class="np-act">' + act + '</div>';
}

/* Opens a panel, swinging it out of whatever was clicked. `anchor` is the
   button for a new note and the note's own tile for an existing one, so
   the paper always comes out of the thing you pressed. */
function openPanel(mode, f, anchor) {
  if (COMPOSE) closeCompose(true);
  STATE.open = mode === 'read' ? f.i : 'compose';

  var el = mode === 'read' ? elOf(f) : 'el-' + (nextQ() % ELN);
  var panel = document.createElement('div');
  panel.className = 'fb-compose ' + el + (mode === 'read' ? ' is-read' : '');
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'false');
  panel.setAttribute('aria-label', mode === 'read' ? 'Feedback from ' + f.a : 'Add feedback');
  panel.innerHTML = panelHTML(mode, f);

  document.body.appendChild(panel);
  placePanel(panel, anchor);
  anchorSwing(panel, anchor);
  if (!REDUCED) panel.classList.add('is-opening');

  COMPOSE = {panel: panel, anchor: anchor, mode: mode, note: f || null,
             shot: null, thumb: null, name: '', size: 0};
  setTimeout(function () { document.addEventListener('click', awayFromCompose); }, 0);
  return panel;
}

function compose() {
  if (COMPOSE && COMPOSE.mode !== 'read') { closeCompose(true); return; }
  var anchor = document.getElementById('fbAdd');
  var panel = openPanel('write', null, anchor);

  var ta = panel.querySelector('#fbText'),
      count = panel.querySelector('#fbCount'),
      postBtn = panel.querySelector('#fbPost'),
      dupes = panel.querySelector('#fbDupes'),
      timer;

  ta.addEventListener('input', function () {
    var v = ta.value.trim();
    count.textContent = ta.value.length + ' / ' + MAX_LEN;
    count.classList.toggle('is-near', ta.value.length > MAX_LEN - 40);
    postBtn.disabled = v.length < 3;
    clearTimeout(timer);
    timer = setTimeout(function () {
      showDupes(dupes, v);
      placePanel(panel, anchor);            // the nudge changes the height
    }, 250);
  });

  wireAttach(panel);

  panel.addEventListener('click', function (e) {
    if (e.target.closest('[data-cancel]')) { closeCompose(); anchor.focus(); return; }
    var back = e.target.closest('[data-back]');
    if (back) {
      toggleVote(back.dataset.back);
      closeCompose();
      toast('success', 'Backed', 'Added your vote instead of a second copy.');
      return;
    }
    if (e.target.closest('#fbPost')) {
      var v = ta.value.trim();
      if (v.length < 3) return;
      postBtn.disabled = true;
      shrinkOntoCanvas(v);
    }
  });

  ta.focus();
}

/* Opening one. The tile it came from is hidden while the panel is out,
   so there is one of each note on screen rather than the note and a copy
   of it sitting on top. */
function detail(id, tile) {
  var f = find(id); if (!f) return;
  var anchor = tile || document.querySelector('.fb-note[data-open="' + id + '"]');
  if (!anchor) return;
  var panel = openPanel('read', f, anchor);
  anchor.classList.add('is-open-elsewhere');
  COMPOSE.tile = anchor;

  var shot = panel.querySelector('[data-full]');
  if (shot && STATE.remote) {
    api('GET', null, '?img=' + encodeURIComponent(f.i)).then(function (x) {
      /* Guarded on the image still being on screen: the fetch can land
         after somebody has closed this note and opened another. */
      if (x && x.body && x.body.img && shot.isConnected) shot.src = x.body.img;
    }, function () {});
  }

  panel.addEventListener('click', function (e) {
    if (e.target.closest('[data-cancel]')) { closeCompose(); return; }
    var v = e.target.closest('[data-vote]');
    if (v) { toggleVote(v.dataset.vote); refreshPanel(); return; }
    var st = e.target.closest('[data-status]');
    if (st) { setStatus(f.i, st.dataset.status); refreshPanel(); return; }
    var del = e.target.closest('[data-del]');
    if (del) {
      if (window.confirm('Withdraw this? People who backed it get their votes back.')) {
        closeCompose(true);
        remove(f.i);
      }
    }
  });
}

/* Redraw an open read panel in place after a vote or a status change,
   rather than closing and reopening it: reopening would swing the paper
   out of a tile that has just moved under the new layout. */
function refreshPanel() {
  if (!COMPOSE || COMPOSE.mode !== 'read') return;
  var f = find(COMPOSE.note.i);
  if (!f) { closeCompose(true); return; }
  COMPOSE.note = f;
  COMPOSE.panel.innerHTML = panelHTML('read', f);
  var tile = document.querySelector('.fb-note[data-open="' + f.i + '"]');
  if (tile) { tile.classList.add('is-open-elsewhere'); COMPOSE.tile = tile; }
  placePanel(COMPOSE.panel, COMPOSE.tile || COMPOSE.anchor);
}

/* ── The attachment. Downscaled in the browser before it goes anywhere:
     a phone screenshot is 3-4MB and the sentence it illustrates is 120
     bytes, and the board is re-read on a timer. Two sizes come out of one
     decode — the thumbnail the canvas draws, and the full-size grab the
     detail view fetches on demand. */
var SHOT_MAX = 1200, THUMB_MAX = 360;

function drawTo(img, max, quality) {
  var scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}

function wireAttach(panel) {
  var zone = panel.querySelector('[data-pick]'),
      input = panel.querySelector('[data-file]'),
      files = panel.querySelector('[data-files]');

  function show() {
    if (!COMPOSE || !COMPOSE.thumb) { files.innerHTML = ''; return; }
    var kb = Math.round(COMPOSE.size / 1024);
    files.innerHTML = '<div class="c-uploader-row">' +
      '<img class="c-uploader-thumb" src="' + esc(COMPOSE.thumb) + '" alt="" />' +
      '<span class="c-uploader-kind">IMG</span>' +
      '<span class="c-uploader-name">' + esc(COMPOSE.name) + '</span>' +
      '<span class="c-uploader-size">' + (kb > 999 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB') + '</span>' +
      '<button class="c-uploader-remove" type="button" data-drop aria-label="Remove ' +
        esc(COMPOSE.name) + '"><i class="ph ph-x"></i></button>' +
    '</div>';
    placePanel(panel, COMPOSE.anchor);
  }

  function take(file) {
    if (!file || !/^image\//.test(file.type)) {
      toast('warn', 'Not an image', 'Attach a screenshot or a photo.');
      return;
    }
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        if (!COMPOSE) return;
        COMPOSE.shot = drawTo(img, SHOT_MAX, 0.72);
        COMPOSE.thumb = drawTo(img, THUMB_MAX, 0.6);
        COMPOSE.name = file.name || 'screenshot.png';
        /* The size shown is what will actually be stored, not what was
           picked: saying 3.8 MB next to a 180 KB upload is a lie about
           what the board is carrying. */
        COMPOSE.size = Math.round(COMPOSE.shot.length * 0.75);
        show();
      };
      img.onerror = function () { toast('warn', 'Could not read that', 'The file did not decode as an image.'); };
      img.src = fr.result;
    };
    fr.onerror = function () { toast('warn', 'Could not read that', 'The file did not open.'); };
    fr.readAsDataURL(file);
  }

  zone.addEventListener('click', function () { input.click(); });
  input.addEventListener('change', function () { take(input.files && input.files[0]); input.value = ''; });

  ['dragenter', 'dragover'].forEach(function (t) {
    zone.addEventListener(t, function (e) { e.preventDefault(); zone.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    zone.addEventListener(t, function (e) { e.preventDefault(); zone.classList.remove('dragover'); });
  });
  zone.addEventListener('drop', function (e) {
    var dt = e.dataTransfer;
    if (dt && dt.files && dt.files[0]) take(dt.files[0]);
  });
  /* Paste is how a screenshot actually arrives: most people grab a region
     and hit cmd-V rather than saving a file first. */
  panel.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        e.preventDefault();
        take(items[i].getAsFile());
        return;
      }
    }
  });
  files.addEventListener('click', function (e) {
    if (!e.target.closest('[data-drop]')) return;
    if (COMPOSE) { COMPOSE.shot = COMPOSE.thumb = null; COMPOSE.name = ''; COMPOSE.size = 0; }
    show();
  });
}

/* ── Post: the note shrinks onto the canvas rather than the box closing
     and a note appearing somewhere. The order matters — the note has to
     exist and be placed before there is a rect to fly to, so the post
     lands first, the new note is hidden, the panel is animated onto its
     rect, and only then is the note revealed. */
function shrinkOntoCanvas(text) {
  var panel = COMPOSE.panel, shot = COMPOSE.thumb, full = COMPOSE.shot;
  var from = panel.getBoundingClientRect();

  post(text, function (id) {
    var note = document.querySelector('.fb-note[data-open="' + id + '"]');
    if (!note || REDUCED) {
      closeCompose(true);
      said();
      return;
    }
    note.classList.add('is-landing');
    /* The open swing may still be running if somebody typed fast. Two
       animations on one transform is a fight the fold does not need to
       have, so the swing is stood down first — and its class removed, or
       its `both` fill would put the panel back where it started the
       moment the fold's own fill hands the property back. */
    panel.classList.remove('is-opening', 'is-closing');
    panel.getAnimations().forEach(function (a) { a.cancel(); });
    var to = note.getBoundingClientRect();

    /* The panel is detached from COMPOSE first: it is no longer the
       compose box, it is a note in flight, and a stray Escape should not
       try to swing it closed halfway there. */
    document.removeEventListener('click', awayFromCompose);
    COMPOSE = null;
    STATE.open = null;

    var sx = to.width / Math.max(1, from.width);
    var sy = to.height / Math.max(1, from.height);
    var dx = to.left - from.left, dy = to.top - from.top;
    var rot = note.style.getPropertyValue('--fb-rot') || '0deg';

    /* A fold, then the flight. The middle keyframe is the point: the
       panel closes on itself about its own top edge — squashed in Y,
       barely moved in X, tipped away on rotateX — before it travels, so
       what you see is a sheet being folded down and put on the wall
       rather than a rectangle being tweened into a smaller rectangle.

       perspective on the transform rather than the parent, because the
       panel is a direct child of <body> and there is nothing above it to
       carry a perspective for it. */
    var anim = panel.animate([
      {transform: 'perspective(900px) translate(0,0) scale(1,1) rotateX(0deg)',
       borderRadius: '20px', offset: 0},
      {transform: 'perspective(900px) translate(' + (dx * 0.18).toFixed(1) + 'px,' +
                  (dy * 0.14).toFixed(1) + 'px) scale(' +
                  (0.5 + sx * 0.5).toFixed(3) + ',' + (sy * 0.62).toFixed(3) + ') ' +
                  'rotateX(46deg)',
       borderRadius: '16px', offset: 0.42},
      {transform: 'perspective(900px) translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) ' +
                  'scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ') rotateX(0deg) rotate(' + rot + ')',
       borderRadius: '12px', offset: 1}
    ], {duration: 560, easing: 'cubic-bezier(.32,.72,.3,1)', fill: 'forwards'});

    var land = function () {
      note.classList.remove('is-landing');
      if (panel.parentNode) panel.parentNode.removeChild(panel);
      said();
    };
    anim.onfinish = land;
    setTimeout(function () { if (panel.parentNode) land(); }, 900);
  }, shot, full);
}

function said() {
  toast('success', 'Posted', STATE.remote
    ? 'The group can see it now. Back it yourself if you want it counted.'
    : 'Saved on this device. Nobody else can see it yet.');
}

/* Deliberately wider than the board's own grouping. A weak match shown
   to a person costs them a glance; a duplicate that slips through costs
   the board a topic split in two for the rest of the pilot. */
var NUDGE = 0.55;

function showDupes(host, text) {
  if (text.length < 8) { host.innerHTML = ''; return; }
  var pool = STATE.notes;
  if (!pool.length) { host.innerHTML = ''; return; }

  /* The candidate is scored against the board including itself, so its own
     words carry a normal rarity rather than looking unique by construction. */
  var C = corpus(pool.concat([{t: text}]));
  var mine = C.docs[C.docs.length - 1];
  if (!mine) { host.innerHTML = ''; return; }

  var hits = [];
  for (var i = 0; i < pool.length; i++) {
    var s = sim(mine, C.docs[i], C.spec);
    if (s >= NUDGE) hits.push({f: pool[i], s: s});
  }
  hits.sort(function (a, b) { return b.s - a.s; });
  hits = hits.slice(0, 3);
  if (!hits.length) { host.innerHTML = ''; return; }

  host.innerHTML = '<div class="fb-dupes"><h4>' +
    (hits.length === 1 ? 'Someone may have said this already'
                       : 'A few people may have said this already') + '</h4>' +
    hits.map(function (h) {
      var n = (h.f.v || []).length;
      return '<div class="fb-dupe"><span class="txt">' + esc(h.f.t) + '</span>' +
        '<button class="back" type="button" ' +
        'data-back="' + esc(h.f.i) + '">Vote this' + (n ? ' (' + n + ')' : '') + '</button></div>';
    }).join('') + '</div>';
}

/* ═══ 7. Toasts ════════════════════════════════════════════════════════ */

function toast(tone, title, message) {
  var host = document.getElementById('fbToasts');
  var el = document.createElement('div');
  el.className = 'c-toast is-entering';
  el.setAttribute('role', 'status');
  el.innerHTML = '<i class="ph-fill ' +
      (tone === 'success' ? 'ph-check-circle' : tone === 'warning' ? 'ph-warning-circle' : 'ph-info') +
      ' tone tone-' + (tone === 'success' ? 'success' : tone === 'warning' ? 'warning' : 'neutral') + '"></i>' +
    '<div class="body"><div class="title">' + esc(title) + '</div>' +
    '<div class="message">' + esc(message) + '</div></div>' +
    '<button class="c-icon-btn" type="button" data-toast-close aria-label="Dismiss">' +
    '<i class="ph ph-x"></i></button>';
  host.appendChild(el);
  requestAnimationFrame(function () { el.classList.remove('is-entering'); });
  var kill = setTimeout(function () { drop(el); }, 6000);
  el.addEventListener('click', function (e) {
    if (e.target.closest('[data-toast-close]')) { clearTimeout(kill); drop(el); }
  });
}
function drop(el) {
  el.classList.add('is-exiting');
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, REDUCED ? 0 : 240);
}

/* ═══ 8. Wiring ════════════════════════════════════════════════════════ */

document.getElementById('fbAdd').addEventListener('click', compose);

document.getElementById('fbFilters').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.st) {
    STATE.st = b.dataset.st;
    var all = this.querySelectorAll('[data-st]');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('is-active', all[i] === b);
  } else if (b.dataset.own) {
    STATE.own = STATE.own === b.dataset.own ? null : b.dataset.own;
    var owns = this.querySelectorAll('[data-own]');
    for (var j = 0; j < owns.length; j++) {
      owns[j].classList.toggle('is-active', owns[j].dataset.own === STATE.own);
    }
  } else if (b.id === 'fbCluster') {
    STATE.clustered = !STATE.clustered;
    b.classList.toggle('is-active', STATE.clustered);
    b.setAttribute('aria-pressed', STATE.clustered ? 'true' : 'false');
  } else return;
  render();
});

/* The note is fixed to the viewport and placed against a button that
   scrolls, so it has to follow rather than sit where the button used to
   be. Same treatment the account menu takes. */
window.addEventListener('resize', function () {
  if (COMPOSE) placePanel(COMPOSE.panel, COMPOSE.anchor);
});

/* Parting the pile. Delegated on the canvas rather than per note, since
   every note is rewritten on render. pointermove is throttled to a frame:
   the pass reads a rect per note and writing a variable per note on every
   raw move event is the one thing here that could drop frames. */
(function () {
  var host = document.getElementById('fbBoard');
  var COARSE = window.matchMedia('(pointer:coarse)');
  var queued = false, lx = 0, ly = 0;

  host.addEventListener('pointermove', function (e) {
    if (COARSE.matches || REDUCED) return;
    lx = e.clientX; ly = e.clientY;
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; peekAt(host, lx, ly); });
  });
  host.addEventListener('pointerleave', function () {
    if (COARSE.matches || REDUCED) return;
    peekOff(host);
  });
  /* Scrolling moves the notes under a stationary pointer, so the cached
     rects stop describing where anything is. */
  window.addEventListener('scroll', function () { PEEK.dirty = true; }, true);
})();

/* The canvas is measured, so anything that changes its width has to re-run
   the pass. Watching the canvas itself rather than the window is what
   makes that "anything": the rail minimising hands the board 168px and
   never fires a window resize, because the viewport did not change — only
   the flex box inside it did. The notes used to keep their old places and
   leave the new space empty.

   Two things this has to get right. It must ignore a height-only change,
   because layout() writes --fb-h and observing our own write is a loop.
   And it must wait out the rail's 360ms width transition rather than
   re-laying out on every frame of it, which is what the debounce is for:
   the board settles once, at the end, and playMove() walks the notes
   across to their new spots instead of teleporting them.

   A redraw rather than layout() alone, because a narrower canvas can
   rewrap a note's text to a new height and only a redraw remeasures. */
(function () {
  var host = document.getElementById('fbBoard');
  var t = null, lastW = Math.round(host.clientWidth);
  var again = function () {
    clearTimeout(t);
    t = setTimeout(function () { PEEK.dirty = true; render(); }, 90);
  };
  if (window.ResizeObserver) {
    new ResizeObserver(function (entries) {
      var w = Math.round(entries[0].contentRect.width);
      if (w === lastW) return;                 // our own --fb-h write; not a move
      lastW = w;
      again();
    }).observe(host);
  } else {
    window.addEventListener('resize', again);  // the observer covers this too
  }
})();

document.getElementById('fbSort').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  STATE.sort = b.dataset.sort;
  var all = this.querySelectorAll('button');
  for (var i = 0; i < all.length; i++) {
    all[i].setAttribute('aria-pressed', all[i] === b ? 'true' : 'false');
  }
  render();
});

/* One delegate for the board and one for the modal: every control inside
   both is rewritten on render, so binding per element would leak. */
document.getElementById('fbBoard').addEventListener('click', function (e) {
  var v = e.target.closest('[data-vote]');
  if (v) { e.stopPropagation(); toggleVote(v.dataset.vote); return; }
  var o = e.target.closest('[data-open]');
  if (o) { detail(o.dataset.open, o); return; }
  if (e.target.closest('#fbFirst')) { compose(); return; }
  if (e.target.closest('#fbSeed')) { seed(); return; }
  if (e.target.closest('#fbClearFilters')) {
    STATE.st = 'all'; STATE.own = null;
    var chips = document.querySelectorAll('#fbFilters .c-chip-filter');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('is-active', chips[i].dataset.st === 'all');
    }
    render();
  }
});
document.getElementById('fbBoard').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var o = e.target.closest('[data-open]');
  if (o) { e.preventDefault(); detail(o.dataset.open, o); }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && COMPOSE) {
    var a = COMPOSE.anchor;
    closeCompose();
    if (a && a.isConnected) a.focus();
    return;
  }
  if (e.key !== 'n' && e.key !== 'N') return;
  var t = e.target, tag = (t.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || t.isContentEditable) return;
  /* An open popover owns the keyboard. Without this, n put a note up
     behind the account menu, which stayed open on top of it. */
  var am = document.getElementById('accountMenu');
  if (am && am.classList.contains('is-open')) return;
  var dd = document.getElementById('deptDropdown');
  if (dd && !dd.hidden) return;
  if (COMPOSE) return;
  e.preventDefault(); compose();
});

/* On a phone the rail starts as the corner box; on a laptop it starts open.
   Read once at load rather than on resize: a rail that collapses itself
   while someone is dragging a window is fighting them. */
var NARROW = window.matchMedia('(max-width:640px)');   // the dashboard's own, see the matching @media
function setCollapsed(on) {
  document.getElementById('shellSidebarNav').classList.toggle('is-collapsed', on);
  var t = document.getElementById('sidebarToggle');
  t.setAttribute('aria-label', on ? 'Expand sidebar' : 'Collapse sidebar');
  /* The same two paths the dashboard swaps between. This page drew its own
     collapsed arrow, which pointed the right way but sat a half-pixel off
     the dashboard's, so the button twitched when you moved between them. */
  document.getElementById('sidebarArrow').setAttribute('d',
    on ? 'M11.5 7 14 10l-2.5 3' : 'M13.5 7 11 10l2.5 3');
}
if (NARROW.matches) setCollapsed(true);
/* The rail minimises itself once the page has settled, which is what the
   dashboard does after its intro plays. There is no intro here to wait
   for, so the delay is measured from load: long enough to read the two
   labels and know where you are, short enough that the canvas is not
   kept waiting behind a rail nobody is using.

   It used to stand down on pointerenter, which was wrong in the one case
   that matters most. You arrive here by clicking Feedback in the rail, so
   the pointer is already on the rail when the page loads, and the first
   small movement fires enter and cancels the collapse — the nav then sits
   open exactly for the person who came in through it. The dashboard
   cancels on nothing at all; this cancels on a click, which is the only
   signal that actually means "I am using this", and leaves a deliberate
   expand alone rather than undoing it a second and a half later. */
var AUTO_MIN_MS = 1600;
(function () {
  if (NARROW.matches || REDUCED) return;
  var timer = setTimeout(function () {
    var nav = document.getElementById('shellSidebarNav');
    if (nav && !nav.classList.contains('is-collapsed')) setCollapsed(true);
  }, AUTO_MIN_MS);
  document.getElementById('shellSidebarShell')
    .addEventListener('click', function () { clearTimeout(timer); }, {once: true});
})();
/* Expanded, the box overlays the board, so it needs a way out that is not
   one small button. Only where it actually overlays. Both popovers are
   siblings of the rail rather than children, so they have to be named here
   or using one would close the rail underneath it. */
document.addEventListener('click', function (e) {
  if (!NARROW.matches || e.target.closest('#shellSidebarShell') ||
      e.target.closest('#accountMenu') || e.target.closest('#deptDropdown')) return;
  setCollapsed(true);
});

document.getElementById('sidebarToggle').addEventListener('click', function () {
  setCollapsed(!document.getElementById('shellSidebarNav').classList.contains('is-collapsed'));
});

/* ── The account row's menu: Settings and Log out. Opens above the row,
     which is pinned to the bottom and has nothing under it. The panel is
     position:fixed and lives outside the rail, so it is placed against the
     trigger's own rect rather than by CSS. Ported from the dashboard;
     Settings is inert on both, Log out is the only way off either page. */
(function () {
  var trigger = document.getElementById('accountMenuTrigger');
  var menu = document.getElementById('accountMenu');
  if (!trigger || !menu) return;

  function place() {
    var r = trigger.getBoundingClientRect();
    var w = menu.offsetWidth || 200;
    menu.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2,
                                           window.innerWidth - w - 8)) + 'px';
    menu.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  }
  function close() {
    menu.classList.remove('is-open');
    menu.setAttribute('aria-hidden', 'true');
    trigger.setAttribute('aria-expanded', 'false');
  }
  function open() {
    place();
    menu.classList.add('is-open');
    menu.setAttribute('aria-hidden', 'false');
    trigger.setAttribute('aria-expanded', 'true');
  }

  trigger.addEventListener('click', function (e) {
    e.stopPropagation();
    if (menu.classList.contains('is-open')) close(); else open();
  });
  menu.addEventListener('click', function (e) {
    if (e.target.closest('.c-account-menu-item')) close();
  });
  document.addEventListener('click', function (e) {
    if (!menu.classList.contains('is-open')) return;
    if (e.target.closest('#accountMenu') || e.target.closest('#accountMenuTrigger')) return;
    close();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  window.addEventListener('resize', function () {
    if (menu.classList.contains('is-open')) place();
  });
})();

/* ── The department switcher. The system supplies the markup contract
     (data-dept / data-logo / data-element-icon on each .c-dept-option) and
     every visual rule; this wires them up and does the one thing the system
     cannot, which is position a fixed panel next to a trigger inside a
     clipping rail. Ported from the dashboard, which means it carries the
     dashboard's own limit: the choice lives in memory, so walking to the
     dashboard and back returns to the default. */
(function () {
  var trigger = document.querySelector('.js-dept-trigger');
  var panel = document.getElementById('deptDropdown');
  if (!trigger || !panel) return;

  var liveMark = trigger.querySelector('.js-dept-logo-live');
  var staticMark = trigger.querySelector('.js-dept-logo-static');
  var collapsedMark = document.querySelector('.js-dept-logo-collapsed');
  var chevron = trigger.querySelector('.js-dept-chevron');

  function place() {
    var r = trigger.getBoundingClientRect();
    var w = panel.offsetWidth || 240;
    panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
    panel.style.top = (r.bottom + 8) + 'px';
  }
  function close() {
    panel.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    if (chevron) chevron.classList.replace('ph-caret-up', 'ph-caret-down');
  }
  function open() {
    panel.hidden = false;          // unhidden BEFORE measuring: offsetWidth is 0 while hidden
    place();
    trigger.setAttribute('aria-expanded', 'true');
    if (chevron) chevron.classList.replace('ph-caret-down', 'ph-caret-up');
  }

  trigger.addEventListener('click', function (e) {
    e.stopPropagation();
    if (panel.hidden) open(); else close();
  });

  panel.addEventListener('click', function (e) {
    var opt = e.target.closest('.c-dept-option');
    if (!opt) return;
    var all = panel.querySelectorAll('.c-dept-option');
    for (var i = 0; i < all.length; i++) {
      var on = all[i] === opt;
      all[i].classList.toggle('is-active', on);
      all[i].setAttribute('aria-selected', String(on));
    }
    /* The default department has no data-logo, which is what selects the
       animated mark over a static lockup. Absence is the signal, so there is
       no separate "is this the default" flag to keep in step. */
    var logo = opt.dataset.logo;
    if (logo) {
      staticMark.src = logo;
      staticMark.alt = opt.dataset.name || '';
      staticMark.style.display = '';
      liveMark.style.display = 'none';
    } else {
      staticMark.style.display = 'none';
      staticMark.removeAttribute('src');
      liveMark.style.display = '';
    }
    if (collapsedMark && opt.dataset.elementIcon) collapsedMark.src = opt.dataset.elementIcon;
    trigger.setAttribute('aria-label', 'Switch department, ' + (opt.dataset.name || ''));
    close();
  });

  document.addEventListener('click', function (e) {
    if (panel.hidden) return;
    if (e.target.closest('#deptDropdown') || e.target.closest('.js-dept-trigger')) return;
    close();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  window.addEventListener('resize', function () { if (!panel.hidden) place(); });
})();

/* ── The collapsed rail's hover label. The .c-sidebar-hover-text spans were
     already in the markup with nothing reading them, so a collapsed rail
     was two unlabelled icons. mouseover/mouseout rather than enter/leave
     because they bubble, which keeps this delegated; focusin/focusout give
     the keyboard the same label. Ported from the dashboard, including its
     one departure from the DS original: the label is anchored to the rail's
     right edge, not the icon's, since the rail is wider than the icons and
     anchoring to the icon put the first letter behind it. */
(function () {
  var label = document.getElementById('shellSidebarHoverLabel');
  if (!label) return;

  function show(item) {
    var nav = item.closest('.c-sidebar');
    var source = item.querySelector('.c-sidebar-hover-text');
    if (!nav || !nav.classList.contains('is-collapsed') || !source) return;
    var icon = item.querySelector('i');
    if (!icon) return;
    var ir = icon.getBoundingClientRect();
    label.textContent = source.textContent;
    label.style.left = (nav.getBoundingClientRect().right + 8) + 'px';
    label.style.top = (ir.top + ir.height / 2) + 'px';
    label.style.transform = 'translateY(-50%)';
    label.classList.add('is-visible');
  }
  function hide() { label.classList.remove('is-visible'); }

  document.addEventListener('mouseover', function (e) {
    var item = e.target.closest('.c-sidebar-item');
    if (item && !item.contains(e.relatedTarget)) show(item);
  });
  document.addEventListener('mouseout', function (e) {
    var item = e.target.closest('.c-sidebar-item');
    if (item && !item.contains(e.relatedTarget)) hide();
  });
  document.addEventListener('focusin', function (e) {
    var item = e.target.closest('.c-sidebar-item');
    if (item) show(item);
  });
  document.addEventListener('focusout', function (e) {
    var item = e.target.closest('.c-sidebar-item');
    if (item) hide();
  });
  /* Collapsing while the pointer sits on an item would otherwise leave the
     label showing next to a rail that just changed width. */
  document.addEventListener('click', function (e) {
    if (e.target.closest('.c-sidebar-toggle') || e.target.closest('.c-sidebar-item')) hide();
  });
})();

/* ── Six real-shaped examples, so the clustering can be judged before the
     group has posted anything. They go to the shared board under your own
     name and you can withdraw any of them, which is why this is a button
     and not a silent seed. */
function seed() {
  var samples = [
    'The leaderboard takes a few seconds to redraw every time I change a filter, and I change filters a lot.',
    'Leaderboard is slow to load on my phone over 5G. It is fine on the laptop.',
    'I cannot tell whether the forecast number includes the deals I marked as at risk last week.',
    'Forecast and the pipeline total disagree by about 200K and I do not know which one to quote.',
    'Add a way to export the deals table to Excel. Finance asks for it every Monday.',
    'When I share my screen the filters reset for the person opening the link, so we are never looking at the same board.'
  ];
  var i = 0;
  (function next() {
    if (i >= samples.length) {
      toast('neutral', 'Six examples posted',
        'They are on the board under your name. Withdraw any of them from its detail view.');
      return;
    }
    post(samples[i++], next);
  })();
}

/* ── Keeping up. A shared board with stale counts is worse than one that
     is obviously stale: it looks settled while the argument moved on.
     Paused while a note is open, so the board never reshuffles under
     someone's hand, and while the tab is hidden, so a backgrounded tab
     is not polling all afternoon. */
setInterval(function () {
  if (document.hidden || !STATE.remote || COMPOSE) return;
  api('GET').then(function (x) { if (adopt(x)) render(); }, function () {});
}, POLL_MS);

boot();

})();
</script>
