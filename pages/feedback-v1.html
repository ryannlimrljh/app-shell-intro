<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Collabrium · Feedback board</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" id="siteFavicon" type="image/svg+xml" href="../collabrium-dls/SVG/coin.svg" />
<script src="assets/favicon.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Same weight list as the dashboard: 800 is the heading token, 700 the
     label token. A weight missing here gets faux-bolded from the nearest
     loaded cut instead of using the real face Mulish ships. -->
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="../collabrium-dls/tokens.css?v=f278e40" />
<link rel="stylesheet" href="../collabrium-dls/components.css?v=f278e40" />
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{font-family:var(--font-primary); color:var(--color-neutral-9);
    background:var(--color-canvas-warm); -webkit-font-smoothing:antialiased;}

  /* The DS ships .c-shell at a fixed 480px, which is the height its own
     component gallery renders it at, not a page height. Every real screen
     has to say so; the dashboard does the same. Without it the sidebar
     stops halfway down the window and the board is clipped. */
  .c-shell{height:100dvh;}
  /* The gutter belongs to .fb-wrap instead, so the dot grid runs to the
     edges of the content area rather than stopping short of them. */
  .c-shell-content{padding:0;}
  /* Pinned to the bottom, the way the dashboard does it: the DS leaves the
     footer sitting directly under the last nav item, which reads as
     unfinished in a sidebar with two items and a lot of height. Its
     existing border-top then reads as a divider above the account row. */
  .c-sidebar-footer{margin-top:auto;}

  /* ── The account row. Not a DS component: .c-sidebar-account is a
     page-level class the dashboard invented, composed out of UserPicker's
     avatar/name/role classes. This page copied the markup and not the
     rules, so the button fell back to UA styling: auto width, a real
     border, no flex, and the avatar and the two lines of text stacked
     into a 100px box that hung outside a 72px rail. Ported from
     landing-v3 verbatim so the two rails are the same row, not two
     readings of it. */
  .c-sidebar-account{display:flex; align-items:center; gap:var(--spacing-12);
    width:100%; padding:var(--spacing-8) var(--spacing-12);
    margin-bottom:var(--spacing-4); border:none; background:transparent;
    border-radius:var(--radius-sm); font-family:inherit; text-align:left;
    cursor:pointer;
    transition:background-color var(--duration-fast) var(--ease-standard);}
  .c-sidebar-account:hover{background:var(--color-neutral-2);}
  /* Collapsed the labels go, but the person does not: the avatar stays and
     re-centres, the same way a nav item keeps its icon. Dropping the whole
     footer left the collapsed rail with no sign of who was signed in, and
     no way to reach Log out. */
  .c-sidebar.is-collapsed .c-sidebar-item span.label{display:none;}
  .c-sidebar.is-collapsed .c-sidebar-account{justify-content:center;
    padding:var(--spacing-8) 0;}
  .c-sidebar.is-collapsed .c-sidebar-account .c-search-input-text{display:none;}

  /* ── The account menu. Settings and Log out, opening above the row,
     since the row is pinned to the bottom and has no space under it.
     position:fixed and outside .c-sidebar in the markup, because
     .c-sidebar sets overflow-x:clip and a clipped ancestor clips an
     absolute child whatever its offsets: the same escape the collapsed
     toggle button already takes. z-index:60 clears .c-sidebar-shell's 50
     on a phone, where the rail is an overlay that would otherwise paint
     over its own popover. */
  .c-account-menu{display:none; position:fixed; width:200px; z-index:60;
    background:var(--color-neutral-1); border:1px solid var(--color-neutral-3);
    border-radius:var(--radius-md); box-shadow:var(--shadow-3);
    padding:var(--spacing-4); overflow:hidden;}
  .c-account-menu.is-open{display:block;}
  /* text-decoration:none is for Log out, which is an <a> because it has a
     destination. Inert on the button that shares the class. */
  .c-account-menu-item{display:flex; align-items:center; gap:var(--spacing-12);
    width:100%; height:36px; padding:0 var(--spacing-8); border:none;
    background:transparent; border-radius:var(--radius-sm);
    font-family:var(--font-primary); font-size:var(--text-body1-size);
    font-weight:500; color:var(--color-neutral-9); text-decoration:none;
    text-align:left; cursor:pointer;
    transition:background-color var(--duration-fast) var(--ease-standard);}
  .c-account-menu-item:hover{background:var(--color-neutral-2);}
  .c-account-menu-item i{flex:none; font-size:16px; color:var(--color-neutral-5);}

  /* The collapsed rail's hover label. Same z-index reasoning as the menu
     above; the DS ships it at 20, which the rail out-ranks here. */
  .c-sidebar-hover-label{z-index:60;}

  /* The department switcher's panel. Only the placement is ours; every
     visual rule comes from the system's own .c-dept-dropdown. fixed rather
     than the system's absolute, and z-index for the same reason as the two
     popovers above: .c-sidebar clips, and the rail outranks the DS default
     of 20. [hidden] is what the system's .c-dept-dropdown[hidden] keys off,
     so the panel is toggled by attribute rather than by a page-local class. */
  .c-dept-dropdown{position:fixed; z-index:60;}

  /* ══ The board surface ═══════════════════════════════════════════════
     A dot grid, which is the one borrowed signal from the whiteboard
     tools everybody already knows: it says "things are placed here"
     without pretending to be an infinite canvas. Placement is owned by
     the clustering, not by dragging, so an infinite canvas would be a
     promise the board does not keep.
     The dot is Neutral-3 at low alpha on the shell's own warm canvas, so
     no new surface colour, and it disappears entirely behind a card. */
  .fb-wrap{--fb-dot:rgba(0,0,0,.055);
    background-image:radial-gradient(var(--fb-dot) 1.2px, transparent 1.2px);
    background-size:22px 22px; background-position:-1px -1px;
    min-height:100%; padding:var(--spacing-32) var(--page-gutter) var(--spacing-60);}

  /* No measure cap. The dashboard's .c-shell-content spans the shell and
     caps only the things that need a reading measure, and this page now
     does the same: a wall of paper has no reason to stop at 1180 and
     leave a margin of empty canvas either side of it, and every extra
     100px is roughly another half a note per row. The standfirst keeps
     its own 76ch, because that one IS prose. */
  .fb-inner{display:flex; flex-direction:column; gap:var(--spacing-24);}

  /* ══ Header ══════════════════════════════════════════════════════════ */
  .fb-head{display:flex; align-items:flex-start; justify-content:space-between;
    gap:var(--spacing-24); flex-wrap:wrap;}
  .fb-head h1{margin:0; font-size:var(--text-h1-size); line-height:var(--text-h1-lh);
    font-weight:var(--text-h1-weight); letter-spacing:var(--text-h1-tracking);}
  /* 76ch, not 56: at the narrower measure this ran to three lines and
     the third carried two words. Two full lines sit better under a
     one-line heading and cost the canvas nothing. */
  .fb-head .sub{margin:6px 0 0; font-size:var(--text-body2-size);
    line-height:var(--text-body2-lh); color:var(--color-neutral-5); max-width:76ch;}
  .fb-head-right{display:flex; align-items:center; gap:var(--spacing-12); flex:none;}

  /* ── The vote budget. Five is the mechanic, so it is stated as five
       objects rather than as a number in a sentence: you can see what you
       have left without reading. Spent dots hollow out; they are real
       state, which is the only reason a dot is allowed to be here. */
  /* It is an indicator, so it is not allowed to look like a control. It
     used to be a hand-drawn copy of .c-btn-secondary.c-btn-md — same 40px
     height, same radius-md, same Neutral-1 fill, same Neutral-3 hairline,
     same shadow-1 — sitting on the same baseline immediately left of a
     real primary button, with nothing behind the click. People were not
     misreading it; they were reading it correctly and it was lying.

     The shadow was the worst of it: on this board only paper is raised,
     because paper is the thing you can pick up. What is left is the dots
     and the word, set on the canvas like a legend. */
  .fb-budget{display:flex; align-items:center; gap:var(--spacing-8);
    height:40px; padding:0 2px; background:none; border:0; box-shadow:none;
    cursor:default;}
  .fb-budget .pips{display:flex; gap:5px;}
  .fb-budget .pip{width:9px; height:9px; border-radius:var(--radius-pill);
    background:var(--color-neutral-9);
    transition:background-color var(--duration-fast) var(--ease-standard),
               box-shadow var(--duration-fast) var(--ease-standard);}
  /* Spent is a white circle with an outline, not a hole: on the warm
     canvas a transparent pip picked up whatever was behind it, and the
     row read as four dots and a smudge rather than four spent and one
     left. */
  .fb-budget .pip.spent{background:var(--color-neutral-1);
    box-shadow:inset 0 0 0 1.5px var(--color-neutral-4);}
  .fb-budget .txt{font-size:var(--text-label3-size); font-weight:700;
    letter-spacing:var(--tracking-eyebrow); text-transform:uppercase;
    color:var(--color-neutral-5); white-space:nowrap;}
  /* Out of votes was carried by the border, which has gone with the rest
     of the box. The word takes it instead, which is where a reader was
     already looking. */
  .fb-budget.is-out .txt{color:var(--color-orange);}

  /* ══ Controls ════════════════════════════════════════════════════════ */
  .fb-controls{display:flex; align-items:center; justify-content:space-between;
    gap:var(--spacing-16); flex-wrap:wrap;}
  .fb-filters{display:flex; align-items:center; gap:var(--spacing-4); flex-wrap:wrap;}
  .fb-sep{width:1px; height:20px; background:var(--color-neutral-3); margin:0 4px;}
  .fb-sort{display:flex; align-items:center; gap:var(--spacing-8);}
  .fb-sort .lab{font-size:var(--text-label3-size); font-weight:700;
    letter-spacing:var(--tracking-eyebrow); text-transform:uppercase;
    color:var(--color-neutral-5);}
  .fb-seg{display:inline-flex; padding:3px; gap:2px; border-radius:var(--radius-pill);
    background:var(--color-neutral-2); border:1px solid var(--color-neutral-3);}
  .fb-seg button{font-family:inherit; font-size:var(--text-label2-size); font-weight:700;
    height:26px; padding:0 var(--spacing-12); border:none; border-radius:var(--radius-pill);
    background:transparent; color:var(--color-neutral-5); cursor:pointer;
    transition:background-color var(--duration-fast) var(--ease-standard),
               color var(--duration-fast) var(--ease-standard);}
  .fb-seg button:hover{color:var(--color-neutral-9);}
  .fb-seg button[aria-pressed="true"]{background:var(--color-neutral-1);
    color:var(--color-neutral-9); box-shadow:var(--shadow-1);}
  .fb-seg button:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:2px;}

  /* The rule under the standfirst. Last child of .fb-head and full width,
     so it spans the header instead of splitting the flex row. */
  .fb-rule{order:3; width:100%; height:0; margin:var(--spacing-8) 0 0;
    border:0; border-top:1px solid var(--color-neutral-3);}

  /* ══ The canvas ══════════════════════════════════════════════════════
     Notes are placed, not flowed. Every note is absolutely positioned by
     the layout pass in section 5, which is what buys the scatter: a
     column flow can stagger but it cannot overlap, and overlap is the
     thing that makes a wall of stickies read as a wall rather than a
     list. The canvas is as tall as the pass says and no taller.

     One structural consequence worth stating: absolute children do not
     size their parent, so the height is written to --fb-h by JS. Nothing
     below the canvas can be laid out until the pass has run, which is
     why the pass is synchronous at the end of render() rather than in a
     rAF, where the page would flash a collapsed board first. */
  .fb-canvas{position:relative; min-height:var(--fb-h, 320px);
    transition:min-height var(--duration-slow) var(--ease-standard);}
  /* The empty state flows normally; only real notes are placed. The class
     drops the measured height so the canvas does not reserve a wall's
     worth of blank space around one sentence. */
  .fb-canvas.is-flow{min-height:0;}

  /* The cluster's name. Type on the canvas, not a card: a box around a
     group would draw the boundary the clustering is not confident enough
     to promise, and the whole point of the drift is that a note can sit
     at the edge of one. */
  .fb-drift{position:absolute; pointer-events:none; margin:0;
    font-size:var(--text-label3-size); font-weight:800;
    letter-spacing:var(--tracking-eyebrow); text-transform:uppercase;
    color:var(--color-neutral-5); white-space:nowrap;
    opacity:0; transition:opacity var(--duration-slow) var(--ease-standard);}
  .fb-canvas.is-clustered .fb-drift{opacity:1;}
  .fb-drift .n{color:var(--color-neutral-4); font-weight:700;}

  /* ══ A sticky ════════════════════════════════════════════════════════
     The dashboard's note, on this canvas. Saturated element fill rather
     than the 8% tint this page used to carry, and the colour is now the
     note's place in the posting sequence, not its cluster: the wall
     should look like five colours of paper somebody grabbed in turn.
     Cluster membership is carried by where a note sits, which is the one
     signal that can survive the clustering changing under a live board.

     --np-hue fills, --np-fg is every line of text on it, --np-ink is the
     element taken dark enough to read on white. The three come as a set
     from .el-0 through .el-4 below; the contrast reasoning is there. */
  /* Square by default. A wall of paper is squares, and it is also what
     makes the scatter legible: every tile is the same height, so a row
     cannot end up with one note twice the depth of its neighbours and a
     ragged band of canvas under the short ones. Long notes clamp and say
     so by being opened. */
  .fb-note{position:absolute; text-align:left; font-family:inherit;
    width:var(--fb-w, 210px); aspect-ratio:1; overflow:hidden;
    display:flex; flex-direction:column; padding:var(--spacing-12);
    border:0; border-radius:var(--radius-md); cursor:pointer;
    background:var(--np-hue); color:var(--np-fg); box-shadow:var(--shadow-2);
    /* --fb-push is the part-the-pile displacement, written per note by
       the pointer pass. It is a separate variable from the placement so
       the layout can move a note without fighting the interaction. */
    transform:translate3d(var(--fb-push, 0px), var(--fb-lift, 0px), 0)
              rotate(var(--fb-rot, 0deg)) scale(var(--fb-scale, 1));
    transition:transform var(--duration-base) var(--ease-standard),
               box-shadow var(--duration-fast) var(--ease-standard),
               left var(--duration-slow) var(--ease-standard),
               top var(--duration-slow) var(--ease-standard),
               opacity var(--duration-base) var(--ease-standard);}
  /* The note under the pointer squares up, lifts and comes to the front.
     z-index is written by the pointer pass, not here: it has to beat the
     stacking the layout gave every note to its right. */
  .fb-note.is-peeked{--fb-rot:0deg; --fb-lift:-10px; --fb-scale:1.06;
    box-shadow:var(--shadow-3);}
  .fb-note:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:3px;}
  /* flex:1 with min-height:0 so the clamp has a box to clamp inside;
     without the min-height a flex child refuses to shrink below its
     content and the footer is pushed out of the square. */
  .fb-note .body{margin:0; flex:1; min-height:0;
    font-size:var(--text-body2-size); line-height:1.45; color:var(--np-fg);
    display:-webkit-box; -webkit-line-clamp:6;
    -webkit-box-orient:vertical; overflow:hidden;}
  /* A screenshot rides above the text at a fixed ratio, so a tall
     portrait grab cannot make one note four times the height of its
     neighbours and blow the scatter apart. */
  /* A screenshot takes the top of the square and the sentence takes what
     is left, rather than the image setting the note's height. */
  .fb-note .shot{display:block; width:100%; height:46%; flex:none;
    object-fit:cover; border-radius:var(--radius-sm);
    margin-bottom:var(--spacing-8); background:rgba(255,255,255,.25);}
  .fb-note .shot ~ .body{-webkit-line-clamp:3;}
  .fb-note-foot{display:flex; align-items:center; gap:var(--spacing-8);
    flex:none; margin-top:var(--spacing-8);}
  .fb-who{display:flex; align-items:center; gap:6px; min-width:0; flex:1;}
  /* The dashboard's coin: white whatever the hue, initials in the
     element's own ink. White is the one ground that clears 4.5:1 for all
     five inks, which a tint of the fill would not. */
  .fb-av{width:22px; height:22px; border-radius:var(--radius-pill); flex:none;
    display:flex; align-items:center; justify-content:center;
    background:#fff; color:var(--np-ink);
    font-size:10px; font-weight:800; letter-spacing:.02em;}
  /* No opacity on it. Water measures 4.54 at full strength, so a byline
     at .9 would composite its way under the floor; the hierarchy here is
     carried by size and weight instead, which costs no contrast. */
  .fb-who .n{font-size:var(--text-caption-size); color:var(--np-fg); font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* Shipped is quieter but still legible: the whole note steps back
     rather than the text striking through, because a shipped request is
     a record of a win, not a crossed-out chore. */
  .fb-note.is-shipped{opacity:.6; box-shadow:var(--shadow-1);}

  /* ── Backing a request. On a saturated ground the neutral pill this used
       to be disappeared, so it is a white chip with the element's ink, and
       inverts to the ink when it is yours. */
  .fb-vote{display:inline-flex; align-items:center; gap:5px; flex:none;
    height:28px; min-width:52px; padding:0 10px; border-radius:var(--radius-pill);
    font-family:inherit; font-size:var(--text-label2-size); font-weight:800;
    background:#fff; color:var(--np-ink); border:0; cursor:pointer;
    transition:background-color var(--duration-fast) var(--ease-standard),
               color var(--duration-fast) var(--ease-standard),
               transform var(--duration-instant) var(--ease-standard);}
  .fb-vote i{font-size:var(--icon-micro); line-height:1;}
  .fb-vote:hover:not(:disabled){background:var(--color-neutral-2);}
  .fb-vote:active:not(:disabled){transform:scale(.94);}
  .fb-vote.is-mine{background:var(--np-ink); color:#fff;}
  .fb-vote.is-mine:hover{filter:brightness(1.12);}
  .fb-vote:disabled{opacity:.5; cursor:not-allowed;}
  .fb-vote:focus-visible{outline:2px solid #fff; outline-offset:2px;}

  .fb-note .c-badge{position:absolute; top:-8px; right:10px;
    background:var(--color-neutral-1); box-shadow:var(--shadow-1);}

  /* ── The element sequence, fills and text both taken from the
       dashboard so a note looks the same in both places.

       White on all five is the reference look, asked for and kept after
       the measurements were put on the table: white reads 3.15 on Fire,
       2.49 on Wood, 6.02 on Earth, 4.54 on Water and 7.13 on Gold. Two
       of those are under the 4.5 floor for text at this size. The white
       chips carry the interactive parts, and those clear it comfortably
       (5.9 to 7.78), so the failure is confined to the note's own prose
       on Fire and Wood. Recorded here rather than left to be
       rediscovered. */
  .el-0{--np-hue:var(--color-orange);      --np-ink:#AF3A10; --np-fg:#fff;}
  .el-1{--np-hue:var(--color-salmon-pink); --np-ink:#B12A47; --np-fg:#fff;}
  .el-2{--np-hue:var(--color-green);       --np-ink:#00734D; --np-fg:#fff;}
  .el-3{--np-hue:var(--color-navy);        --np-ink:#0B4FA8; --np-fg:#fff;}
  .el-4{--np-hue:var(--color-amber);       --np-ink:#8A5A00; --np-fg:#fff;}

  /* ══ Writing one ═════════════════════════════════════════════════════
     The compose surface is a note, not a dialog about a note: same paper,
     same hue as the one it is about to become, and it arrives by swinging
     out of the button that asked for it. The swing is the dashboard's own
     np-swing, which reads as a card being pulled off a pad rather than a
     panel fading in, and it is what makes the canvas feel like somewhere
     things are placed by hand.

     position:fixed and outside the canvas: .fb-wrap is a scrolling
     surface and the note has to stay put while the compose box is open.
     Its z-index clears the toast host and the shell's rail. */
  .fb-compose{position:fixed; z-index:70; width:min(360px, calc(100vw - 24px));
    transform-style:preserve-3d;
    background:var(--np-hue); color:var(--np-fg); border:0;
    border-radius:var(--radius-lg); box-shadow:0 25px 50px -12px rgba(0,0,0,.28);
    display:flex; flex-direction:column; max-height:calc(100dvh - 24px);
    transform-origin:top left;}
  /* The dashboard's swing, verbatim. --nsw-* place the start pose on the
     anchor's own rect; --nsw-dir mirrors the turn when the anchor sits
     right of centre so the card always rotates toward the reader. */
  .fb-compose.is-opening{animation:fbSwingIn .6s cubic-bezier(.25,.9,.35,1) both;}
  .fb-compose.is-closing{animation:fbSwingOut .45s cubic-bezier(.3,.6,.35,1) both;}
  @keyframes fbSwingIn{
    0%{transform:translate(var(--nsw-dx,0px), var(--nsw-dy,0px)) scale(var(--nsw-sx,1), var(--nsw-sy,1)); opacity:.4;}
    45%{transform:translate(calc(var(--nsw-dx,0px) * .5), calc(var(--nsw-dy,0px) * .5)) scale(.7) rotateY(calc(48deg * var(--nsw-dir,1))) rotateZ(calc(-7deg * var(--nsw-dir,1))); opacity:1;}
    78%{transform:translate(0,0) scale(1) rotateY(calc(-7deg * var(--nsw-dir,1))) rotateZ(calc(1deg * var(--nsw-dir,1)));}
    100%{transform:none; opacity:1;}
  }
  @keyframes fbSwingOut{
    0%{transform:none; opacity:1;}
    50%{transform:translate(calc(var(--nsw-dx,0px) * .5), calc(var(--nsw-dy,0px) * .5)) scale(.7) rotateY(calc(45deg * var(--nsw-dir,1))) rotateZ(calc(-6deg * var(--nsw-dir,1))); opacity:1;}
    100%{transform:translate(var(--nsw-dx,0px), var(--nsw-dy,0px)) scale(var(--nsw-sx,1), var(--nsw-sy,1)); opacity:.35;}
  }

  /* ── Inside the panel, laid out as the dashboard lays its own out:
       a hairline under the header, a hairline over the actions, and the
       body between them as the only part that scrolls. Both hairlines
       and every line of type are the note's foreground, which is white
       on all five papers. */
  .fb-compose .np-top{display:flex; align-items:center; gap:8px;
    padding:14px 16px 11px; flex:none;
    border-bottom:1px solid color-mix(in srgb, var(--np-fg) 60%, transparent);}
  .fb-compose .np-eyebrow{font-size:var(--text-label3-size); font-weight:700;
    letter-spacing:var(--tracking-eyebrow); text-transform:uppercase;
    color:var(--np-fg);}
  /* A white coin with quiet grey initials, whatever the hue. */
  .fb-compose .ava{display:inline-grid; place-items:center; width:24px; height:24px;
    flex:none; border-radius:50%; background:var(--color-neutral-1);
    color:var(--color-neutral-5); font-size:var(--text-label3-size);
    font-weight:800; font-style:normal;}
  .fb-compose .np-top b{font-weight:800; color:var(--np-fg);
    font-size:var(--text-caption-size);}
  /* No close cross. Cancel closes the one being written, Done closes the
     one being read, Escape closes either, and a click on the canvas
     closes a note that holds no unsaved words. A cross on top of all
     four was a fifth way to do what four things already did. */

  /* The bottom padding is what keeps the last thing in the body — the
     status chips on a note being read — off the hairline above the
     actions. Without it the chips and the rule touched. */
  .fb-compose .np-body{padding:12px 16px 16px; overflow-y:auto; flex:1; min-height:0;}
  .fb-compose .np-kick{display:block; font-size:var(--text-label3-size);
    font-weight:700; letter-spacing:var(--tracking-eyebrow); text-transform:uppercase;
    color:var(--np-fg); margin-bottom:2px;}
  /* The field is the panel: no box, no border, just the caret on the hue. */
  .fb-compose textarea{display:block; width:100%; box-sizing:border-box; font:inherit;
    font-size:var(--text-label2-size); line-height:1.55; color:var(--np-fg);
    caret-color:var(--np-fg); background:transparent; border:0;
    padding:2px 0; resize:none; min-height:132px;}
  /* No focus box. A textarea matches :focus-visible the moment it is
     focused, which drew a frame over a borderless field on every open;
     the caret is the focus indicator here, as on the dashboard. */
  .fb-compose textarea:focus, .fb-compose textarea:focus-visible{outline:none;}
  .fb-compose textarea::placeholder{color:var(--np-fg); opacity:.72;}

  /* Read mode: the same panel with the note in it instead of a field. */
  .fb-compose .np-text{margin:0; font-size:var(--text-body2-size); line-height:1.55;
    color:var(--np-fg); font-weight:600; white-space:pre-wrap; overflow-wrap:break-word;}
  .fb-compose .np-shot{display:block; width:100%; max-height:260px; object-fit:contain;
    border-radius:var(--radius-sm); margin:12px 0 0;
    background:color-mix(in srgb, var(--np-fg) 18%, transparent);}
  .fb-compose .np-by{display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    margin-top:12px; font-size:var(--text-label3-size); font-weight:700;
    color:var(--np-fg);}
  .fb-compose .np-by b{font-weight:800;}
  .fb-compose .np-status{display:flex; gap:6px; flex-wrap:wrap; margin-top:14px;}
  /* Status is chosen on the note, so the chips are white paper on the
     hue rather than the board's neutral filter chips, which would
     disappear into the fill. */
  .fb-compose .np-st{height:26px; padding:0 12px; border-radius:var(--radius-pill);
    font-family:inherit; font-size:var(--text-label3-size); font-weight:800;
    background:transparent; color:var(--np-fg); cursor:pointer;
    border:1px solid color-mix(in srgb, var(--np-fg) 60%, transparent);}
  .fb-compose .np-st.is-on{background:#fff; color:var(--np-ink); border-color:#fff;}
  .fb-compose .np-st:focus-visible{outline:2px solid #fff; outline-offset:2px;}

  /* ── Attaching a screenshot. The DS FileUploader's structure and its
       classes, with the colours that assume a Neutral-1 ground taken to
       the note's own white: a Neutral-3 dashed hairline is invisible on
       a saturated fill. Everything else — the box model, the 22px kind
       badge, the 24px remove target — is the component as documented. */
  .fb-compose .c-uploader{max-width:none; gap:var(--spacing-8); margin-top:12px;}
  .fb-compose .c-uploader-zone{padding:var(--spacing-12); gap:6px;
    flex-direction:row; justify-content:center; background:transparent;
    border:1px dashed color-mix(in srgb, var(--np-fg) 70%, transparent);
    border-radius:var(--radius-md);}
  .fb-compose .c-uploader-zone:hover,
  .fb-compose .c-uploader-zone.dragover{
    background:color-mix(in srgb, var(--np-fg) 16%, transparent);
    border:1px dashed var(--np-fg);}
  .fb-compose .c-uploader-zone i,
  .fb-compose .c-uploader-label{color:var(--np-fg);}
  .fb-compose .c-uploader-label{font-size:var(--text-caption-size);}
  .fb-compose .c-uploader-row{background:transparent; align-items:center;
    border:1px solid color-mix(in srgb, var(--np-fg) 45%, transparent);}
  .fb-compose .c-uploader-name,
  .fb-compose .c-uploader-size,
  .fb-compose .c-uploader-remove{color:var(--np-fg);}
  .fb-compose .c-uploader-kind{background:transparent; color:var(--np-fg);
    border:1px solid color-mix(in srgb, var(--np-fg) 60%, transparent);}
  .fb-compose .c-uploader-remove:hover{background:color-mix(in srgb, var(--np-fg) 20%, transparent);}
  .fb-compose .c-uploader-thumb{width:34px; height:34px; flex:none; object-fit:cover;
    border-radius:var(--radius-sm);}

  /* ── The actions, under their own hairline and ranged right. Cancel is
       white paper, the primary is obsidian: the dashboard's own pair, and
       the one place on this note where a control is not the hue. */
  .fb-compose .np-act{display:flex; gap:8px; align-items:center;
    justify-content:flex-end; flex-wrap:wrap; flex:none;
    padding:12px 16px 14px;
    border-top:1px solid color-mix(in srgb, var(--np-fg) 60%, transparent);}
  .fb-compose .np-count{margin-right:auto; font-size:var(--text-label3-size);
    font-weight:700; color:var(--np-fg);}
  .fb-compose .np-count.is-near{text-decoration:underline;}
  .fb-compose .np-chip{height:32px; padding:0 16px; border:0;
    border-radius:var(--radius-pill); font-family:inherit;
    font-size:var(--text-label2-size); font-weight:800; cursor:pointer;
    transition:transform var(--duration-instant) var(--ease-standard),
               opacity var(--duration-fast) var(--ease-standard);}
  .fb-compose .np-chip:active:not(:disabled){transform:scale(.96);}
  .fb-compose .np-chip:disabled{opacity:.5; cursor:not-allowed;}
  .fb-compose .np-chip.cancel{background:var(--color-neutral-1); color:var(--color-neutral-5);}
  .fb-compose .np-chip.go{background:var(--color-obsidian); color:#fff;}
  .fb-compose .np-chip:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  .fb-compose .np-del{margin-right:auto; width:32px; height:32px; flex:none;
    display:grid; place-items:center; border:0; border-radius:var(--radius-sm);
    background:transparent; color:var(--np-fg); cursor:pointer;}
  .fb-compose .np-del:hover{background:color-mix(in srgb, var(--np-fg) 20%, transparent);}
  .fb-compose .np-del + .np-count{margin-right:auto;}

  /* ── An opened note is bigger than a note. The tile is 210px square, so
       a panel at the compose box's 360 was only two-thirds wider and read
       as a slightly grown tile rather than as the note opened up. At 440
       it is more than twice the tile's edge, the sentence gets a
       comfortable measure instead of four words a line, and the deeper
       shadow lifts it off the wall it came from. */
  .fb-compose.is-read{width:min(440px, calc(100vw - 24px));
    box-shadow:0 32px 64px -16px rgba(0,0,0,.34);}
  .fb-compose.is-read .np-text{font-size:var(--text-body1-size); line-height:1.5;}

  /* The note the compose box turns into, mid-flight. Painted over the
     canvas so the shrink lands on the real note rather than beside it. */
  .fb-note.is-landing{opacity:0;}
  /* One of each note on screen. While a note is open as a panel, its tile
     stands down rather than sitting underneath a larger copy of itself.
     visibility, not display: the rect has to survive for the panel to be
     placed against and for the close swing to land on. */
  .fb-note.is-open-elsewhere{visibility:hidden;}

  /* ══ Skeleton, for the first load ════════════════════════════════════
     Shaped like the thing it is standing in for, so the board does not
     jump when the data lands. */
  .fb-sk{background:var(--color-neutral-2); border-radius:var(--radius-sm);
    height:12px; margin-bottom:8px;}
  .fb-sk.w70{width:70%;} .fb-sk.w45{width:45%;} .fb-sk.w90{width:90%;}
  /* Blank paper. It takes the placement pass like a real note, so the
     wall it stands in for is the wall that arrives. */
  .fb-sk-note{--np-hue:var(--color-neutral-1); --np-fg:var(--color-neutral-5);
    --np-ink:var(--color-neutral-5); box-shadow:var(--shadow-1); pointer-events:none;}
  @media (prefers-reduced-motion:no-preference){
    .fb-sk{animation:fbPulse 1.4s var(--ease-standard) infinite;}
    @keyframes fbPulse{0%,100%{opacity:1;} 50%{opacity:.45;}}
  }

  /* ══ Compose and detail ══════════════════════════════════════════════
     There is no modal here any more, and no scrim. A note is written on
     paper and read on the same paper, so both are .fb-compose below; the
     white dialog that used to open over the board was the one place the
     page stopped looking like a wall of notes. */

  /* ── The duplicate nudge. It runs the same matcher the board clusters
       with, so catching a repeat here is also what keeps the regions
       readable later. Framed as an offer, never as a block. */
  /* ── The duplicate nudge, on the note rather than in spite of it. The
       rows used to be Neutral-2, which over a saturated fill read as
       translucent white boxes stuck on the paper. They now take
       --np-ink: the element's own hue taken dark, which is already in
       the file as the colour the vote chip and the avatar use, so this
       introduces no new value. It is the same paper, in shadow.

       White on it clears the floor on all five (Fire 6.1, Wood 6.38,
       Earth 5.9, Water 7.78, Gold 5.93) and separates from the fill it
       sits on by 1.7 to 3.0, which is enough to read as a recess. */
  .fb-dupes{margin-top:var(--spacing-16); padding-top:var(--spacing-16);
    border-top:1px solid color-mix(in srgb, var(--np-fg) 60%, transparent);}
  .fb-dupes h4{margin:0 0 var(--spacing-8); font-size:var(--text-label1-size);
    font-weight:700; color:var(--np-fg);}
  .fb-dupe{display:flex; align-items:center; gap:var(--spacing-12);
    padding:var(--spacing-8) var(--spacing-8) var(--spacing-8) var(--spacing-12);
    border-radius:var(--radius-md); background:var(--np-ink);
    color:var(--np-fg); margin-bottom:var(--spacing-8);}
  .fb-dupe .txt{flex:1; min-width:0; font-size:var(--text-body2-size); line-height:1.4;
    color:var(--np-fg);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  /* White paper on the recess, the same chip the vote pill and Cancel
     are, so every light control on this note is made of one material. */
  .fb-dupe .back{flex:none; height:28px; padding:0 12px; border:0;
    border-radius:var(--radius-pill); font-family:inherit;
    font-size:var(--text-label3-size); font-weight:800;
    background:#fff; color:var(--np-ink); cursor:pointer;
    transition:transform var(--duration-instant) var(--ease-standard);}
  .fb-dupe .back:active{transform:scale(.95);}
  .fb-dupe .back:focus-visible{outline:2px solid #fff; outline-offset:2px;}

  /* ══ Offline banner ══════════════════════════════════════════════════ */
  /* Kept, unused by the page today: the offline banner was removed while
     the shared store is being decided, and this is the recipe to put it
     back with rather than reinvent. */
  .fb-offline{display:flex; align-items:flex-start; gap:var(--spacing-12);
    padding:var(--spacing-12) var(--spacing-16); border-radius:var(--radius-md);
    background:var(--color-gold-bg); border:1px solid rgba(255,164,37,.38);
    font-size:var(--text-body2-size); line-height:1.45;}
  .fb-offline i{font-size:var(--icon-base); color:var(--color-amber); flex:none;}
  .fb-offline b{display:block;}

  .fb-empty-actions{display:flex; gap:var(--spacing-8); margin-top:var(--spacing-8);
    flex-wrap:wrap; justify-content:center;}

  a.c-sidebar-item{text-decoration:none;}

  /* ══ Narrow ══════════════════════════════════════════════════════════ */

  /* ---- The nav becomes a box in the corner, which is what the dashboard
     does and for the same arithmetic: the rail costs 88px of a 375px screen
     and runs the full page height to hold two items. absolute rather than
     fixed, and .c-shell becomes the containing block. The band on
     .c-shell-main reserves the space rather than overlaying it, so nothing
     sticky inside the content has to know the box is there.

     640, not the 760 the board uses, because this is the dashboard's
     breakpoint and the nav is the one thing on both pages. At 700px the
     two disagreed: a corner box here, a rail in flow there, so walking
     between Dashboard and Feedback changed the shape of the navigation
     rather than just its contents. The board keeps its own 760 below. */
  @media (max-width:640px){
    .c-shell{position:relative;}
    .c-shell .c-sidebar-shell{position:absolute; top:var(--spacing-16);
      left:var(--spacing-16); margin:0; z-index:50;}
    .c-shell-main{padding-top:74px;}
    .c-sidebar.is-collapsed .c-sidebar-header{padding:var(--spacing-8);}
    /* Collapsed on a phone is the header alone. Leaving the items in made
       the box 165px tall, which put it over the top of the board rather
       than in the band reserved for it. Expanding is how you reach them,
       and expanding overlays, which is why a tap outside closes it. The
       footer goes with them here, and only here: on a laptop the collapsed
       rail keeps the avatar. */
    .c-sidebar.is-collapsed .c-sidebar-item,
    .c-sidebar.is-collapsed .c-sidebar-footer{display:none;}
  }

  @media (max-width:760px){
    .fb-wrap{padding:var(--spacing-20) var(--spacing-16) var(--spacing-48);}
    .fb-head h1{font-size:26px; line-height:1.2;}
    .fb-head-right{width:100%; justify-content:space-between;}
    .fb-controls{gap:var(--spacing-12);}
    /* 16px or iOS Safari zooms the page the moment this takes focus, which
       is a whole-layout event, not a font-size one. */
    .fb-compose textarea{font-size:16px;}
    /* The note is the width of the screen here, so it is pinned to the
       gutter rather than right-aligned under a button that is itself
       nearly full width. */
    .fb-compose{width:calc(100vw - 32px);}
  }
  @media (pointer:coarse){
    .fb-vote{height:36px; min-width:60px;}
    .fb-seg button{height:34px;}
    /* 36px to match the dashboard's own filter row, with the 44px floor
       kept as a hit area rather than a box: the transparent ::after puts
       the target back to 44 and the 8px row gap keeps two rows of chips
       from sharing one. */
    .fb-filters{gap:var(--spacing-8);}
    .fb-filters .c-chip-filter{position:relative; height:36px;}
    .fb-filters .c-chip-filter::after{content:''; position:absolute; inset:-4px 0;}
  }
  /* Reduced motion takes the movement away, so it must not leave the
     board depending on movement to be readable. The layout pass stops
     overlapping the notes here (see REDUCED in layout()), which is what
     makes it safe to switch the parting off: nothing is hidden behind
     anything, so nothing needs to be pushed aside to be read. The tilt
     goes too — it is decoration, and a straightened wall is the honest
     version of this board for someone who asked for less. */
  @media (prefers-reduced-motion:reduce){
    .fb-note,.fb-vote,.fb-canvas{transition:none;}
    .fb-note{transform:none;}
    .fb-compose.is-opening,.fb-compose.is-closing{animation:none;}
    .fb-drift{transition:none;}
  }
</style>
</head>
<body>

<div class="c-shell">
  <div class="c-sidebar-shell" id="shellSidebarShell">
    <nav class="c-sidebar" id="shellSidebarNav">
      <div class="c-sidebar-header">
        <!-- Three marks, one shown at a time, and CSS picks which rather than
             JS swapping a src: the live wrap is the animated default, the
             static img is a picked department's lockup, and the collapsed
             icon is shown only by .c-sidebar.is-collapsed in components.css. -->
        <button class="c-dept-trigger js-dept-trigger" type="button" aria-haspopup="listbox"
                aria-expanded="false" aria-label="Switch department" aria-controls="deptDropdown">
          <span class="c-sidebar-logo-live-wrap js-dept-logo-live"><iframe src="../collabrium-dls/logo.html" title="Collabrium" scrolling="no"></iframe></span>
          <img class="c-dept-logo-static js-dept-logo-static" alt="" style="display:none" />
          <i class="ph ph-caret-down js-dept-chevron c-dept-chevron"></i>
        </button>
        <img class="c-sidebar-logo-collapsed js-dept-logo-collapsed" src="../collabrium-dls/SVG/coin.svg" alt="Collabrium" />
      </div>
      <div class="c-sidebar-section">Overview</div>
      <a class="c-sidebar-item" href="landing-v3.html"><i class="ph-fill ph-house"></i><span class="label">Dashboard</span><span class="c-sidebar-hover-text">Dashboard</span></a>
      <a class="c-sidebar-item active" href="feedback-v1.html" aria-current="page"><i class="ph-fill ph-lightbulb-filament"></i><span class="label">Feedback</span><span class="c-sidebar-hover-text">Feedback</span></a>
      <div class="c-sidebar-footer">
        <button class="c-sidebar-account" type="button" id="accountMenuTrigger"
                aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu">
          <span class="c-search-input-avatar">BW</span>
          <span class="c-search-input-text">
            <span class="c-search-input-title">Bryan Wong</span>
            <span class="c-search-input-subtitle">Head of Revenue</span>
          </span>
        </button>
      </div>
    </nav>
    <button class="c-sidebar-toggle" type="button" aria-label="Collapse sidebar" id="sidebarToggle">
      <svg viewBox="0 0 20 20" fill="none">
        <rect x="2.5" y="3.5" width="15" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
        <line x1="9" y1="3.5" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
        <path id="sidebarArrow" d="M13.5 7 11 10l2.5 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="c-shell-main">
    <div class="c-shell-content">
      <div class="fb-wrap">
        <div class="fb-inner">

          <header class="fb-head">
            <div>
              <h1>What should we fix first</h1>
              <p class="sub">Thirty days, ten of us. Post what got in your way, back the
                things you want handled, and the board sorts itself by what the group
                actually agrees on.</p>
            </div>
            <div class="fb-head-right">
              <!-- The dots carry the count and the word carries only the
                   noun. That means the number exists in shape alone, so the
                   whole pill takes a live aria-label with the count spelled
                   out; renderBudget() keeps it in step. -->
              <div class="fb-budget" id="fbBudget" role="img"
                   aria-label="5 votes left" title="Votes you have left to spend">
                <span class="pips" id="fbPips" aria-hidden="true"></span>
                <span class="txt">Votes</span>
              </div>
              <button class="c-btn c-btn-primary c-btn-md" type="button" id="fbAdd">
                <i class="ph ph-plus"></i> Add feedback
              </button>
            </div>
            <!-- Closes the standfirst and opens the working surface. Last in
                 the flex row and full width, so it spans the header rather
                 than sitting between the text and the controls and pushing
                 them onto their own line. -->
            <hr class="fb-rule" />
          </header>

          <div class="fb-controls">
            <div class="fb-filters" id="fbFilters" role="group" aria-label="Filter">
              <button class="c-chip c-chip-filter is-active" type="button" data-st="all">Everything</button>
              <button class="c-chip c-chip-filter" type="button" data-st="new">Open</button>
              <button class="c-chip c-chip-filter" type="button" data-st="planned">Planned</button>
              <button class="c-chip c-chip-filter" type="button" data-st="shipped">Shipped</button>
              <span class="fb-sep" aria-hidden="true"></span>
              <button class="c-chip c-chip-filter" type="button" data-own="mine">Mine</button>
              <button class="c-chip c-chip-filter" type="button" data-own="backed">I backed</button>
              <span class="fb-sep" aria-hidden="true"></span>
              <!-- Not a filter: it hides nothing. It sits in the filter row
                   because that is where the board's controls are, and it is
                   marked as a toggle rather than a choice among the chips to
                   its left, which is what aria-pressed says and data-st does
                   not. -->
              <button class="c-chip c-chip-filter fb-cluster" type="button"
                      id="fbCluster" aria-pressed="false">
                <i class="ph ph-graph"></i> Cluster
              </button>
            </div>
            <div class="fb-sort">
              <span class="lab" id="fbSortLab">Sort</span>
              <div class="fb-seg" role="group" aria-labelledby="fbSortLab" id="fbSort">
                <button type="button" data-sort="votes" aria-pressed="true">Most backed</button>
                <button type="button" data-sort="new" aria-pressed="false">Newest</button>
              </div>
            </div>
          </div>

          <main id="fbBoard" class="fb-canvas" aria-live="polite"></main>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Both of these are siblings of .c-shell, not children of .c-sidebar:
     .c-sidebar sets overflow-x:clip, which clips a fixed child of it just
     as surely as an absolute one. Same escape the sidebar toggle takes. -->
<div class="c-sidebar-hover-label" id="shellSidebarHoverLabel" role="tooltip"></div>

<div class="c-account-menu" id="accountMenu" role="menu" aria-hidden="true">
  <button class="c-account-menu-item" type="button" role="menuitem"><i class="ph-fill ph-gear"></i><span>Settings</span></button>
  <!-- An anchor, not a button: this row has a destination, so cmd-click
       opens a tab, the URL previews on hover, and it works without JS.
       The close handler matches the class, not the tag, so the menu still
       closes on the way out. -->
  <a class="c-account-menu-item" href="login-v1.html" role="menuitem"><i class="ph-fill ph-sign-out"></i><span>Log out</span></a>
</div>

<!-- Outside .c-sidebar and position:fixed, unlike the system's own absolutely
     positioned .c-dept-dropdown: .c-sidebar sets overflow-x:clip, so a panel
     positioned inside it is clipped at the rail's edge. Same escape the
     account menu and the hover label above already take. -->
<div class="c-dept-dropdown" id="deptDropdown" role="listbox" aria-label="Departments" hidden>
  <div class="c-dept-option is-active" role="option" aria-selected="true" aria-label="Collabrium (Default)" data-dept="default" data-name="Collabrium (Default)" data-element-icon="../collabrium-dls/SVG/coin.svg">
    <span class="c-dept-option-logo"><img src="../collabrium-dls/logo-lockups/collabrium-default-logo.svg" alt="" style="--logo-scale:0.6" /></span>
    <i class="ph ph-check c-dept-check"></i>
  </div>
  <div class="c-dept-option" role="option" aria-selected="false" aria-label="Studio" data-dept="studio" data-name="Studio" data-logo="../collabrium-dls/logo-lockups/collabStudio.svg" data-element-icon="../collabrium-dls/SVG/fire.svg">
    <span class="c-dept-option-logo"><img src="../collabrium-dls/logo-lockups/collabStudio.svg" alt="" /></span>
    <i class="ph ph-check c-dept-check"></i>
  </div>
  <div class="c-dept-option" role="option" aria-selected="false" aria-label="Sales" data-dept="sales" data-name="Sales" data-logo="../collabrium-dls/logo-lockups/collabSales.svg" data-element-icon="../collabrium-dls/SVG/gold.svg">
    <span class="c-dept-option-logo"><img src="../collabrium-dls/logo-lockups/collabSales.svg" alt="" /></span>
    <i class="ph ph-check c-dept-check"></i>
  </div>
  <div class="c-dept-option" role="option" aria-selected="false" aria-label="Influencers" data-dept="influencers" data-name="Influencers" data-logo="../collabrium-dls/logo-lockups/collabInfluencers.svg" data-element-icon="../collabrium-dls/SVG/earth.svg">
    <span class="c-dept-option-logo"><img src="../collabrium-dls/logo-lockups/collabInfluencers.svg" alt="" /></span>
    <i class="ph ph-check c-dept-check"></i>
  </div>
  <div class="c-dept-option" role="option" aria-selected="false" aria-label="Content" data-dept="content" data-name="Content" data-logo="../collabrium-dls/logo-lockups/collabContent.svg" data-element-icon="../collabrium-dls/SVG/wood.svg">
    <span class="c-dept-option-logo"><img src="../collabrium-dls/logo-lockups/collabContent.svg" alt="" /></span>
    <i class="ph ph-check c-dept-check"></i>
  </div>
</div>

<div class="c-toast-host" id="fbToasts"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   The feedback board.

   Three things are load-bearing here and everything else serves them.

   1. CLUSTERING. Notes group by weighted term overlap, not by a chosen
      category. Terms are weighted by how rare they are on this board, so
      "leaderboard" pulls two notes together and "the" does not, and the
      words that did the pulling are printed on the region header. A board
      that groups silently is a board nobody trusts the second time.

      What it cannot do, stated plainly: it matches words, not meanings.
      "Slow" and "laggy" will not meet. The duplicate nudge at compose
      time is the mitigation, because a person reading two near-matches
      catches what the arithmetic misses.

   2. SCARCITY. Five open votes each. Backing everything is the same as
      backing nothing, and with ten people an uncapped board just ranks
      whoever posted first. Shipping a request releases its votes.

   3. THE LOOP. New, Planned, Shipped, each stamped with who moved it.
      A feedback board with no visible consequence stops receiving
      feedback in about a fortnight.

   Storage is /api/feedback when a database is attached and localStorage
   when it is not, and the page says which out loud rather than quietly
   pretending the group can see what you wrote.

   NO AUTHENTICATION. The signed-in name is read off the shell. Ten
   colleagues who know each other, thirty days; that is the whole
   security model, and it is not one that survives contact with a
   wider group. */

(function () {
'use strict';

var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LS_KEY = 'collabrium-feedback-v1';
var MAX_LEN = 400;
var POLL_MS = 20000;
var DEFAULT_BUDGET = 5;

var STATE = {
  notes: [],
  budget: DEFAULT_BUDGET,
  remote: false,
  loaded: false,
  st: 'all',          // status filter
  own: null,          // 'mine' | 'backed' | null
  sort: 'votes',
  open: null,         // id of the note whose detail is open, or 'compose'
  clustered: false,   // is the canvas pulled into drifts
  /* id -> place in the posting sequence, which is what picks a note's
     colour. Held rather than derived on each call because elOf() runs
     once per note per render and indexOf would make that quadratic. */
  order: {}
};

/* Rebuilt whenever the note list is replaced. STATE.notes arrives ordered
   by seq from the server, and locally it is append-only, so the array
   index IS the posting order in both paths. */
function reindex() {
  STATE.order = {};
  for (var i = 0; i < STATE.notes.length; i++) STATE.order[STATE.notes[i].i] = i;
}

/* ── Who is writing ──────────────────────────────────────────────────
   One source, the shell's account block, so the byline can never drift
   from the name on screen. */
function me() {
  var el = document.querySelector('.c-search-input-title');
  return (el && el.textContent.trim()) || 'Unsigned';
}
function initials(name) {
  var p = String(name || '').trim().split(/\s+/);
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function when(ts) {
  var d = ts ? new Date(ts) : new Date();
  if (isNaN(d.getTime())) return '';
  return d.getDate() + ' ' + MONTHS[d.getMonth()];
}
function newId() {
  return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ═══ 1. The matcher ═══════════════════════════════════════════════════
   Everything about grouping lives here: the board's regions and the
   compose-time nudge are the same function at two thresholds. */

/* Only true function words. Domain-common words are deliberately absent:
   "dashboard" appears in half the notes on a dashboard's feedback board,
   and the rarity weighting below already strips its pull to nearly zero.
   A hand-written domain stoplist would have to be maintained forever and
   would be wrong the moment the product changed. */
var STOP = ('a about after all also am an and any are as at be because been before being ' +
  'but by can cant could did do does doing done dont each even every for from get got had ' +
  'has have having he her here hers him his how i if in into is it its just like make me ' +
  'more most much my no nor not now of off on once one only or other our out over own re ' +
  'same she should since so some such than that the their them then there these they thing ' +
  'things this those through to too under until up us use used using very was way we well ' +
  'were what when where which while who why will with would you your ' +
  /* The second list is the one that earned its place empirically. Without
     it the board grouped a note about an export button with a note about
     the filter row, because both happened to contain the word "hand".
     These are words that appear in feedback of every kind and describe
     none of it. */
  'add ago always another ask asked back bit come day days end ever far feel find first ' +
  'give given go goes going good great hand hard help keep kind know last later least let ' +
  'long look looking lot made many maybe mean might mine month morning need needs never ' +
  'new next often old open opening put quite rather really right said say see seem seems ' +
  'set show something sometimes soon stay still sure take takes tell thanks think time ' +
  'times try trying turn twice two want wanted week weeks whole work working year yes yet'
  ).split(' ');
var STOPSET = {};
for (var si = 0; si < STOP.length; si++) STOPSET[STOP[si]] = 1;

/* Crude, deliberately. A real stemmer would be a dependency and a
   maintenance surface; these five suffixes cover the plural-and-tense
   drift that actually separates two people describing one problem. */
function stem(w) {
  if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + 'y';
  if (w.length > 4 && /(sses|shes|ches|xes)$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
  if (w.length > 5 && /ing$/.test(w)) return w.slice(0, -3);
  if (w.length > 4 && /ed$/.test(w)) return w.slice(0, -2);
  return w;
}
function terms(text) {
  var raw = String(text || '').toLowerCase().replace(/[^a-z0-9\s'-]/g, ' ').split(/\s+/);
  var out = {}, n = 0;
  for (var i = 0; i < raw.length; i++) {
    var w = raw[i].replace(/^['-]+|['-]+$/g, '');
    if (w.length < 3 || STOPSET[w]) continue;
    var s = stem(w);
    // the surface form, for naming, and where it first appeared, which is
    // what tells a subject from a word that merely turned up
    if (!out[s]) { out[s] = {w: w, at: n}; }
    n++;
  }
  return n ? out : null;
}

/* How distinctive each word is on this board. A word in two notes out of
   fourteen says something; a word in eleven of them says nothing, and it
   stops counting on its own without anyone maintaining a list. */
function corpus(notes) {
  var df = {}, docs = [];
  for (var i = 0; i < notes.length; i++) {
    var t = terms(notes[i].t) || {};
    docs.push(t);
    for (var k in t) if (t.hasOwnProperty(k)) df[k] = (df[k] || 0) + 1;
  }
  var N = notes.length, spec = {};
  for (var w in df) if (df.hasOwnProperty(w)) spec[w] = 1 - df[w] / N;
  return {docs: docs, spec: spec, df: df, N: N};
}

/* Ranking for the compose-time nudge only; the board groups with group()
   above. How likely it is that two notes are about the same thing: the
   chance that at least one of the words they share is a real subject
   rather than a coincidence. Each shared word gets one attempt to convince,
   weighted by how distinctive it is, and the failures multiply.

   This is not cosine, and the difference matters. Cosine asks what
   PROPORTION of each note is shared, which is the wrong question for two
   sentences: "Leaderboard is slow on my phone" and "the leaderboard
   redraws every time I change a filter" have one word in common out of
   eight each, so cosine scored them 0.07 and the board grouped nothing.
   Sharing a distinctive subject is the signal; sentence length around it
   is noise.

   Presence, not frequency. In a two-sentence note a word said twice is
   an accident of phrasing, not emphasis. */
function sim(a, b, spec) {
  var miss = 1, hit = false, w;
  for (w in a) if (a.hasOwnProperty(w) && b.hasOwnProperty(w)) {
    hit = true;
    miss *= (1 - (spec[w] || 0) * 0.9);   // .9: no single word is ever proof
  }
  return hit ? 1 - miss : 0;
}

/* Group by the word a set of notes has in common, strongest topic first,
   each note landing in exactly one region.

   Two earlier attempts are worth recording, because both looked
   reasonable and both were measured to be wrong.

   Cosine similarity scored two notes that both lead with "leaderboard"
   at 0.07, because one shared word out of eight each is a small
   PROPORTION. It grouped nothing at all.

   Rarity-weighted pair similarity with average-link clustering grouped
   most things, but a word in three notes scored LOWER than a word in
   two, so the bigger a topic got the harder it was to hold together, and
   the same two notes clustered or did not depending on how many
   unrelated notes happened to be on the board. On fourteen labelled
   notes it found the leaderboard trio; on nine it split them.

   This does neither. Its ranking signal is where a word appears rather
   than how rare it is: people put the subject of a complaint at the
   front. "Leaderboard is slow" leads with its topic, while "hard to
   reach with one hand" does not, which is what separates a real subject
   from a word two notes happen to share. Measured on the same labelled
   set at three board sizes, it holds every topic together at all three:
   fourteen notes to five regions covering twelve, nine to three
   covering eight, four to one covering three.

   It also cannot chain and cannot blob, because a note is assigned once
   and a region is named by the word that assigned it. What it cannot do
   is still what it never could: match meanings. "Slow" and "laggy" will
   not meet. The nudge at compose time is where a person catches that. */
function group(notes) {
  var C = corpus(notes), N = notes.length, where = {}, i, w;
  if (!N) return {regions: [], corpus: C};

  for (i = 0; i < N; i++) {
    var d = C.docs[i];
    for (w in d) if (d.hasOwnProperty(w)) (where[w] || (where[w] = [])).push(i);
  }

  /* A word in most of the notes is describing the product, not a topic.
     The floor matters more than the fraction: on a four-note board where
     three are about one thing, that thing is still the topic. */
  var ceiling = Math.max(3, Math.floor(N * 0.6));
  var cand = [];
  for (w in where) if (where.hasOwnProperty(w)) {
    var hits = where[w];
    if (hits.length < 2 || hits.length > ceiling) continue;
    var lead = 0;
    for (i = 0; i < hits.length; i++) lead += C.docs[hits[i]][w].at;
    cand.push({w: w, hits: hits, lead: lead / hits.length});
  }
  // earliest-mentioned wins, and a bigger topic breaks a tie
  cand.sort(function (a, b) { return (a.lead - b.lead) || (b.hits.length - a.hits.length); });

  var taken = [], regions = [];
  for (i = 0; i < cand.length; i++) {
    var free = cand[i].hits.filter(function (k) { return !taken[k]; });
    if (free.length < 2) continue;               // already spoken for elsewhere
    for (var f = 0; f < free.length; f++) taken[free[f]] = true;
    regions.push({term: C.docs[free[0]][cand[i].w].w, idx: free,
                  why: alsoShared(free, C, cand[i].w)});
  }
  for (i = 0; i < N; i++) if (!taken[i]) regions.push({term: null, idx: [i], why: []});
  return {regions: regions, corpus: C};
}

/* The other words most of a region has in common. The heading names one
   word; these say what else it was that made them a group, so a reader
   can see the reasoning rather than trusting it. */
function alsoShared(idx, C, main) {
  if (idx.length < 2) return [];
  var count = {}, i, w;
  for (i = 0; i < idx.length; i++) {
    var d = C.docs[idx[i]];
    for (w in d) if (d.hasOwnProperty(w)) count[w] = (count[w] || 0) + 1;
  }
  var need = Math.max(2, Math.ceil(idx.length * 0.6)), out = [];
  for (w in count) if (count.hasOwnProperty(w) && w !== main && count[w] >= need) out.push(w);
  out.sort(function (a, b) { return (C.spec[b] || 0) - (C.spec[a] || 0); });
  return out.slice(0, 2).map(function (s) {
    for (i = 0; i < idx.length; i++) if (C.docs[idx[i]][s]) return C.docs[idx[i]][s].w;
    return s;
  });
}

/* ═══ 2. Storage ═══════════════════════════════════════════════════════
   The API when there is one, this device when there is not, and the page
   says which. Local mode is a real fallback, not a silent one: writing
   into a void believing colleagues can see it is worse than not writing. */

function loadLocal() {
  try {
    var v = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    return Array.isArray(v.notes) ? v.notes : [];
  } catch (e) { return []; }
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({notes: STATE.notes})); } catch (e) {}
}

function api(method, body, query) {
  var url = '/api/feedback' + (query || '');
  var opt = {method: method, headers: {'content-type': 'application/json'}};
  if (body) opt.body = JSON.stringify(body);
  return fetch(url, opt).then(function (r) {
    return r.json().then(function (j) { return {status: r.status, body: j}; },
                         function () { return {status: r.status, body: null}; });
  });
}

function adopt(x) {
  if (!x || !x.body) return false;
  if (x.body.configured === false) { STATE.remote = false; return false; }
  if (x.status >= 400 || !Array.isArray(x.body.notes)) return false;
  STATE.remote = true;
  STATE.notes = x.body.notes;
  reindex();
  if (typeof x.body.budget === 'number') STATE.budget = x.body.budget;
  saveLocal();                                   // the cache, for the next cold start
  return true;
}

function boot() {
  STATE.notes = loadLocal();
  reindex();
  render();                                       // the cache paints first
  api('GET').then(function (x) {
    var ok = adopt(x);
    STATE.loaded = true;
    if (!ok) STATE.remote = false;
    render();
  }, function () {
    STATE.loaded = true; STATE.remote = false; render();
  });
}

/* ═══ 3. Votes ═════════════════════════════════════════════════════════ */

function spent() {
  var who = me(), n = 0;
  for (var i = 0; i < STATE.notes.length; i++) {
    var f = STATE.notes[i];
    if (f.st === 'shipped') continue;             // shipping gives the vote back
    if ((f.v || []).indexOf(who) >= 0) n++;
  }
  return n;
}
function left() { return Math.max(0, STATE.budget - spent()); }
function iBacked(f) { return (f.v || []).indexOf(me()) >= 0; }

function toggleVote(id) {
  var f = find(id); if (!f) return;
  var who = me(), on = !iBacked(f);
  if (on && f.st !== 'shipped' && left() <= 0) {
    toast('warning', 'No votes left',
      'Remove a vote from something else to vote for this. Shipped requests return theirs.');
    return;
  }
  f.v = (f.v || []).slice();
  if (on) f.v.push(who); else f.v.splice(f.v.indexOf(who), 1);
  saveLocal(); render();                          // optimistic, the reply re-syncs
  if (!STATE.remote) return;
  api('PUT', {id: id, vote: on, author: who}).then(function (x) {
    if (x.status === 409) {
      toast('warning', 'No votes left', 'Someone else spent it first. Nothing was saved.');
    }
    if (!adopt(x)) return;
    render();
  }, function () { offline(); });
}

/* ═══ 4. Writes ════════════════════════════════════════════════════════ */

function find(id) {
  for (var i = 0; i < STATE.notes.length; i++) if (STATE.notes[i].i === id) return STATE.notes[i];
  return null;
}

/* The next sequence number, for the offline path only. The server owns
   the real one; this keeps a browser-local board's colours monotonic so
   a withdrawal there does not repaint everything after it either. */
function nextQ() {
  var m = -1;
  for (var i = 0; i < STATE.notes.length; i++) {
    var q = STATE.notes[i].q;
    if (typeof q === 'number' && q > m) m = q;
  }
  return m + 1;
}

/* thumb is what the canvas draws and what is cached locally; full is the
   grab the detail view fetches. Only the thumb goes into STATE, so the
   localStorage cache cannot be blown out by a few screenshots. */
function post(text, cb, thumb, full) {
  var who = me(), id = newId();
  STATE.notes.push({i: id, q: nextQ(), t: text, a: who, ts: new Date().toISOString(),
                    st: 'new', v: [], img: thumb || undefined});
  reindex(); saveLocal(); render();
  if (!STATE.remote) { if (cb) cb(id); return; }
  api('PUT', {text: text, author: who, newId: id,
              img: full || undefined, thumb: thumb || undefined}).then(function (x) {
    if (adopt(x)) render();
    if (cb) cb(id);
  }, function () { offline(); if (cb) cb(id); });
}

function setStatus(id, st) {
  var f = find(id); if (!f) return;
  f.st = st; f.stb = me(); f.sts = new Date().toISOString();
  saveLocal(); render();
  if (!STATE.remote) return;
  api('PUT', {id: id, status: st, author: me()}).then(function (x) {
    if (adopt(x)) render();
  }, function () { offline(); });
}

function remove(id) {
  var f = find(id); if (!f) return;
  if (f.a !== me()) return;                       // the buttons hide; this is the rule
  STATE.notes = STATE.notes.filter(function (n) { return n.i !== id; });
  reindex();
  saveLocal(); render();
  if (!STATE.remote) return;
  api('DELETE', null, '?id=' + encodeURIComponent(id) + '&author=' + encodeURIComponent(me()))
    .then(function (x) { if (adopt(x)) render(); }, function () { offline(); });
}

var warned = false;
function offline() {
  STATE.remote = false;
  if (!warned) { warned = true; toast('warning', 'Saved on this device only',
    'The board could not be reached, so this is not shared yet.'); }
  render();
}

/* ═══ 5. Rendering ═════════════════════════════════════════════════════ */

/* Five papers, taken in turn. The index is the note's place in the posting
   sequence, not its cluster and not its place on screen, so a note keeps
   the colour it was written on however the board is filtered or arranged.
   STATE.notes arrives ordered by seq, which is the posting order. */
var ELN = 5;
function elOf(f) {
  /* f.q is the row's seq, which the server assigns once and never reuses,
     so a withdrawal cannot repaint the notes after it. Cached notes from
     before this shipped have no q; those fall back to array position. */
  var q = (typeof f.q === 'number') ? f.q : STATE.order[f.i];
  return 'el-' + ((q === undefined ? 0 : q) % ELN);
}

function visible() {
  var who = me();
  return STATE.notes.filter(function (f) {
    if (STATE.st !== 'all' && (f.st || 'new') !== STATE.st) return false;
    if (STATE.own === 'mine' && f.a !== who) return false;
    if (STATE.own === 'backed' && !iBacked(f)) return false;
    return true;
  });
}

function statusBadge(st) {
  if (st === 'planned') return '<span class="c-badge c-badge-warning">Planned</span>';
  if (st === 'shipped') return '<span class="c-badge c-badge-success">' +
    '<i class="ph-fill ph-check"></i> Shipped</span>';
  return '';
}

/* A stable pseudo-rotation per note. Deterministic, so a note does not
   twitch every time the board redraws. */
/* The tilt, deterministic from the note's id so a redraw does not
   reshuffle the wall. Widened from a barely-there +/-1.2 degrees to
   roughly +/-4.5: at the old range the squares read as a slightly
   sloppy grid rather than as paper somebody put up by hand. Anything
   past about six starts to look like a mistake instead of a hand. */
function rot(id) {
  var h = 0;
  for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0xffff;
  return ((h % 91) / 10 - 4.5).toFixed(2);
}

function noteHTML(f) {
  var mine = iBacked(f), n = (f.v || []).length;
  var shot = f.img
    ? '<img class="shot" src="' + esc(f.img) + '" alt="Screenshot attached to this note" />'
    : '';
  return '<div class="fb-note ' + elOf(f) + (f.st === 'shipped' ? ' is-shipped' : '') + '" ' +
      'style="--fb-rot:' + rot(f.i) + 'deg" ' +
      'data-open="' + esc(f.i) + '" role="button" tabindex="0" ' +
      'aria-label="Feedback from ' + esc(f.a) + ', ' + n + ' backing. Open">' +
    statusBadge(f.st) + shot +
    '<p class="body">' + esc(f.t) + '</p>' +
    '<div class="fb-note-foot">' +
      '<span class="fb-who"><span class="fb-av">' + esc(initials(f.a)) + '</span>' +
      '<span class="n">' + esc(String(f.a).split(' ')[0]) + '</span></span>' +
      '<button class="fb-vote' + (mine ? ' is-mine' : '') + '" type="button" ' +
        'data-vote="' + esc(f.i) + '"' +
        (!mine && f.st !== 'shipped' && left() <= 0 ? ' disabled' : '') +
        ' aria-pressed="' + (mine ? 'true' : 'false') + '" ' +
        'aria-label="' + (mine ? 'You voted for this. Remove your vote' : 'Vote this') +
        ', ' + n + ' so far">' +
        '<i class="ph-fill ph-caret-up"></i>' + n +
      '</button>' +
    '</div>' +
  '</div>';
}

/* The first load. Placed by the same pass the real notes are, so the
   skeleton scatters the way the board will rather than promising a
   layout the board does not have. */
function skeleton() {
  var one = '<div class="fb-note fb-sk-note" style="--fb-rot:0deg">' +
    '<div class="fb-sk w90"></div><div class="fb-sk w70"></div>' +
    '<div class="fb-sk w45"></div></div>';
  return one + one + one + one + one;
}

function emptyHTML() {
  var filtered = STATE.notes.length > 0;
  if (filtered) {
    return '<div class="c-empty"><i class="ph ph-funnel"></i>' +
      '<h4>Nothing matches that filter</h4>' +
      '<p>There are ' + STATE.notes.length + ' notes on the board. Widen the filter to see them.</p>' +
      '<div class="fb-empty-actions">' +
      '<button class="c-btn c-btn-secondary c-btn-sm" type="button" id="fbClearFilters">Clear filters</button>' +
      '</div></div>';
  }
  return '<div class="c-empty"><i class="ph ph-lightbulb-filament"></i>' +
    '<h4>Nobody has posted yet</h4>' +
    '<p>Say what got in your way this week. One sentence is enough. The board groups ' +
      'related notes on its own once a few are in.</p>' +
    '<div class="fb-empty-actions">' +
    '<button class="c-btn c-btn-primary c-btn-sm" type="button" id="fbFirst">' +
      '<i class="ph ph-plus"></i> Write the first one</button>' +
    '<button class="c-btn c-btn-ghost c-btn-sm" type="button" id="fbSeed">' +
      'Post six examples to try it</button>' +
    '</div></div>';
}

function renderBudget() {
  var l = left(), pips = '';
  // solid first, hollowing out from the right, the way a battery empties.
  // Spent-first read as a bar filling up, which is the opposite meaning.
  for (var i = 0; i < STATE.budget; i++) {
    pips += '<span class="pip' + (i < l ? '' : ' spent') + '"></span>';
  }
  document.getElementById('fbPips').innerHTML = pips;
  var box = document.getElementById('fbBudget');
  /* The label is the only place the count is written down now, so it is
     the one thing a screen reader has to go on. */
  box.setAttribute('aria-label',
    l === 0 ? 'No votes left' : (l === 1 ? '1 vote left' : l + ' votes left'));
  box.classList.toggle('is-out', l === 0);
}

/* The standing "this board is on your device only" banner is gone,
   acknowledged and deliberately so while the shared store is still being
   decided. What is NOT gone is the toast in offline() above: a banner
   that is always there stops being read, but somebody whose write just
   failed to reach the group has to be told at the moment it happens.
   The Posted toast also still says which of the two happened. */

/* Where every note was before the redraw, keyed by id. Read at the top of
   render() and spent at the bottom of it, so it never survives a frame. */
function snapshot() {
  var map = {}, notes = document.querySelectorAll('#fbBoard .fb-note');
  for (var i = 0; i < notes.length; i++) {
    var id = notes[i].dataset.open;
    if (id) map[id] = notes[i].getBoundingClientRect();
  }
  return map;
}

/* The move, played after the new positions are set. render() rebuilds the
   canvas from scratch, so the notes that come back are different elements
   with no memory of where they were and the board changed shape in one
   frame — which is what pressing Cluster looked like. This measures the
   old rects, puts each note back where it was with a transform, and lets
   it travel to zero.

   The rotation has to be carried through both keyframes or the note
   un-tilts on the way, and the whole thing is skipped for anything that
   was not on the board a moment ago: a note arriving from a filter has
   nowhere to travel from, and should just be there. */
function playMove(before) {
  if (REDUCED) return;
  var notes = document.querySelectorAll('#fbBoard .fb-note'), moved = 0;
  for (var i = 0; i < notes.length; i++) {
    var el = notes[i], was = before[el.dataset.open];
    if (!was) continue;
    var now = el.getBoundingClientRect();
    var dx = was.left - now.left, dy = was.top - now.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
    var r = el.style.getPropertyValue('--fb-rot') || '0deg';
    el.animate([
      {transform: 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) rotate(' + r + ')'},
      {transform: 'translate(0,0) rotate(' + r + ')'}
    ], {
      duration: 520,
      /* Staggered by reading order, capped so a big board does not end up
         with a note that starts moving half a second late. */
      delay: Math.min(moved * 22, 220),
      easing: 'cubic-bezier(.32,.72,.3,1)',
      fill: 'backwards'
    });
    moved++;
  }
  PEEK.dirty = true;
}

function render() {
  var before = snapshot();
  renderBudget();

  var host = document.getElementById('fbBoard');
  host.classList.toggle('is-clustered', STATE.clustered);

  if (!STATE.loaded && !STATE.notes.length) {
    host.classList.remove('is-flow');
    host.innerHTML = skeleton();
    layout(host, null);
    return;
  }

  var list = visible();
  if (!list.length) {
    host.classList.add('is-flow');
    host.style.removeProperty('--fb-h');
    host.innerHTML = emptyHTML();
    return;
  }
  host.classList.remove('is-flow');

  /* Shipped work stays on the canvas — it is the proof the board works —
     but it is done, so it sorts to the back of the run and sits at 60%.
     It no longer gets a pen of its own: a fenced-off section is exactly
     the box this canvas is trying not to draw. */
  var order = list.slice().sort(function (a, b) {
    var sa = a.st === 'shipped' ? 1 : 0, sb = b.st === 'shipped' ? 1 : 0;
    if (sa !== sb) return sa - sb;
    if (STATE.sort === 'new') return new Date(b.ts || 0) - new Date(a.ts || 0);
    var d = (b.v || []).length - (a.v || []).length;
    return d || (new Date(b.ts || 0) - new Date(a.ts || 0));
  });

  /* Cluster mode runs the same matcher the board has always used; the
     only thing that changes is where the notes are put. Regions come
     back as indices into `open`, so the drifts are built here and the
     placement is left to layout(). */
  var drifts = null;
  if (STATE.clustered) {
    var open = order.filter(function (f) { return f.st !== 'shipped'; });
    var done = order.filter(function (f) { return f.st === 'shipped'; });
    var regions = group(open).regions.sort(function (x, y) {
      return (y.idx.length - x.idx.length) ||
             (sumVotes(y.idx, open) - sumVotes(x.idx, open));
    });
    /* Everything the matcher could not place goes into one drift, not one
       drift each. A board of twelve notes where nine group produces three
       singletons, and three labels reading "On its own · 1" is three
       labels saying the same thing about different paper. */
    var loose = [];
    drifts = [];
    regions.forEach(function (g) {
      var notes = g.idx.map(function (i) { return open[i]; });
      if (!g.term) { loose = loose.concat(notes); return; }
      drifts.push({term: g.term, why: g.why, notes: notes});
    });
    if (loose.length) drifts.push({term: null, why: [], notes: loose});
    /* Shipped is a drift like any other, named rather than fenced. */
    if (done.length) drifts.push({term: 'shipped', why: [], notes: done, done: true});
    order = drifts.reduce(function (acc, d) { return acc.concat(d.notes); }, []);
  }

  /* Interleaved, not notes-then-labels: the label is a heading for the
     run that follows it, and emitting all ten notes and then all five
     headings reads correctly to nobody. Placement is absolute either way,
     so the DOM order costs nothing visually and is the only order a
     screen reader or the tab key has to go on. layout() walks .fb-note
     and .fb-drift by index, and both stay in drift order this way. */
  host.innerHTML = drifts
    ? drifts.map(function (d) {
        return driftHTML(d) + d.notes.map(noteHTML).join('');
      }).join('')
    : order.map(noteHTML).join('');

  layout(host, drifts);
  playMove(before);
}

function sumVotes(idx, list) {
  var t = 0;
  for (var i = 0; i < idx.length; i++) t += (list[idx[i]].v || []).length;
  return t;
}

/* The cluster's name and the words that made it one. Type on the canvas:
   the heading names one word, the tail says what else the group has in
   common, so a grouping can be checked rather than believed. That was
   true when regions were cards and it is still the reason this text
   exists now that they are not. */
function driftHTML(d) {
  var name = d.term ? d.term.charAt(0).toUpperCase() + d.term.slice(1) : 'On its own';
  var tail = d.why && d.why.length ? ' &middot; ' + d.why.map(esc).join(', ') : '';
  /* A real heading. It is the only thing that says these notes belong
     together once the boxes are gone, so it has to carry that meaning to
     a reader who cannot see them sitting close. */
  return '<h2 class="fb-drift">' + esc(name) +
    ' <span class="n">' + d.notes.length + tail + '</span></h2>';
}

/* ═══ 5b. Placement ════════════════════════════════════════════════════

   Notes are absolutely positioned, so this is what decides the board's
   shape. Two arrangements, one pass.

   SCATTER runs the notes left to right in overlapping rows. The overlap
   is the point: a gap between every card reads as a list with bad
   margins, and the wall only looks like a wall once the papers touch.

   CLUSTER keeps the same run but breaks it at the drifts, each one
   labelled and separated by a gap wide enough to read as a break without
   drawing a line.

   Heights are measured rather than assumed, because a note with a
   screenshot is roughly twice a one-line note and a row packed on an
   assumed height would either collide or leave a band of empty canvas.
