<style>
  /* The artifact's Activities page, made live and given surfaces: role chips
     across the top, a summary card for the chosen role, then the groups as
     cards in two columns with a checkbox row per activity. Held rows in ink,
     the rest faded. */
  .rp-chips{display:flex; flex-wrap:wrap; gap:var(--spacing-8); margin-bottom:var(--spacing-24);}
  .rp-chip{height:40px; padding:0 var(--spacing-16) 0 var(--spacing-20); border-radius:var(--radius-pill); border:1px solid var(--color-neutral-3);
    background:var(--color-neutral-1); font-family:inherit; font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-5);
    cursor:pointer; display:inline-flex; align-items:center; gap:var(--spacing-8); box-shadow:var(--shadow-1);
    transition:background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard),
      border-color var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-settle);}
  .rp-chip:hover{background:var(--color-neutral-2); color:var(--color-neutral-9); transform:translateY(-1px);}
  .rp-chip[aria-pressed="true"]{background:var(--color-obsidian); border-color:var(--color-obsidian); color:var(--color-neutral-1); box-shadow:none;}
  .rp-chip:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:2px;}
  .rp-chip .n{font-weight:600; font-size:var(--text-caption-size); color:var(--color-neutral-4); padding:1px 7px; border-radius:var(--radius-pill); background:var(--color-neutral-2);}
  .rp-chip[aria-pressed="true"] .n{background:rgba(255,255,255,.16); color:var(--color-neutral-1);}
  .rp-chip .dot{width:6px; height:6px; border-radius:var(--radius-pill); background:var(--color-amber);}

  /* The summary card: who this role is, how many carry it, how much it holds. */
  .rp-summary{display:grid; grid-template-columns:minmax(0,1.4fr) repeat(3, minmax(0,1fr)); gap:var(--spacing-24); align-items:start;
    padding:var(--spacing-20) var(--spacing-24); margin-bottom:var(--spacing-24);
    background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-lg); box-shadow:var(--shadow-1);}
  .rp-summary h2{margin:0; font-size:var(--text-h3-size); font-weight:800; line-height:1.15;}
  .rp-summary .meaning{margin:var(--spacing-4) 0 0; font-size:var(--text-body2-size); color:var(--color-neutral-5); line-height:1.45;}
  .rp-summary .who{display:flex; align-items:flex-start; gap:var(--spacing-12);}
  .rp-summary .who .c-search-input-avatar{width:40px; height:40px; font-size:14px; font-weight:800; background:var(--color-obsidian); color:var(--color-neutral-1);}
  .rp-stat .k{font-size:var(--text-label3-size); font-weight:700; letter-spacing:var(--tracking-eyebrow); text-transform:uppercase; color:var(--color-neutral-5);}
  .rp-stat .v{margin-top:4px; font-size:var(--text-h4-size); font-weight:800; font-variant-numeric:tabular-nums;}
  .rp-stat .s{font-size:var(--text-caption-size); color:var(--color-neutral-5); margin-top:2px;}
  /* The count is the way into the directory, filtered to this role. */
  .rp-stat-link{display:inline-block; color:var(--color-neutral-9); text-decoration:none; border-radius:var(--radius-sm);}
  .rp-stat-link:hover{text-decoration:underline; text-underline-offset:4px;}
  .rp-stat-link:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:4px;}
  .rp-bar{height:4px; border-radius:var(--radius-pill); background:var(--color-neutral-2); margin-top:var(--spacing-8); overflow:hidden;}
  .rp-bar i{display:block; height:100%; background:var(--color-obsidian); border-radius:var(--radius-pill); transition:width var(--duration-slow) var(--ease-settle);}
  .rp-summary .actions{display:flex; flex-direction:column; align-items:flex-end; gap:var(--spacing-8); text-align:right;}
  .rp-summary .actions .last{font-size:var(--text-caption-size); color:var(--color-neutral-5);}

  .rp-note{display:flex; align-items:flex-start; gap:var(--spacing-8); padding:var(--spacing-12) var(--spacing-16); margin:0 0 var(--spacing-24);
    border-radius:var(--radius-md); background:var(--color-canvas-warm-card, var(--color-neutral-2));
    font-size:var(--text-caption-size); color:var(--color-neutral-5); line-height:1.45;}
  .rp-note i{flex:none; font-size:16px; margin-top:1px; color:var(--color-neutral-9);}

  /* Group cards. */
  /* Cards on the same row share a height: the grid stretches them and the
     rows area takes up the slack, so the two columns read as one surface. */
  .rp-grid{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:var(--spacing-20); align-items:stretch;}
  .rp-group{display:flex; flex-direction:column; background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); overflow:hidden;
    animation:rp-arrive .38s var(--ease-settle) both;}
  @keyframes rp-arrive{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){ .rp-group{animation:none;} }
  .rp-group-head{display:flex; align-items:center; gap:var(--spacing-12); padding:var(--spacing-12) var(--spacing-16);
    border-bottom:1px solid var(--color-neutral-3); background:var(--color-canvas-warm-card, var(--color-neutral-2));}
  .rp-group-head .ic{flex:none; width:32px; height:32px; border-radius:var(--radius-sm); display:inline-flex; align-items:center; justify-content:center;
    background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); color:var(--color-neutral-9); font-size:16px;}
  .rp-group-head h3{margin:0; flex:1; font-size:var(--text-body1-size); font-weight:800;}
  .rp-group-head .held{font-size:var(--text-caption-size); font-weight:700; color:var(--color-neutral-5); font-variant-numeric:tabular-nums;}
  .rp-group-head .held b{color:var(--color-neutral-9);}
  .rp-rows{flex:1; padding:var(--spacing-4) var(--spacing-8);}
  .rp-row{display:flex; align-items:flex-start; gap:var(--spacing-12); width:100%; padding:10px var(--spacing-8);
    border:0; border-bottom:1px solid var(--color-neutral-2); border-radius:0; background:transparent; font-family:inherit; font-size:var(--text-body2-size); color:var(--color-neutral-9);
    text-align:left; cursor:pointer; line-height:1.45; transition:background-color var(--duration-fast) var(--ease-standard);}
  .rp-row:last-child{border-bottom:0;}
  .rp-row:hover{background:var(--color-neutral-2);}
  .rp-row:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
  .rp-row.off{color:var(--color-neutral-5);}
  .rp-row .c-checkbox-box{margin-top:2px; font-size:12px; transition:background-color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-settle);}
  .rp-row:active .c-checkbox-box{transform:scale(.9);}
  .rp-row.off .c-checkbox-box{border-color:var(--color-neutral-3); background:var(--color-neutral-1);}
  .rp-row .lock{margin-left:auto; flex:none; font-size:14px; color:var(--color-neutral-4); margin-top:3px;}
  .rp-row.is-static{cursor:default;}
  .rp-row.is-static:hover{background:transparent;}
  .rp-denied{max-width:420px; margin:var(--spacing-60) auto;}
  .rp-denied a{text-decoration:none;}
  @media (max-width:1100px){ .rp-summary{grid-template-columns:1fr 1fr;} .rp-summary .actions{align-items:flex-start; text-align:left;} }
  @media (max-width:900px){ .rp-grid{grid-template-columns:1fr;} .rp-summary{grid-template-columns:1fr;} }
</style>
<style>
/* Pods, in the nav. Element marks are SVG files rather than Phosphor
   glyphs, so they sit inside the item's own <i> slot at the icon size:
   the collapsed rail's hover label anchors on that <i>, and an <img>
   in its place left the label with nothing to find. Everything else
   is the DS's sidebar item. A "soon" row is the DS's locked variant with
   its hover invitation removed, and its badge leaves with the label
   when the rail collapses, or the 72px rail would be the one place a
   badge ever sat beside a lone icon. */
.c-pod-mark{width:var(--icon-base); height:var(--icon-base); flex:none; display:inline-flex;}
.c-pod-mark img{width:100%; height:100%; display:block; object-fit:contain;}
.c-sidebar-item.soon .c-pod-mark{opacity:.4;}
.c-sidebar-item.soon:hover{background:transparent;}
.c-sidebar.is-collapsed .c-sidebar-item .c-badge{display:none;}
/* The one line that says what a pod is. Caption size at body weight,
   under the eyebrow it explains; it leaves with the labels when the
   rail collapses, where there is no room for a sentence. */
.c-sidebar-caption{margin:0; padding:0 var(--spacing-8) var(--spacing-8); font-size:var(--text-caption-size); font-weight:500; line-height:1.4; color:var(--color-neutral-5); flex-shrink:0;}
.c-sidebar.is-collapsed .c-sidebar-caption{display:none;}
/* The logo as a home link, and the group the tour spotlights. The link
   hides in the collapsed rail exactly as the old trigger did; the
   collapsed coin stands in for it there. */
.c-sidebar-logo-home{display:inline-flex; align-items:center;}
.c-sidebar.is-collapsed .c-sidebar-logo-home{display:none;}
.c-nav-tree{display:flex; flex-direction:column; gap:var(--spacing-4); flex-shrink:0;}
a.c-sidebar-item, a.c-nav-child{text-decoration:none;}
.c-nav-child.soon{color:var(--color-neutral-4); cursor:not-allowed;}
.c-nav-child.soon:hover{background:transparent;}
</style>
</head>

<div class="c-shell">
  <div class="c-sidebar-shell" id="shellSidebarShell">
    <nav class="c-sidebar" id="shellSidebarNav">
      <div class="c-sidebar-header">
        <!-- The logo is the home link it reads as. The way across to the
             other pods is the Pods section below, so nothing hides here. -->
          <a class="c-sidebar-logo-home" href="landing-v3.html" aria-label="Collabrium home"><span class="c-sidebar-logo-live-wrap"><iframe src="../collabrium-dls/logo.html" title="Collabrium" scrolling="no"></iframe></span></a>
        <img class="c-sidebar-logo-collapsed" src="../collabrium-dls/SVG/coin.svg" alt="Collabrium" />
      </div>
      <!-- The nav is the pods map, rendered by shared/pods.js so every
           app draws the same one. This page's own pod sits first with its
           entries open beneath it and nothing to toggle; a divider follows;
           every other pod is one row that leads to its front door. The

    <button class="c-sidebar-toggle" type="button" aria-label="Collapse sidebar" id="sidebarToggle">

  <div class="c-shell-main">

              <h1>Roles &amp; permissions</h1>

<script>
/* A blank page tells nobody anything. If the page's own script fails before
   it paints, say so where the content would be, with a way to clear this
   browser's stored data, which is the usual cause after a stale load. */
window.addEventListener('error', function (e) {
  var c = document.getElementById('content');
  if (!c || c.children.length) return;
  var msg = (e && e.message) || 'Unknown error';
  c.innerHTML = '<div class="c-empty" style="max-width:520px;margin:48px auto"><i class="ph ph-warning-circle"></i>' +
    '<h4>This page could not load</h4><p>' + String(msg).replace(/[&<>]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]; }) +
    '</p><p>Reload with a fresh copy, or clear this browser\'s stored data for the prototype and reload.</p>' +
    '<button class="c-btn c-btn-secondary c-btn-md" type="button" onclick="[\'collabrium.access.directory\',\'collabrium.access.overrides\',\'collabrium.access.viewer\'].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});location.reload(true)">Clear stored data and reload</button></div>';
});
</script>
<script src="../shared/access.js?v=6"></script>
<script src="../shared/shell.js?v=4"></script>
<script>
(function () {
  var A = window.CollabAccess, Sh = window.CollabShell, esc = Sh.esc;
  var S = localStorage;
  var VIEW_GATE = 'Invite / add a user to the workspace';
  var MEANING = {
    super_admin: 'Platform ceiling: every activity, everywhere.',
    admin: 'Hub administrator. On Mothership, mirrors Leadership plus the console items.',
    leadership: 'Company-wide view of the Sales Board.',
    sales_vp: 'Own org: the line they run.',
    head_of_sales: 'Own team: the book they head.',
    sales_manager: 'Own pod.',
    sales_rep: 'Own quota and own campaigns.',
    marketing_services: 'Owns Inventory, Bundles and Brand Profiles.',
    creative_strategist: 'Own campaigns; intelligence and case studies.',
    infl_admin: 'Hub administrator for Collab: Influencer.',
    infl_manager: 'Full access; views Users & Permissions, cannot manage it.',
    viewer: 'No standing access; responds to their own preview or draft.'
  };
  var GROUP_ICON = {
    'Manage workspace': 'ph-sliders-horizontal', 'Manage user access': 'ph-users-three', 'Sales Board data & targets': 'ph-chart-bar',
    'Manage external access': 'ph-globe-hemisphere-west', 'Audit & compliance': 'ph-shield-check', 'Export': 'ph-export', 'Collaborate': 'ph-chats-circle',
    'Tools': 'ph-wrench', 'Browse': 'ph-books', 'Administration': 'ph-gear-six', 'Reference Data': 'ph-database', 'Insight': 'ph-chart-line-up'
  };
  var viewer, store;
  /* Opened from a person's sheet, the page lands on that person's role. */
  var wanted = (function () { try { return new URLSearchParams(location.search).get('role'); } catch (e) { return null; } })();
  var state = { matrix: 'mothership', role: wanted && A.ROLES.some(function (r) { return r.key === wanted; }) ? wanted : 'admin' };



  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'June', 'July', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
  function fmtWhen(iso) {
    var d = new Date(iso);
    return d.getDate() + ' ' + MON[d.getMonth()] + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  /* How many directory users carry this role, on this matrix. The
     Influencer tab counts by Influencer role among those with that hub. */
  function countFor(matrixKey, roleKey) {
    if (!store) return null;
    var all = store.list();
    if (matrixKey === 'influencer' && roleKey !== 'super_admin') {
      return all.filter(function (r) { return r.hubs.indexOf('influencer') !== -1 && r.influencerRole === roleKey; }).length;
    }
    return all.filter(function (r) { return r.role === roleKey; }).length;
  }
  function firstRole(m) { return m.roles.filter(function (r) { return r.key !== 'super_admin'; })[0].key; }

  function render() {
    var content = document.getElementById('content');
    if (!A.holds(viewer.role, VIEW_GATE)) {
      content.innerHTML = '<div class="c-empty rp-denied"><i class="ph ph-lock-simple"></i><h4>Admin only</h4>' +
        '<p>' + esc(A.DENIED) + '</p><a class="c-btn c-btn-secondary c-btn-md" href="settings.html">Back to Settings</a></div>';
      return;
    }
    var m = A.MATRICES[state.matrix];
    if (!m.roles.some(function (r) { return r.key === state.role; })) state.role = firstRole(m);
    var canEdit = A.mayEditRoles(viewer);
    var role = m.roles.filter(function (r) { return r.key === state.role; })[0];
    var n = countFor(m.key, role.key);
    var modified = A.isModified(m.key, role.key);
    var last = A.lastChange(m.key, role.key);

    /* Mothership only: each hub's own matrix is set inside that hub's pod. */
    var h = '';

    /* Role chips: the artifact's own row, each with its user count. A dot
       marks a role with edits. */
    h += '<div class="rp-chips" role="group" aria-label="Role">' + m.roles.map(function (r) {
      var on = r.key === role.key, c = countFor(m.key, r.key);
      return '<button class="rp-chip" type="button" data-role="' + r.key + '" aria-pressed="' + on + '">' + esc(r.label) +
        (c === null ? '' : '<span class="n" aria-label="' + c + (c === 1 ? ' user' : ' users') + '">' + c + '</span>') +
        (A.isModified(m.key, r.key) ? '<span class="dot" aria-label="modified"></span>' : '') + '</button>';
    }).join('') + '</div>';

    /* What this role holds, in numbers. */
    var totalActs = 0, heldActs = 0;
    m.groups.forEach(function (g) { g.items.forEach(function (item) { totalActs++; if (A.holdsIn(m.key, role.key, item.label)) heldActs++; }); });
    var pct = totalActs ? Math.round(heldActs / totalActs * 100) : 0;
    h += '<div class="rp-summary">' +
      '<div class="who"><span class="c-search-input-avatar" aria-hidden="true">' + esc(A.initials(role.label)) + '</span><div>' +
        '<h2 id="paneTitle" tabindex="-1">' + esc(role.label) + '</h2><p class="meaning">' + esc(MEANING[role.key] || '') + '</p></div></div>' +
      '<div class="rp-stat"><div class="k">Users</div>' +
        (n === null ? '<div class="v">—</div>'
                    : '<a class="v rp-stat-link" href="users.html?role=' + encodeURIComponent(role.key) + '" aria-label="See the ' + n + (n === 1 ? ' user' : ' users') + ' with the role ' + esc(role.label) + ' in the directory">' + n + '</a>') +
        '<div class="s">carry this role</div></div>' +
      '<div class="rp-stat"><div class="k">Activities</div><div class="v">' + heldActs + ' <span style="font-weight:500;color:var(--color-neutral-5)">of ' + totalActs + '</span></div>' +
        '<div class="rp-bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div><div class="s">' + esc(m.title) + '</div></div>' +
      '<div class="actions">' +
        (modified ? '<span class="c-badge c-badge-warning">Modified from default</span>' : '<span class="c-badge c-badge-neutral">Artifact default</span>') +
        (last ? '<span class="last">Last change ' + esc(fmtWhen(last.at)) + ' by ' + esc(last.by) + (last.label === null ? ', reset' : '') + '</span>' : '') +
        (canEdit && modified ? '<button class="c-btn c-btn-secondary c-btn-sm" type="button" id="reset"><i class="ph ph-arrow-counter-clockwise"></i> Reset to default</button>' : '') +
      '</div></div>';

    if (role.key === 'super_admin') {
      h += '<div class="rp-note"><i class="ph-fill ph-lock-simple"></i><span>Super Admin is the platform ceiling: every activity, everywhere. The ceiling cannot lower itself, so nothing here can be unticked.</span></div>';
    } else if (!canEdit) {
      h += '<div class="rp-note"><i class="ph-fill ph-eye"></i><span>' + esc(A.ROLES_ARE_SUPER) + ' You can see what this role holds; only a Super Admin can change it.</span></div>';
    } else {
      h += '<div class="rp-note"><i class="ph-fill ph-cursor-click"></i><span>Tick or untick an activity to change what ' + esc(role.label) + ' can do in ' + esc(m.title) + '. Changes apply at once and show in the directory\'s role checklist. Locked items are Super Admin only, by design.</span></div>';
    }

    h += '<div class="rp-grid">' + m.groups.map(function (g, gi) {
      var held = g.items.filter(function (item) { return A.holdsIn(m.key, role.key, item.label); }).length;
      return '<section class="rp-group" style="animation-delay:' + (gi * 40) + 'ms">' +
        '<div class="rp-group-head"><span class="ic" aria-hidden="true"><i class="ph ' + (GROUP_ICON[g.title] || 'ph-list-checks') + '"></i></span>' +
        '<h3>' + esc(g.title) + '</h3><span class="held"><b>' + held + '</b> of ' + g.items.length + '</span></div><div class="rp-rows">' +
        g.items.map(function (item) {
          var on = A.holdsIn(m.key, role.key, item.label);
          var lock = A.lockReason(m.key, role.key, item.label);
          var isStatic = !canEdit || !!lock;
          return '<button class="rp-row' + (on ? '' : ' off') + (isStatic ? ' is-static' : '') + '" type="button" role="checkbox" aria-checked="' + on + '"' +
            (isStatic ? ' aria-disabled="true"' : '') + ' data-label="' + esc(item.label) + '"' + (lock ? ' title="' + esc(lock) + '"' : '') + '>' +
            '<span class="c-checkbox-box' + (on ? ' on' : '') + '" aria-hidden="true">' + (on ? '<i class="ph ph-check"></i>' : '') + '</span>' +
            '<span>' + esc(item.label) + '</span>' +
            (lock && role.key !== 'super_admin' ? '<i class="ph ph-lock-simple lock" aria-hidden="true"></i>' : '') + '</button>';
        }).join('') + '</div></section>';
    }).join('') + '</div>';
    content.innerHTML = h;
    wire();
  }

  function wire() {
    /* Every handler re-renders, so each one puts focus back where it was. */
    function refocus(sel) { var el = document.querySelector(sel); if (el) el.focus(); }
    document.querySelectorAll('.rp-chip').forEach(function (b) {
      b.addEventListener('click', function () { state.role = b.dataset.role; render(); refocus('.rp-chip[data-role="' + state.role + '"]'); });
    });
    document.querySelectorAll('.rp-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var label = row.dataset.label;
        if (row.getAttribute('aria-disabled') === 'true') {
          Sh.toast('neutral', 'Not changed', A.lockReason(state.matrix, state.role, label) || A.ROLES_ARE_SUPER);
          return;
        }
        var on = row.getAttribute('aria-checked') === 'true';
        var err = A.setOverride(S, viewer, state.matrix, state.role, label, !on);
        if (err) { Sh.toast('warning', 'Not changed', err); return; }
        render();
        refocus('.rp-row[data-label="' + CSS.escape(label) + '"]');
      });
    });
    var reset = document.getElementById('reset');
    if (reset) reset.addEventListener('click', function () {
      var err = A.resetRole(S, viewer, state.matrix, state.role);
      if (err) { Sh.toast('warning', 'Not reset', err); return; }
      var m = A.MATRICES[state.matrix];
      var role = m.roles.filter(function (r) { return r.key === state.role; })[0];
      render();
      refocus('#paneTitle');
      Sh.toast('success', 'Reset to default', m.title + ' · ' + (role ? role.label : state.role));
    });
  }

  /* ── Boot, after every helper above exists ─────────────────────────── */
  A.loadOverrides(S);
  viewer = Sh.init({ onViewerChange: function (v) { viewer = v; render(); } });
  render();   /* the matrix needs no data; the counts arrive with the chart */
  fetch('../data/org-tree.json').then(function (r) {
    if (!r.ok) throw new Error('org-tree.json ' + r.status);
    return r.json();
  }).then(function (tree) {
    store = A.createStore({ seed: A.buildSeed(tree), storage: S });
    render();
  }).catch(function () { store = null; render(); });
})();
</script>
</body>
